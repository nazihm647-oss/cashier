<style>
*{box-sizing:border-box}
body{margin:0;font-family:'Cairo',Arial,sans-serif;background:#f1f8f2;color:#1b3a1f}

.topbar{background:linear-gradient(90deg,var(--g),var(--g2));color:#fff;padding:8px 14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}

.split{display:flex;gap:12px;align-items:flex-start}

.banner b{font-size:18px}

.xbtn{background:none;border:none;font-size:22px;cursor:pointer;color:#888}
.invlink{color:var(--b);cursor:pointer;text-decoration:underline;font-weight:700}
.hint{font-size:13px;margin:-4px 0 8px}.hint.ok{color:#2e7d32}.hint.bad{color:#c62828}

label.lb{font-weight:700;font-size:14px}
</style>

<div id="loading"><div class="logo">🛒</div><div style="margin-top:10px">جاري التحميل...</div></div>

<div id="login">
 <div class="loginBox">
  <div class="logo" style="width:80px;height:80px;font-size:44px;background:#e8f5e9">🛒</div>

<div id="modalOverlay"><div class="modal" id="modalBox"><h3><span id="modalTitle"></span><button class="xbtn" onclick="closeModal()">✕</button></h3><div id="modalBody"></div></div></div>
<div id="scanOverlay"><div class="modal"><h3>📷 مسح الباركود</h3><div id="qrReader" style="width:100%"></div><button class="btn btn-red" style="width:100%;margin-top:8px" onclick="stopScanner()">إلغاء</button></div></div>

<script>
var APP_BUILD = 13;
var firebaseConfig = {
  apiKey: "AIzaSyDIp3OlRAP0Wa7Ea1W87NZkYAwOe0xueSQ",
  authDomain: "casheir-840ee.firebaseapp.com",
  projectId: "casheir-840ee",
  storageBucket: "casheir-840ee.firebasestorage.app",
  messagingSenderId: "1078746217763",
  appId: "1:1078746217763:web:7f74831f502ca1b20be096"
};
var ROLE_PERMISSIONS = {
  admin: ['cashier','purchases','disbursements','returns','wallets','live','inventory','products','reports','profit','safe','deficits','users'],
  cashier: ['cashier','purchases','disbursements','returns','wallets','reports']
};
var SYNC_KEYS = ['cashier_users','cashier_products','cashier_sales','cashier_purchases','cashier_suppliers','cashier_disbursements','cashier_shifts','cashier_stock_adjustments','cashier_counts','cashier_wallets','cashier_wallet_transactions','cashier_safe','cashier_safe_transactions','cashier_returns','cashier_damages','invoice_counter','purchase_counter','wallet_counter'];
var PAY = {cash:'نقدي',vodafone:'فودافون كاش',instapay:'انستاباي'};
var METHODS = {paid:'الكاشير سدد العجز',salary:'خصم من مستحقات الكاشير',writeoff:'شطب العجز (خسارة)'};
var TAB_DEFS = [
 {id:'cashier',icon:'💰',label:'الكاشير'},{id:'purchases',icon:'📥',label:'المشتريات'},
 {id:'disbursements',icon:'💸',label:'طلبات الصرف'},{id:'returns',icon:'↩️',label:'مرتجعات وتالف'},
 {id:'wallets',icon:'💳',label:'المحافظ'},{id:'live',icon:'📡',label:'متابعة مباشرة'},
 {id:'inventory',icon:'📦',label:'الجرد'},{id:'products',icon:'🛒',label:'المنتجات'},
 {id:'reports',icon:'📊',label:'التقارير'},{id:'profit',icon:'📈',label:'الأرباح'},
 {id:'safe',icon:'🏦',label:'الخزنة'},{id:'deficits',icon:'⚠️',label:'العجز'},{id:'users',icon:'👥',label:'المستخدمين'}
];

/* ========== Firebase ========== */
firebase.initializeApp(firebaseConfig);
var db = firebase.firestore();
try{ db.enablePersistence({synchronizeTabs:true}).catch(function(){}); }catch(e){}
var COL = 'cashier_data';
var _dataCache = {};
var DATA_READY = false;
var CURRENT_USER = null;
var currentTab = 'cashier';

function defaultValueFor(k){
  if(k==='cashier_wallets') return {vodafone:0,instapay:0};
  if(k==='cashier_safe') return {balance:0};
  if(k==='invoice_counter'||k==='purchase_counter'||k==='wallet_counter') return 0;
  return [];
}
function load(k){ var v=_dataCache[k]; return (v===undefined||v===null)?defaultValueFor(k):v; }
function save(k,v){ _dataCache[k]=v; return db.collection(COL).doc(k).set({v:v,updatedAt:Date.now()}); }
function genId(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,8); }

function nextCounter(key,start){
  var ref=db.collection(COL).doc(key);
  return db.runTransaction(function(t){
    return t.get(ref).then(function(s){
      var n; if(!s.exists||typeof s.data().v!=='number') n=start; else n=s.data().v+1;
      t.set(ref,{v:n,updatedAt:Date.now()}); return n;
    });
  }).then(function(n){ _dataCache[key]=n; return n; });
}
function adjustSafeBalance(delta,tx){
  var sRef=db.collection(COL).doc('cashier_safe'), tRef=db.collection(COL).doc('cashier_safe_transactions');
  var res={};
  return db.runTransaction(function(t){
    return Promise.all([t.get(sRef),t.get(tRef)]).then(function(r){
      var safe=r[0].exists?(r[0].data().v||{balance:0}):{balance:0};
      var txs=r[1].exists?(r[1].data().v||[]):[];
      var nb=Math.round((num(safe.balance)+delta)*100)/100;
      var rec=Object.assign({id:genId(),date:new Date().toISOString(),user:CURRENT_USER?CURRENT_USER.displayName:''},tx||{});
      rec.amount=delta; txs=txs.concat([rec]);
      t.set(sRef,{v:{balance:nb},updatedAt:Date.now()});
      t.set(tRef,{v:txs,updatedAt:Date.now()});
      res={balance:nb,txs:txs};
    });
  }).then(function(){
    _dataCache['cashier_safe']={balance:res.balance}; _dataCache['cashier_safe_transactions']=res.txs;
    if(!modalOpen()&&currentTab==='safe')renderSafe();
    return res.balance;
  });
}
function adjustWalletBalance(wallet,delta,tx){
  var wRef=db.collection(COL).doc('cashier_wallets'), tRef=db.collection(COL).doc('cashier_wallet_transactions');
  var res={};
  return db.runTransaction(function(t){
    return Promise.all([t.get(wRef),t.get(tRef)]).then(function(r){
      var w=r[0].exists?(r[0].data().v||{vodafone:0,instapay:0}):{vodafone:0,instapay:0};
      var txs=r[1].exists?(r[1].data().v||[]):[];
      w[wallet]=Math.round((num(w[wallet])+delta)*100)/100;
      var rec=Object.assign({id:genId(),wallet:wallet,date:new Date().toISOString(),user:CURRENT_USER?CURRENT_USER.displayName:''},tx||{});
      txs=txs.concat([rec]);
      t.set(wRef,{v:w,updatedAt:Date.now()}); t.set(tRef,{v:txs,updatedAt:Date.now()});
      res={w:w,txs:txs};
    });
  }).then(function(){
    _dataCache['cashier_wallets']=res.w; _dataCache['cashier_wallet_transactions']=res.txs;
    if(!modalOpen()&&currentTab==='wallets')renderWallets();
    return res.w;
  });
}

db.collection(COL).onSnapshot(function(snap){
  snap.docChanges().forEach(function(ch){
    if(ch.type==='removed') delete _dataCache[ch.doc.id];
    else { var d=ch.doc.data(); _dataCache[ch.doc.id]=d.v; }
  });
  if(!DATA_READY && (!snap.metadata.fromCache || snap.size>0)) dataReady();
  else if(DATA_READY) refreshCurrentView();
},function(err){ console.error(err); dataReady(); });
setTimeout(function(){ if(!DATA_READY) dataReady(); },15000);

function dataReady(){
  if(DATA_READY)return; DATA_READY=true;
  $('loading').style.display='none';
  var s=null; try{ s=JSON.parse(sessionStorage.getItem('current_user')||'null'); }catch(e){}
  if(s){
    var u=findUser(s.username||s.displayName);
    if(u){ CURRENT_USER=userView(u); enterApp(); return; }
  }
  $('login').style.display='flex';
}

/* ========== Helpers ========== */
function $(id){return document.getElementById(id);}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function num(v){var n=parseFloat(v);return isNaN(n)?0:n;}
function r2(n){return Math.round(num(n)*100)/100;}
function money(n){return r2(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})+' ج.م';}
function fdate(d){if(!d)return '-';var x=new Date(d);return x.toLocaleString('en-GB',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});}
function isToday(d){return new Date(d).toDateString()===new Date().toDateString();}
function monthKey(d){var x=new Date(d);return x.getFullYear()+'-'+('0'+(x.getMonth()+1)).slice(-2);}
function isAdmin(){return CURRENT_USER&&CURRENT_USER.role==='admin';}
function me(){return CURRENT_USER?CURRENT_USER.displayName:'';}
function card(l,v,c){return '<div class="card '+(c||'')+'"><div class="l">'+l+'</div><div class="v">'+v+'</div></div>';}
function tbl(h,rows){return '<div class="tw"><table><thead><tr>'+h.map(function(x){return '<th>'+x+'</th>';}).join('')+'</tr></thead><tbody>'+(rows.length?rows.join(''):'<tr><td colspan="'+h.length+'" class="empty">لا توجد بيانات</td></tr>')+'</tbody></table></div>';}
function bd(t,c){return '<span class="bd '+c+'">'+t+'</span>';}
function scoped(list,field){ return isAdmin()?list:list.filter(function(x){return x[field]===me();}); }
function xl(filename,sheets){
  try{
    var wb=XLSX.utils.book_new();
    sheets.forEach(function(s){ var ws=XLSX.utils.json_to_sheet(s.rows.length?s.rows:[{'لا توجد بيانات':''}]); XLSX.utils.book_append_sheet(wb,ws,s.name.slice(0,31)); });
    wb.Workbook={Views:[{RTL:true}]};
    XLSX.writeFile(wb,filename);
  }catch(e){alert('تعذر التصدير: '+e.message);}
}
window.onerror=function(m){console.error(m);};

/* ========== Modal / Scanner ========== */
function openModal(title,html,wide){ $('modalBox').className=wide?'modal wide':'modal'; $('modalTitle').innerHTML=title; $('modalBody').innerHTML=html; $('modalOverlay').style.display='flex'; }
function closeModal(){ $('modalOverlay').style.display='none'; $('modalBody').innerHTML=''; }
function modalOpen(){ return $('modalOverlay').style.display==='flex'||$('scanOverlay').style.display==='flex'; }
var SCANNER=null;
function openScanner(cb){
  if(typeof Html5Qrcode==='undefined'){alert('مكتبة المسح لم تُحمّل');return;}
  $('scanOverlay').style.display='flex';
  SCANNER=new Html5Qrcode('qrReader'); var done=false;
  SCANNER.start({facingMode:'environment'},{fps:10,qrbox:{width:250,height:150}},function(text){
    if(done)return; done=true; stopScanner(function(){cb(text);});
  },function(){}).catch(function(){ alert('تعذر تشغيل الكاميرا — تأكد من الصلاحية وأن الموقع HTTPS'); stopScanner(); });
}
function stopScanner(cb){
  var s=SCANNER; SCANNER=null;
  function fin(){ $('scanOverlay').style.display='none'; $('qrReader').innerHTML=''; if(cb)cb(); }
  if(s){ s.stop().then(function(){try{s.clear();}catch(e){} fin();}).catch(fin); } else fin();
}
function scanIntoField(fid){
  openScanner(function(code){
    $(fid).value=normBC(code);
    if(fid==='prodBarcode')onProdBarcodeInput(); else if(fid==='purBarcode')onPurBarcodeChange();
  });
}

/* ========== Users / Login ========== */
function defaultUsers(){return [
  {id:'u_admin',username:'MOHAMED NAZIH',displayName:'MOHAMED NAZIH',password:'admin123',role:'admin'},
  {id:'u_cash',username:'ABDALLAH',displayName:'ABDALLAH',password:'cashier123',role:'cashier'}];}
function getUsers(){var u=load('cashier_users');return (u&&u.length)?u:defaultUsers();}
function uName(u){return u.displayName||u.username||u.name||'';}
function findUser(name){
  var n=String(name||'').trim().toLowerCase();
  return getUsers().filter(function(u){return String(u.username||'').trim().toLowerCase()===n||uName(u).trim().toLowerCase()===n;})[0]||null;
}
function userView(u){return {username:u.username||uName(u),displayName:uName(u),role:u.role==='admin'?'admin':'cashier'};}
function doLogin(){
  var u=findUser($('lgUser').value);
  if(!u||String(u.password)!==$('lgPass').value){alert('اسم المستخدم أو كلمة المرور غير صحيحة');return;}
  CURRENT_USER=userView(u); sessionStorage.setItem('current_user',JSON.stringify(CURRENT_USER));
  $('lgPass').value=''; enterApp();
}
function doLogout(){ sessionStorage.removeItem('current_user'); CURRENT_USER=null; CART=[]; location.reload(); }
function enterApp(){
  $('login').style.display='none'; $('app').style.display='block';
  $('buildBadge').textContent='نسخة '+APP_BUILD;
  $('whoami').textContent='👤 '+CURRENT_USER.displayName+(isAdmin()?' (مدير)':' (كاشير)');
  buildTabs(); renderTab('cashier');
}
$('lgBuild').textContent='نسخة '+APP_BUILD;

function can(id){return ROLE_PERMISSIONS[CURRENT_USER.role].indexOf(id)>=0;}
function buildTabs(){
  var pend=load('cashier_shifts').filter(function(s){return s.deficitStatus==='pending';}).length;
  $('tabs').innerHTML=TAB_DEFS.filter(function(t){return can(t.id);}).map(function(t){
    var c=(t.id==='deficits'&&pend>0)?' <span class="cnt">'+pend+'</span>':'';
    return '<button class="tab'+(t.id===currentTab?' active':'')+'" onclick="renderTab(\''+t.id+'\')">'+t.icon+' '+t.label+c+'</button>';
  }).join('');
}
function renderTab(id){
  if(!CURRENT_USER)return;
  if(!can(id))id='cashier';
  currentTab=id; buildTabs();
  var f={cashier:renderCashier,purchases:renderPurchases,disbursements:renderDisbursements,returns:renderReturns,wallets:renderWallets,live:renderLive,inventory:renderInventory,products:renderProducts,reports:renderReports,profit:renderProfit,safe:renderSafe,deficits:renderDeficits,users:renderUsers}[id];
  f();
}
function refreshCurrentView(){
  if(!CURRENT_USER||modalOpen())return;
  var a=document.activeElement;
  if(a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)&&$('content').contains(a)){buildTabs();return;}
  renderTab(currentTab);
}
setInterval(function(){ if(CURRENT_USER&&currentTab==='live'&&!modalOpen())renderLive(); },3000);

/* ========== Barcode helpers ========== */
function normBC(b){return String(b==null?'':b).trim();}
function findByBarcode(code,excludeId,list){
  code=normBC(code); if(!code)return null;
  list=list||load('cashier_products');
  return list.filter(function(p){return normBC(p.barcode)===code&&p.id!==excludeId;})[0]||null;
}
function duplicateBarcodes(){
  var m={}; load('cashier_products').forEach(function(p){var b=normBC(p.barcode); if(b){(m[b]=m[b]||[]).push(p);}});
  return Object.keys(m).filter(function(k){return m[k].length>1;}).map(function(k){return {barcode:k,products:m[k]};});
}

/* ========== Shift ========== */
function getOpenShift(){ return load('cashier_shifts').filter(function(s){return s.cashierName===me()&&!s.closed;})[0]||null; }
function calcShiftStats(sh){
  var r={cashSalesTotal:0,walletCashTotal:0,expensesTotal:0,returnsTotal:0,expected:0,salesCount:0};
  if(!sh)return r;
  try{
    load('cashier_sales').forEach(function(s){ if(s.shiftId===sh.id){r.salesCount++; if(!s.paymentMethod||s.paymentMethod==='cash')r.cashSalesTotal+=num(s.total);} });
    var st=new Date(sh.startTime).getTime(), en=sh.endTime?new Date(sh.endTime).getTime():Infinity;
    load('cashier_wallet_transactions').forEach(function(t){
      if(t.user!==sh.cashierName)return; var tt=new Date(t.date).getTime(); if(tt<st||tt>en)return;
      if(t.operation==='withdraw')r.walletCashTotal+=num(t.amount)+num(t.commission);
      else if(t.operation==='deposit'){ r.walletCashTotal-=num(t.amount); r.walletCashTotal+=num(t.commission); }
    });
    load('cashier_disbursements').forEach(function(d){ if(d.shiftId===sh.id&&d.status==='approved'&&d.source==='drawer')r.expensesTotal+=num(d.amount); });
    load('cashier_returns').forEach(function(x){ if(x.shiftId===sh.id&&x.source==='drawer')r.returnsTotal+=num(x.refundAmount); });
  }catch(e){}
  r.expected=r2(num(sh.openingAmount)+r.cashSalesTotal-r.expensesTotal-r.returnsTotal+r.walletCashTotal);
  return r;
}
function pendingDeficitOf(name){
  return r2(load('cashier_shifts').filter(function(s){return s.cashierName===name&&s.deficitStatus==='pending';}).reduce(function(a,s){return a+num(s.deficit);},0));
}
function startShift(){
  if(getOpenShift())return renderCashier();
  var v=$('openAmt').value; if(v===''||num(v)<0){alert('اكتب مبلغ الدرج الافتتاحي');return;}
  var l=load('cashier_shifts');
  l.push({id:genId(),cashierName:me(),openingAmount:num(v),startTime:new Date().toISOString(),endTime:null,closingAmount:null,closed:false,expectedAmount:null,difference:null,deficit:0,deficitStatus:null,transferred:false});
  save('cashier_shifts',l); renderCashier();
}
function openEndShift(){
  var sh=getOpenShift(); if(!sh)return;
  var st=calcShiftStats(sh);
  openModal('🔒 إنهاء الشيفت','<div class="tot">الدرج المتوقع: <b>'+money(st.expected)+'</b></div><label class="lb">المبلغ الفعلي في الدرج (عدّه)</label><input type="number" id="actualCash" min="0" step="0.01"><p style="font-size:13px;color:#555">لو المبلغ الفعلي ≥ المتوقع بيتحول للخزنة تلقائي. لو فيه عجز، بيتسجل في تاب العجز ولا يتحول للخزنة لحد ما المدير يعمل تسوية.</p><button class="btn" onclick="confirmEndShift()">تأكيد إنهاء الشيفت</button>');
}
var ENDING=false;
function confirmEndShift(){
  var sh=getOpenShift(); if(!sh){closeModal();return;}
  var raw=$('actualCash').value; if(raw===''){alert('اكتب المبلغ الفعلي');return;}
  if(ENDING)return; ENDING=true;
  var actual=r2(raw), st=calcShiftStats(sh), diff=r2(actual-st.expected), id=sh.id;
  var list=load('cashier_shifts'); var s=list.filter(function(x){return x.id===id;})[0];
  s.closed=true; s.endTime=new Date().toISOString(); s.closingAmount=actual; s.expectedAmount=st.expected; s.difference=diff;
  if(diff<-0.004){
    s.deficit=-diff; s.deficitStatus='pending'; s.transferred=false;
    save('cashier_shifts',list); closeModal(); ENDING=false;
    alert('⚠️ تم إنهاء الشيفت مع عجز\nالمتوقع: '+money(st.expected)+'\nالفعلي: '+money(actual)+'\nالعجز: '+money(-diff)+'\nلم يتم تحويل المبلغ للخزنة حتى تسوية العجز من المدير.');
    renderTab('cashier'); return;
  }
  s.deficit=0; s.deficitStatus=null; s.transferred=false;
  save('cashier_shifts',list); closeModal();
  if(actual>0){
    adjustSafeBalance(actual,{type:'shift_close',description:'تحويل شيفت '+me()}).then(function(nb){
      var l2=load('cashier_shifts'); l2.forEach(function(x){if(x.id===id)x.transferred=true;}); save('cashier_shifts',l2);
      ENDING=false; alert('✅ تم إنهاء الشيفت وتحويل '+money(actual)+' للخزنة\nرصيد الخزنة الآن: '+money(nb)); renderTab('cashier');
    }).catch(function(e){ ENDING=false; alert('❌ تم إغلاق الشيفت لكن فشل التحويل للخزنة: '+e.message); renderTab('cashier'); });
  } else { ENDING=false; alert('تم إنهاء الشيفت'); renderTab('cashier'); }
}

/* ========== Cashier ========== */
var CART=[], CASH_SEARCH='', PAYM='cash', DISC=0, TAX=0, checkoutBusy=false;
function renderCashier(){
  var sh=getOpenShift(), c=$('content'), pd=pendingDeficitOf(me());
  var pdTxt=pd>0?'<div class="warnbox">⚠️ عليك عجز معلق: <b>'+money(pd)+'</b> — في انتظار تسوية المدير</div>':'';
  if(!sh){
    c.innerHTML='<div class="panel center"><h2>🔓 فتح شيفت جديد</h2><p>لازم تفتح شيفت (المبلغ الافتتاحي للدرج) قبل البيع</p>'+pdTxt+'<input type="number" id="openAmt" placeholder="مبلغ الدرج الافتتاحي" min="0" step="0.01"><br><button class="btn" onclick="startShift()">فتح الشيفت</button></div>';
    return;
  }
  var st=calcShiftStats(sh);
  c.innerHTML=pdTxt+'<div class="banner"><div>🟢 شيفت مفتوح منذ '+fdate(sh.startTime)+'</div><div>افتتاحي: <b>'+money(sh.openingAmount)+'</b></div><div>مبيعات نقدي: <b>'+money(st.cashSalesTotal)+'</b></div><div>الدرج المتوقع: <b>'+money(st.expected)+'</b></div><button class="btn btn-red" onclick="openEndShift()">🔒 إنهاء الشيفت</button></div>'+
  '<div class="split"><div class="cartPanel panel"><h3>🧾 الفاتورة</h3><div id="cartItems"></div>'+
  '<div class="row"><label>خصم %</label><input type="number" id="discIn" value="'+DISC+'" min="0" max="100" style="width:80px" oninput="DISC=num(this.value);renderTotals()"><label>ضريبة %</label><input type="number" id="taxIn" value="'+TAX+'" min="0" style="width:80px" oninput="TAX=num(this.value);renderTotals()"></div>'+
  '<div class="row"><label>الدفع</label><select onchange="PAYM=this.value">'+Object.keys(PAY).map(function(k){return '<option value="'+k+'"'+(PAYM===k?' selected':'')+'>'+PAY[k]+'</option>';}).join('')+'</select></div>'+
  '<div class="tot" id="totals"></div><button class="btn" style="width:100%;font-size:17px" onclick="processCheckout()">✅ إتمام البيع</button><button class="btn btn-gray" style="width:100%" onclick="CART=[];renderCart()">مسح الفاتورة</button></div>'+
  '<div class="prodPanel panel"><h3>🛍️ المنتجات</h3><div class="row"><input id="cashSearch" placeholder="ابحث بالاسم أو الباركود (Enter لإضافة بالباركود)" style="flex:1" value="'+esc(CASH_SEARCH)+'" oninput="CASH_SEARCH=this.value;renderProductGrid()" onkeydown="if(event.key===\'Enter\')cashEnter()"><button class="btn" onclick="scanForCashier()">📷</button></div><div class="pgrid" id="prodGrid"></div></div></div>';
  renderProductGrid(); renderCart();
}
function cashEnter(){
  var p=findByBarcode(CASH_SEARCH);
  if(p){addToCart(p.id);CASH_SEARCH='';$('cashSearch').value='';renderProductGrid();}
}
function scanForCashier(){ openScanner(function(code){var p=findByBarcode(code); if(p)addToCart(p.id); else alert('لا يوجد منتج بهذا الباركود: '+code);}); }
function stockCls(p){ var s=num(p.stock); if(s<=0)return 'out'; if(s<=num(p.minStock==null?5:p.minStock))return 'low'; return ''; }
function renderProductGrid(){
  var q=CASH_SEARCH.trim().toLowerCase();
  var l=load('cashier_products').filter(function(p){return !q||String(p.name).toLowerCase().indexOf(q)>=0||normBC(p.barcode).indexOf(q)>=0;});
  $('prodGrid').innerHTML=l.map(function(p){
    return '<div class="pc '+stockCls(p)+'" onclick="addToCart(\''+p.id+'\')"><div class="n">'+esc(p.name)+'</div><div class="p">'+money(p.price)+'</div><div class="s">المخزون: '+num(p.stock)+'</div></div>';
  }).join('')||'<div class="empty">لا توجد منتجات</div>';
}
function addToCart(id){
  var p=load('cashier_products').filter(function(x){return x.id===id;})[0]; if(!p)return;
  var it=CART.filter(function(x){return x.productId===id;})[0];
  if(it)it.qty++; else CART.push({productId:id,name:p.name,price:num(p.price),costPrice:num(p.costPrice),qty:1});
  renderCart();
}
function chQty(i,d){ CART[i].qty=Math.max(1,num(CART[i].qty)+d); renderCart(); }
function setQty(i,v){ CART[i].qty=Math.max(1,num(v)||1); renderCart(); }
function rmItem(i){ CART.splice(i,1); renderCart(); }
function calcTotals(){
  var sub=CART.reduce(function(a,i){return a+i.price*i.qty;},0);
  var disc=sub*DISC/100, tax=(sub-disc)*TAX/100;
  return {subtotal:r2(sub),discountAmount:r2(disc),taxAmount:r2(tax),total:r2(sub-disc+tax)};
}
function renderCart(){
  if(!$('cartItems'))return;
  $('cartItems').innerHTML=CART.map(function(i,k){
    return '<div class="ci"><span class="nm">'+esc(i.name)+'<br><small>'+money(i.price)+'</small></span><button class="qb" onclick="chQty('+k+',-1)">−</button><input type="number" value="'+i.qty+'" min="1" onchange="setQty('+k+',this.value)"><button class="qb" onclick="chQty('+k+',1)">+</button><b>'+money(i.price*i.qty)+'</b><button class="qb" style="background:#ffcdd2" onclick="rmItem('+k+')">✕</button></div>';
  }).join('')||'<div class="empty center" style="padding:20px;color:#999">الفاتورة فارغة</div>';
  renderTotals();
}
function renderTotals(){
  if(!$('totals'))return; var t=calcTotals();
  $('totals').innerHTML='المجموع: '+money(t.subtotal)+'<br>الخصم: '+money(t.discountAmount)+'<br>الضريبة: '+money(t.taxAmount)+'<div class="big">الإجمالي: '+money(t.total)+'</div>';
}
function processCheckout(){
  if(checkoutBusy)return;
  var sh=getOpenShift(); if(!sh){alert('افتح شيفت أولاً');return renderCashier();}
  if(!CART.length){alert('الفاتورة فارغة');return;}
  checkoutBusy=true;
  var t=calcTotals(), items=CART.map(function(i){return {productId:i.productId,name:i.name,price:i.price,costPrice:i.costPrice,qty:num(i.qty)};});
  var profit=r2(items.reduce(function(a,i){return a+(i.price-i.costPrice)*i.qty;},0)-t.discountAmount);
  var pm=PAYM;
  nextCounter('invoice_counter',1001).then(function(n){
    var sale={id:genId(),invoiceNum:'INV-'+n,date:new Date().toISOString(),items:items,subtotal:t.subtotal,discountPercent:DISC,taxPercent:TAX,total:t.total,soldBy:me(),paymentMethod:pm,shiftId:sh.id,profit:profit};
    var prods=load('cashier_products');
    items.forEach(function(i){ prods.forEach(function(p){ if(p.id===i.productId)p.stock=num(p.stock)-i.qty; }); });
    save('cashier_products',prods);
    var sales=load('cashier_sales'); sales.push(sale); save('cashier_sales',sales);
    var p=(pm!=='cash')?adjustWalletBalance(pm,t.total,{operation:'sale',amount:t.total,commission:0,note:sale.invoiceNum}):Promise.resolve();
    return p.then(function(){return sale;});
  }).then(function(sale){
    CART=[];DISC=0;TAX=0;PAYM='cash'; checkoutBusy=false; renderCashier(); showInvoice(sale);
  }).catch(function(e){ checkoutBusy=false; alert('حدث خطأ أثناء البيع: '+e.message); });
}
function showInvoice(s){
  var h='<div id="invoiceBody"><div style="text-align:center"><h2 style="margin:0">🛒 زين ماركت</h2><div>فاتورة رقم: <b>'+esc(s.invoiceNum||s.id)+'</b></div><div>'+fdate(s.date)+'</div><div>الكاشير: '+esc(s.soldBy)+' | الدفع: '+(PAY[s.paymentMethod]||'نقدي')+'</div></div><table style="margin-top:8px;width:100%;border-collapse:collapse" border="1"><tr><th>الصنف</th><th>الكمية</th><th>السعر</th><th>الإجمالي</th></tr>'+
  s.items.map(function(i){return '<tr><td>'+esc(i.name)+'</td><td>'+i.qty+'</td><td>'+money(i.price)+'</td><td>'+money(i.price*i.qty)+'</td></tr>';}).join('')+
  '</table><div style="margin-top:8px">المجموع: '+money(s.subtotal)+'<br>خصم ('+num(s.discountPercent)+'%)<br>ضريبة ('+num(s.taxPercent)+'%)<br><b style="font-size:18px">الإجمالي: '+money(s.total)+'</b></div></div>'+
  '<div class="row" style="margin-top:10px"><button class="btn" onclick="printInvoice()">🖨️ طباعة</button><button class="btn btn-gray" onclick="closeModal()">إغلاق</button></div>';

function printInvoice(){
  var b=$('invoiceBody'); if(!b)return;
  var w=window.open('','_blank'); if(!w){alert('اسمح بالنوافذ المنبثقة للطباعة');return;}
  w.document.write('<html dir="rtl" lang="ar"><head><meta charset="utf-8"><title>فاتورة</title><style>body{font-family:Cairo,Arial,sans-serif;padding:10px;max-width:380px;margin:auto}table{width:100%;border-collapse:collapse}td,th{padding:4px;text-align:center}</style></head><body>'+b.innerHTML+'</body></html>');
  w.document.close(); setTimeout(function(){w.focus();w.print();},300);

function addPurItem(){
  var pid=$('purSelectProd').value, name=$('purName').value.trim(), bc=normBC($('purBarcode').value), cost=num($('purCost').value), price=num($('purPrice').value), qty=num($('purQty').value);
  if(!name||qty<=0){alert('اكتب اسم الصنف وكمية صحيحة');return;}
  var owner=bc?findByBarcode(bc):null;
  if(owner&&owner.id!==pid){alert('❌ الباركود مستخدم للمنتج: '+owner.name);return;}
  if(pid){
    var p=load('cashier_products').filter(function(x){return x.id===pid;})[0];
    if(p&&normBC(p.barcode)&&bc&&normBC(p.barcode)!==bc){alert('❌ المنتج "'+p.name+'" له باركود مسجل ('+p.barcode+') ولا يمكن إضافة باركود ثاني');return;}
  }
  for(var i=0;i<PUR_ITEMS.length;i++){
    var it=PUR_ITEMS[i], same=pid?(it.productId===pid):(!it.productId&&it.name===name);
    if(bc&&it.barcode===bc&&!same){alert('❌ نفس الباركود موجود لصنف آخر في نفس الفاتورة');return;}
  }
  PUR_ITEMS.push({productId:pid||null,name:name,costPrice:cost,price:price,qty:qty,barcode:bc,subtotal:r2(cost*qty)});
  ['purName','purBarcode','purCost','purPrice'].forEach(function(f){$(f).value='';}); $('purQty').value='1'; $('purSelectProd').value='';
  renderPurItems(); $('purSelectProd').focus();

var SAVING_PUR=false;
function savePurchase(){
  if(SAVING_PUR)return;
  var sid=$('purSupplier').value; if(!sid){alert('اختر المورد');return;}
  if(!PUR_ITEMS.length){alert('أضف صنف واحد على الأقل');return;}
  var sup=load('cashier_suppliers').filter(function(s){return s.id===sid;})[0]; if(!sup)return;
  SAVING_PUR=true;
  var total=r2(PUR_ITEMS.reduce(function(a,i){return a+i.subtotal;},0)), items=PUR_ITEMS.slice();
  nextCounter('purchase_counter',1001).then(function(n){
    var p={id:genId(),purchaseNum:'PUR-'+n,supplierId:sup.id,supplierName:sup.name,items:items,total:total,status:isAdmin()?'approved':'pending',requestedBy:me(),date:new Date().toISOString(),installments:isCredit(sup)?buildInstallments(total,3):null,approvedBy:isAdmin()?me():null,approvedDate:isAdmin()?new Date().toISOString():null,rejectReason:null};
    if(isAdmin())applyPurchaseToStock(p);
    var l=load('cashier_purchases'); l.push(p); save('cashier_purchases',l);
    SAVING_PUR=false; closeModal(); renderPurchases();

function applyPurchaseToStock(pu){
  var prods=load('cashier_products');
  pu.items.forEach(function(it){
    var bc=normBC(it.barcode), p=null;
    if(it.productId)p=prods.filter(function(x){return x.id===it.productId;})[0]||null;
    if(!p&&bc)p=findByBarcode(bc,null,prods);
    if(!p)p=prods.filter(function(x){return String(x.name).trim()===String(it.name).trim();})[0]||null;
    if(p){
      p.stock=num(p.stock)+num(it.qty); p.costPrice=num(it.costPrice); if(it.price)p.price=num(it.price);
      if(bc&&!normBC(p.barcode)&&!findByBarcode(bc,p.id,prods))p.barcode=bc;
    } else {
      prods.push({id:genId(),name:it.name,price:num(it.price),costPrice:num(it.costPrice),stock:num(it.qty),barcode:(bc&&!findByBarcode(bc,null,prods))?bc:'',minStock:5,dateAdded:new Date().toISOString()});
    }
  });
  save('cashier_products',prods);
}

/* ========== Disbursements ========== */
function applyApprovedEffects(d){
  var p=(d.source==='safe')?adjustSafeBalance(-num(d.amount),{type:'disbursement',description:d.description}):Promise.resolve();
  return p.then(function(){
    if(d.installmentId){
      var ps=load('cashier_purchases'); ps.forEach(function(pu){ if(pu.id===d.purchaseId&&pu.installments)pu.installments.forEach(function(i){if(i.id===d.installmentId)i.paid=true;}); });
      save('cashier_purchases',ps);
    }
  });
}

    return '<tr><td>'+fdate(d.date)+'</td><td>'+esc(d.description)+'</td><td>'+money(d.amount)+'</td><td>'+(d.source==='safe'?'الخزنة':'الدرج')+'</td><td>'+stBadge(d.status)+(d.rejectReason?'<br><small>'+esc(d.rejectReason)+'</small>':'')+'</td><td>'+esc(d.requestedBy)+'</td><td>'+act+'</td></tr>';

var BUSY={};
function submitDisb(){
  var desc=$('dsDesc').value.trim(), amt=num($('dsAmt').value), src=$('dsSrc').value;
  if(!desc||amt<=0){alert('اكتب البيان ومبلغ صحيح');return;}
  var sh=getOpenShift(); if(src==='drawer'&&!sh){alert('لازم تفتح شيفت للصرف من الدرج');return;}
  var d={id:genId(),description:desc,amount:amt,source:src,category:'general',purchaseId:null,installmentId:null,shiftId:sh?sh.id:null,requestedBy:me(),status:'pending',approvedBy:null,approvedDate:null,rejectReason:null,date:new Date().toISOString()};
  if(isAdmin()){
    if(src==='safe'&&num(load('cashier_safe').balance)<amt){alert('رصيد الخزنة غير كافي');return;}
    d.status='approved'; d.approvedBy=me(); d.approvedDate=new Date().toISOString();
    applyApprovedEffects(d).then(function(){var l=load('cashier_disbursements');l.push(d);save('cashier_disbursements',l);renderDisbursements();}).catch(function(e){alert('فشل: '+e.message);});
  } else { var l=load('cashier_disbursements'); l.push(d); save('cashier_disbursements',l); renderDisbursements(); alert('✅ تم إرسال الطلب للمدير'); }
}
function approveDisb(id){
  if(!isAdmin()||BUSY[id])return;
  var d=load('cashier_disbursements').filter(function(x){return x.id===id;})[0]; if(!d||d.status!=='pending')return;
  if(d.source==='safe'&&num(load('cashier_safe').balance)<num(d.amount)){alert('رصيد الخزنة غير كافي');return;}
  BUSY[id]=true;
  var copy=Object.assign({},d);
  applyApprovedEffects(copy).then(function(){
    var l=load('cashier_disbursements'); l.forEach(function(x){if(x.id===id){x.status='approved';x.approvedBy=me();x.approvedDate=new Date().toISOString();}});
    save('cashier_disbursements',l); BUSY[id]=false; renderDisbursements();
  }).catch(function(e){BUSY[id]=false;alert('فشل: '+e.message);});
}
function rejectDisb(id){
  if(!isAdmin())return; var r=prompt('سبب الرفض (مطلوب):'); if(!r||!r.trim()){alert('لازم تكتب سبب الرفض');return;}
  var l=load('cashier_disbursements'), d=l.filter(function(x){return x.id===id;})[0]; if(!d||d.status!=='pending')return;
  d.status='rejected'; d.rejectReason=r.trim(); d.approvedBy=me(); d.approvedDate=new Date().toISOString(); save('cashier_disbursements',l);
  if(d.installmentId){var ps=load('cashier_purchases');ps.forEach(function(pu){if(pu.id===d.purchaseId&&pu.installments)pu.installments.forEach(function(i){if(i.id===d.installmentId)i.disbursementRequested=false;});});save('cashier_purchases',ps);}
  renderDisbursements();
}

}

function rtFill(){
  var id=$('rtProd').value, p=load('cashier_products').filter(function(x){return x.id===id;})[0]; if(!p)return;
  $('rtRefund').value=r2(num(p.price)*num($('rtQty').value));

var RET_BUSY=false;
function submitReturn(){
  if(RET_BUSY)return;
  var id=$('rtProd').value, p=load('cashier_products').filter(function(x){return x.id===id;})[0];
  var qty=num($('rtQty').value), refund=num($('rtRefund').value), src=$('rtSrc').value, res=$('rtRes').checked, reason=$('rtReason').value.trim();
  if(!p||qty<=0||refund<0){alert('اختر المنتج وكمية صحيحة');return;}
  var sh=getOpenShift(); if(src==='drawer'&&!sh){alert('لازم تفتح شيفت للإرجاع من الدرج');return;}
  if(src==='safe'&&num(load('cashier_safe').balance)<refund){alert('رصيد الخزنة غير كافي');return;}
  RET_BUSY=true;
  var pre=(src==='safe')?adjustSafeBalance(-refund,{type:'return',description:'مرتجع '+p.name}):Promise.resolve();
  pre.then(function(){
    var prods=load('cashier_products'), pr=prods.filter(function(x){return x.id===id;})[0], before=num(pr.stock);
    if(res){ pr.stock=before+qty; save('cashier_products',prods); logAdjust(pr,before,pr.stock,'مرتجع صالح'+(reason?' - '+reason:'')); }
    else {
      pr.stock=before-qty; save('cashier_products',prods); logAdjust(pr,before,pr.stock,'مرتجع تالف'+(reason?' - '+reason:''));
      var dm=load('cashier_damages'); dm.push({id:genId(),productId:id,productName:p.name,qty:qty,lossValue:r2(num(p.costPrice)*qty),reason:'مرتجع غير صالح'+(reason?' - '+reason:''),processedBy:me(),date:new Date().toISOString()}); save('cashier_damages',dm);
    }
    var rs=load('cashier_returns'); rs.push({id:genId(),productId:id,productName:p.name,qty:qty,price:num(p.price),costPrice:num(p.costPrice),refundAmount:refund,source:src,resalable:res,reason:reason,shiftId:sh?sh.id:null,processedBy:me(),date:new Date().toISOString()}); save('cashier_returns',rs);
    RET_BUSY=false; renderReturns();
  }).catch(function(e){RET_BUSY=false;alert('فشل: '+e.message);});
}

function commissionOf(a){return a<1000?5:15;}
function drawerEffect(t){
  if(t.operation==='withdraw')return num(t.amount)+num(t.commission);
  if(t.operation==='deposit')return -num(t.amount)+num(t.commission);
  return 0;
}

  (isAdmin()?'<button class="btn btn-or btn-sm" onclick="submitWalletAdjust(\'vodafone\')">تعديل رصيد فودافون</button> <button class="btn btn-or btn-sm" onclick="submitWalletAdjust(\'instapay\')">تعديل رصيد انستاباي</button>':'')+'</div>'+

function wlPrev(){
  var a=num($('wlAmt').value), op=$('wlOp').value, el=$('wlPrev'); if(!a){el.textContent='';return;}

var WL_BUSY=false;
function submitWalletOp(){
  if(WL_BUSY)return;
  var sh=getOpenShift(); if(!sh){alert('افتح شيفت أولاً');return;}
  var w=$('wlW').value, op=$('wlOp').value, a=num($('wlAmt').value); if(a<=0){alert('اكتب مبلغ صحيح');return;}
  var bal=num(load('cashier_wallets')[w]);

function inventoryValue(){
  var r={units:0,cost:0,sale:0,neg:0,count:0};
  load('cashier_products').forEach(function(p){
    var s=num(p.stock); r.count++;
    if(s<0){r.neg++;return;}
    r.units+=s; r.cost+=s*num(p.costPrice); r.sale+=s*num(p.price);
  });
  r.cost=r2(r.cost); r.sale=r2(r.sale); r.units=r2(r.units);
  return r;
}

var COUNT={entries:{},reason:'جرد دوري',q:''}, COUNT_BUSY=false;
function openCountModal(){

}
function countDiffHtml(p,v){
  if(v===undefined)return bd('لم يُجرد','n');
  var d=r2(num(v)-num(p.stock));
  if(Math.abs(d)<0.0001)return bd('مطابق','g');
  return d>0?bd('زيادة +'+d,'g'):bd('نقص '+d,'r');
}
function renderCountEntry(){
  var l=load('cashier_products');

  }))+

function onCountIn(id,v){
  if(v==='')delete COUNT.entries[id]; else COUNT.entries[id]=v;
  var p=load('cashier_products').filter(function(x){return x.id===id;})[0];
  var c=$('cd_'+id); if(p&&c)c.innerHTML=countDiffHtml(p,COUNT.entries[id]);
  updateCountProg();
}
function updateCountProg(){
  var el=$('cntProg'); if(!el)return;
  var total=load('cashier_products').length, n=Object.keys(COUNT.entries).length;
  el.innerHTML='تم جرد <b>'+n+'</b> من <b>'+total+'</b> منتج — متبقي <b style="color:#c62828">'+(total-n)+'</b>';

function filterCountRows(){
  var q=(COUNT.q||'').trim().toLowerCase();
  document.querySelectorAll('.cntRow').forEach(function(r){r.style.display=(!q||r.getAttribute('data-s').indexOf(q)>=0)?'':'none';});
}
function computeCount(){
  var prods=load('cashier_products'), items=[], unc=[], same=0;
  prods.forEach(function(p){
    var v=COUNT.entries[p.id];
    if(v===undefined){unc.push({productId:p.id,name:p.name,stock:num(p.stock),costPrice:num(p.costPrice),barcode:p.barcode||''});return;}
    var b=num(p.stock), a=num(v), d=r2(a-b);
    if(Math.abs(d)<0.0001){same++;return;}
    items.push({productId:p.id,name:p.name,before:b,after:a,diff:d,costPrice:num(p.costPrice),value:r2(d*num(p.costPrice))});
  });
  var inc=0,dec=0; items.forEach(function(i){ if(i.diff>0)inc+=i.value; else dec+=-i.value; });
  return {items:items,unc:unc,same:same,total:prods.length,counted:prods.length-unc.length,inc:r2(inc),dec:r2(dec),net:r2(inc-dec)};
}

  '<h4 style="color:#c62828">⏳ الأصناف التي لم تُجرد ('+r.unc.length+')</h4>'+

  (r.unc.length?'<label style="display:block;margin:10px 0;background:#fff8e1;padding:8px;border-radius:8px"><input type="checkbox" id="cntAck" style="width:auto"> راجعت الأصناف غير المجرودة وأؤكد تركها بدون تغيير</label>':'')+

  openModal('🔎 مراجعة نتائج الجرد',h,true);
}

/* ========== Profit ========== */
function monthlyFigures(){
  var mk=monthKey(new Date()), inM=function(d){return monthKey(d)===mk;};
  var sales=load('cashier_sales').filter(function(s){return inM(s.date);});
  var sum=function(a,f){return a.reduce(function(x,y){return x+num(f(y));},0);};
  var gross=sum(sales,function(s){return s.profit;});
  var disb=sum(load('cashier_disbursements').filter(function(d){return d.status==='approved'&&inM(d.approvedDate||d.date);}),function(d){return d.amount;});
  var dmg=sum(load('cashier_damages').filter(function(d){return inM(d.date);}),function(d){return d.lossValue;});
  var ret=sum(load('cashier_returns').filter(function(d){return inM(d.date);}),function(x){return num(x.refundAmount)-num(x.costPrice)*num(x.qty);});
  var wo=sum(load('cashier_shifts').filter(function(s){return s.deficitStatus==='settled'&&s.settlement&&s.settlement.method==='writeoff'&&inM(s.settlement.date);}),function(s){return s.deficit;});
  return {sales:sum(sales,function(s){return s.total;}),gross:r2(gross),disb:r2(disb),dmg:r2(dmg),ret:r2(ret),wo:r2(wo),net:r2(gross-disb-dmg-ret-wo)};
}
function getProfitBreakdown(daily){
  var mk=monthKey(new Date()), m={};
  load('cashier_sales').forEach(function(s){
    if(daily?!isToday(s.date):monthKey(s.date)!==mk)return;
    s.items.forEach(function(i){var k=i.productId||i.name; var o=m[k]=m[k]||{name:i.name,qty:0,rev:0,cost:0}; o.qty+=num(i.qty);o.rev+=num(i.price)*num(i.qty);o.cost+=num(i.costPrice)*num(i.qty);});
  });
  return Object.keys(m).map(function(k){var o=m[k];return {name:o.name,qty:o.qty,rev:r2(o.rev),cost:r2(o.cost),profit:r2(o.rev-o.cost)};}).sort(function(a,b){return b.profit-a.profit;});
}

  var daily=load('cashier_sales').filter(function(s){return isToday(s.date);}).reduce(function(a,s){return a+num(s.profit);},0);

  '<div class="panel"><div class="row"><h3 style="margin:0;flex:1">📈 تفصيل أرباح الأصناف (الشهر)</h3><button class="btn btn-blue btn-sm" onclick="exportProfit(true)">📥 Excel يومي</button><button class="btn btn-blue btn-sm" onclick="exportProfit(false)">📥 Excel شهري</button></div>'+
  tbl(['الصنف','الكمية','المبيعات','التكلفة','الربح'],bk.map(function(o){return '<tr><td>'+esc(o.name)+'</td><td>'+o.qty+'</td><td>'+money(o.rev)+'</td><td>'+money(o.cost)+'</td><td><b>'+money(o.profit)+'</b></td></tr>';}))+'</div>';

function openSettleDeficit(id){
  var s=load('cashier_shifts').filter(function(x){return x.id===id;})[0]; if(!s||s.deficitStatus!=='pending')return;
  openModal('⚖️ تسوية عجز '+esc(s.cashierName),
   '<div class="tot">المتوقع: '+money(s.expectedAmount)+'<br>الفعلي: '+money(s.closingAmount)+'<br>العجز: <b style="color:#c62828">'+money(s.deficit)+'</b></div>'+
   Object.keys(METHODS).map(function(k,i){return '<label style="display:block;margin:6px 0"><input type="radio" name="stlM" value="'+k+'" style="width:auto"'+(i===0?' checked':'')+'> '+METHODS[k]+'</label>';}).join('')+
   '<small>• سدد: يتحول (الفعلي + العجز) للخزنة<br>• خصم/شطب: يتحول الفعلي فقط</small><label class="lb" style="display:block;margin-top:8px">ملاحظة</label><textarea id="stlNote" rows="2"></textarea><button class="btn" onclick="confirmSettleDeficit(\''+id+'\')">تأكيد التسوية</button>');
}
var settling=false;
function confirmSettleDeficit(id){
  if(!isAdmin()||settling)return;
  var s=load('cashier_shifts').filter(function(x){return x.id===id;})[0]; if(!s||s.deficitStatus!=='pending')return;
  var m=document.querySelector('input[name="stlM"]:checked').value, note=$('stlNote').value.trim();
  var amt=r2(m==='paid'?num(s.closingAmount)+num(s.deficit):num(s.closingAmount));
  settling=true;
  var p=amt>0?adjustSafeBalance(amt,{type:'shift_close',description:'تسوية عجز '+s.cashierName+' ('+METHODS[m]+')'}):Promise.resolve();
  p.then(function(){
    var l=load('cashier_shifts'); l.forEach(function(x){ if(x.id===id){x.deficitStatus='settled';x.transferred=true;x.settlement={method:m,note:note,date:new Date().toISOString(),by:me(),transferAmount:amt};} });
    save('cashier_shifts',l); settling=false; closeModal(); alert('✅ تمت التسوية وتحويل '+money(amt)+' للخزنة'); renderDeficits();
  }).catch(function(e){settling=false;alert('فشلت التسوية: '+e.message);});
}

/* ========== Users ========== */
function renderUsers(){
  var us=getUsers();
  $('content').innerHTML='<div class="panel"><div class="row"><h3 style="margin:0;flex:1">👥 المستخدمين</h3><button class="btn" onclick="openAddUser()">➕ مستخدم جديد</button></div>'+
  tbl(['الاسم','الدور','إجراء'],us.map(function(u){return '<tr><td>'+esc(uName(u))+'</td><td>'+(u.role==='admin'?bd('مدير','g'):bd('كاشير','b'))+'</td><td><button class="btn btn-sm btn-blue" onclick="openChangePass(\''+esc(uName(u))+'\')">🔑 تغيير كلمة المرور</button> '+(uName(u)!==me()?'<button class="btn btn-sm btn-red" onclick="deleteUser(\''+esc(uName(u))+'\')">حذف</button>':'')+'</td></tr>';}))+'</div>'+
  '<div class="danger-zone"><h3 style="color:#c62828;margin:0 0 8px">منطقة الخطر</h3><p>حذف كل البيانات نهائياً (منتجات، مبيعات، خزنة، مستخدمين...)</p><button class="btn btn-red" onclick="resetAllData()">🔄 إعادة ضبط كامل (تصفير كل البيانات)</button></div>';
}
function openAddUser(){
  openModal('➕ مستخدم جديد','<label class="lb">الاسم</label><input id="nuName"><label class="lb">كلمة المرور</label><input id="nuPass"><label class="lb">الدور</label><select id="nuRole"><option value="cashier">كاشير</option><option value="admin">مدير</option></select><button class="btn" onclick="addUser()">حفظ</button>');
}
function addUser(){
  var n=$('nuName').value.trim(), p=$('nuPass').value; if(!n||!p){alert('اكمل البيانات');return;}
  if(findUser(n)){alert('الاسم موجود بالفعل');return;}
  var us=getUsers().slice(); us.push({id:genId(),username:n,displayName:n,password:p,role:$('nuRole').value}); save('cashier_users',us); closeModal(); renderUsers();
}
function deleteUser(name){
  if(!isAdmin()||name===me())return; if(!confirm('حذف المستخدم '+name+'؟'))return;
  save('cashier_users',getUsers().filter(function(u){return uName(u)!==name;})); renderUsers();
}
function openChangePass(name){
  openModal('🔑 تغيير كلمة مرور '+esc(name),'<label class="lb">كلمة المرور الجديدة</label><input id="cpPass"><button class="btn" onclick="changePass(\''+esc(name)+'\')">حفظ</button>');
}
function changePass(name){
  if(!isAdmin())return; var p=$('cpPass').value; if(!p){alert('اكتب كلمة المرور');return;}
  var us=getUsers().map(function(u){ if(uName(u)===name)u=Object.assign({},u,{password:p}); return u; }); save('cashier_users',us); closeModal(); alert('✅ تم تغيير كلمة المرور');
}
function resetAllData(){
  if(!isAdmin())return;
  if(!confirm('⚠️ هتتحذف كل البيانات نهائياً. متأكد؟'))return;
  if(!confirm('تأكيد أخير: لا يمكن التراجع. حذف كل شيء؟'))return;
  db.collection(COL).get().then(function(snap){
    var docs=snap.docs, chunks=[]; for(var i=0;i<docs.length;i+=400)chunks.push(docs.slice(i,i+400));
    return Promise.all(chunks.map(function(c){var b=db.batch(); c.forEach(function(d){b.delete(d.ref);}); return b.commit();}));
  }).then(function(){ _dataCache={}; sessionStorage.removeItem('current_user'); alert('تم تصفير كل البيانات'); location.reload(); })
  .catch(function(e){alert('فشل: '+e.message);});
}
</script>
