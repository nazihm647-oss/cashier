<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>زين ماركت - نظام الكاشير</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --primary:#1e8e4a;
  --primary-dark:#145c30;
  --bg:#f1f8f4;
  --danger:#e74c3c;
  --warning:#f39c12;
  --info:#2980b9;
}
*{box-sizing:border-box;}
body{margin:0;font-family:'Cairo',sans-serif;background:var(--bg);color:#222;}
.loading-screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#fff;gap:15px;z-index:99999;}
.spinner{width:50px;height:50px;border:6px solid #eee;border-top-color:var(--primary);border-radius:50%;animation:spin 1s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}

.login-screen{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#1e8e4a,#145c30);}
.login-box{background:#fff;padding:30px;border-radius:16px;width:320px;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.2);}
.login-logo-icon{width:70px;height:70px;border-radius:50%;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:36px;margin:0 auto 10px;}
.login-box h1{margin:0;color:var(--primary-dark);}
.login-box span{font-size:12px;color:#888;display:block;margin-bottom:15px;}
.login-box input{width:100%;padding:10px;margin:6px 0;border:1px solid #ddd;border-radius:8px;font-family:inherit;}

.topbar{display:flex;justify-content:space-between;align-items:center;background:linear-gradient(135deg,#1e8e4a,#145c30);color:#fff;padding:10px 20px;flex-wrap:wrap;gap:10px;}
.logo-wrap{display:flex;align-items:center;gap:10px;}
.logo-icon{width:46px;height:46px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font-size:24px;}
.logo-text h1{margin:0;font-size:18px;}
.logo-text span{font-size:11px;opacity:.85;}
.badge-count{position:absolute;top:-8px;left:-8px;background:var(--danger);color:#fff;border-radius:50%;font-size:10px;padding:1px 5px;}

.tabs-row-wrap{background:#fff;padding:8px 15px;overflow-x:auto;white-space:nowrap;box-shadow:0 1px 4px rgba(0,0,0,.05);}
.tabs-row{display:inline-flex;gap:8px;}
.tab-btn{padding:9px 14px;border:none;background:var(--bg);border-radius:8px;cursor:pointer;font-family:inherit;font-weight:600;color:#333;font-size:13px;}
.tab-btn.active{background:var(--primary);color:#fff;}

.tab-content{padding:15px;}

.cashier-split{display:flex;gap:15px;align-items:flex-start;}
.cashier-cart-panel{flex:1;min-width:0;background:#fff;border-radius:12px;padding:15px;box-shadow:0 2px 8px rgba(0,0,0,.08);position:sticky;top:10px;max-height:calc(100vh - 160px);overflow-y:auto;}
.cashier-products-panel{flex:1;min-width:0;}
#productSearch{width:70%;padding:10px;border-radius:8px;border:1px solid #ddd;font-family:inherit;}
.product-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;margin-top:10px;max-height:calc(100vh - 230px);overflow-y:auto;padding-right:5px;}
.product-card{background:#fff;border-radius:10px;padding:10px;text-align:center;cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,.08);border:2px solid transparent;transition:.15s;}
.product-card:hover{border-color:var(--primary);transform:translateY(-2px);}
.product-card.low-stock{border-color:var(--warning);}
.product-card.out-stock{opacity:.5;pointer-events:none;border-color:var(--danger);}
@media(max-width:860px){
  .cashier-split{flex-direction:column;}
  .cashier-cart-panel{position:static;max-height:none;width:100%;}
  .product-grid{max-height:none;}
}

.btn{padding:8px 14px;border:none;border-radius:8px;background:var(--primary);color:#fff;cursor:pointer;font-family:inherit;font-weight:600;font-size:13px;margin:3px 2px;}
.btn:hover{opacity:.9;}
.btn-sm{padding:5px 9px;font-size:12px;}
.btn-danger{background:var(--danger);}
.btn-primary{background:var(--primary-dark);}

.data-table{width:100%;border-collapse:collapse;margin-top:10px;background:#fff;border-radius:8px;overflow:hidden;}
.data-table th,.data-table td{padding:8px;text-align:center;border-bottom:1px solid #eee;font-size:13px;}
.data-table th{background:var(--primary);color:#fff;}
.row-warning{background:#fff8e1;}
.row-danger{background:#fde8e8;}
.flash-row{animation:flash 1.5s ease;}
@keyframes flash{0%{background:#c8f7c5;}100%{background:transparent;}}

.stat-cards{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:10px;}
.stat-card{flex:1;min-width:150px;background:#fff;border-radius:10px;padding:14px;text-align:center;box-shadow:0 1px 4px rgba(0,0,0,.08);}
.stat-card b{font-size:18px;color:var(--primary-dark);}

.banner{padding:12px;border-radius:8px;margin-bottom:12px;font-weight:600;}
.banner.warning{background:#fff3cd;color:#856404;}
.banner.info{background:#d7f3e3;color:#145c30;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;}

.badge{padding:3px 8px;border-radius:12px;font-size:11px;color:#fff;}
.badge-warning{background:var(--warning);}
.badge-success{background:var(--primary);}
.badge-danger{background:var(--danger);}

label{display:block;margin-top:8px;font-size:13px;font-weight:600;}
input,select{width:100%;padding:8px;border:1px solid #ddd;border-radius:8px;margin-top:3px;font-family:inherit;}

.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;z-index:9999;padding:15px;}
.modal-box{background:#fff;border-radius:12px;padding:20px;width:100%;max-width:500px;max-height:90vh;overflow-y:auto;position:relative;}
.modal-x-close{position:absolute;top:10px;left:10px;cursor:pointer;font-size:18px;color:#888;}

.scanner-overlay{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;align-items:center;justify-content:center;z-index:10000;}
.scanner-box{background:#fff;border-radius:12px;padding:15px;text-align:center;width:90%;max-width:400px;}
#scannerContainer{width:100%;}
</style>
</head>
<body>

<div id="loadingScreen" class="loading-screen">
  <div class="spinner"></div>
  <p>جاري تحميل البيانات...</p>
</div>

<div id="loginScreen" class="login-screen" style="display:none">
  <div class="login-box">
    <div class="login-logo-icon">🛒</div>
    <h1>زين ماركت</h1>
    <span>نظام إدارة الكاشير</span>
    <input id="loginUsername" placeholder="اسم المستخدم">
    <input id="loginPassword" type="password" placeholder="كلمة المرور" onkeypress="if(event.key==='Enter') doLogin()">
    <div id="loginError" style="color:#e74c3c;font-size:13px"></div>
    <button class="btn btn-primary" style="width:100%" onclick="doLogin()">دخول</button>
  </div>
</div>

<div id="mainApp" style="display:none">
  <div id="topbarWrap"></div>
  <div id="tabsWrap" class="tabs-row-wrap"></div>
  <div id="tabContent" class="tab-content"></div>
</div>

<div id="modalOverlay" class="modal-overlay" onclick="if(event.target===this){ closeModal(); }">
  <div id="modalBox" class="modal-box">
    <span class="modal-x-close" onclick="closeModal()">✖</span>
    <div id="modalInner"></div>
  </div>
</div>

<div id="scannerOverlay" class="scanner-overlay">
  <div id="scannerBox" class="scanner-box">
    <div id="scannerContainer"></div>
    <button class="btn btn-danger" onclick="closeBarcodeScanner()">إغلاق الكاميرا</button>
  </div>
</div>

<script>
/* ============ CONFIG ============ */
var firebaseConfig = {
  apiKey: "AIzaSyDIp3OlRAP0Wa7Ea1W87NZkYAwOe0xueSQ",
  authDomain: "casheir-840ee.firebaseapp.com",
  projectId: "casheir-840ee",
  storageBucket: "casheir-840ee.firebasestorage.app",
  messagingSenderId: "1078746217763",
  appId: "1:1078746217763:web:7f74831f502ca1b20be096"
};
var SYNC_KEYS = ['cashier_users','cashier_products','cashier_sales','cashier_purchases','cashier_suppliers','cashier_disbursements','cashier_shifts','cashier_stock_adjustments','cashier_wallets','cashier_wallet_transactions','invoice_counter','purchase_counter','wallet_counter'];
var ROLE_PERMISSIONS = {
  admin: ['cashier','purchases','disbursements','wallets','live','inventory','products','reports','users'],
  cashier: ['cashier','purchases','disbursements','wallets','reports']
};
var TAB_LABELS = {
  cashier:'💰 الكاشير', purchases:'📥 فواتير الشراء', disbursements:'💸 طلبات الصرف', wallets:'💳 المحافظ الإلكترونية',
  live:'📡 متابعة مباشرة', inventory:'📦 المخزون', products:'🛒 المنتجات', reports:'📊 التقارير', users:'👥 إدارة المستخدمين'
};

/* ============ GLOBAL STATE ============ */
var db = null;
var _dataCache = {};
var CURRENT_USER = null;
var _appStarted = false;
var ACTIVE_TAB = 'cashier';
var CART = [];
var PURCHASE_ITEMS = [];
var html5QrCode = null;
var _scanCallback = null;
var _liveInterval = null;
var _lastLiveCount = 0;

/* ============ GLOBAL ERROR SAFETY NET ============ */
window.onerror = function(message, source, lineno, colno, error){
  try{
    var overlay = document.getElementById('modalOverlay'); if(overlay) overlay.style.display = 'none';
    var scannerOv = document.getElementById('scannerOverlay'); if(scannerOv) scannerOv.style.display = 'none';
    if(window.html5QrCode){ try{ html5QrCode.stop().catch(function(){}); }catch(e){} html5QrCode = null; }

    var box = document.createElement('div');
    box.style.cssText = 'position:fixed;top:0;left:0;right:0;background:#e74c3c;color:#fff;padding:15px;font-size:13px;z-index:999999;direction:ltr;text-align:left;white-space:pre-wrap;font-family:monospace;';
    box.textContent = '⚠️ JS Error: ' + message + ' | Line: ' + lineno + ' Col: ' + colno + '  ';
    var closeBtn = document.createElement('span');
    closeBtn.textContent = '[إغلاق]';
    closeBtn.style.cssText = 'cursor:pointer;text-decoration:underline;margin-right:10px;';
    closeBtn.onclick = function(){ box.remove(); };
    box.appendChild(closeBtn);
    document.body.appendChild(box);
  }catch(e){}
  return false;
};

/* ============ FIREBASE BOOT ============ */
function loadScript(src){
  return new Promise(function(resolve,reject){
    var s = document.createElement('script');
    s.src = src; s.onload = resolve; s.onerror = reject;
    document.head.appendChild(s);
  });
}
async function bootApp(){
  try{
    await loadScript('https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js');
    await loadScript('https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js');
    firebase.initializeApp(firebaseConfig);
    db = firebase.firestore();
    try{ await db.enablePersistence({synchronizeTabs:true}); }catch(e){}

    var _loadedKeys = {};
    function allLoaded(){ return SYNC_KEYS.every(function(k){ return _loadedKeys[k]; }); }
    SYNC_KEYS.forEach(function(key){
      db.collection('cashier_data').doc(key).onSnapshot(function(doc){
        _dataCache[key] = doc.exists ? doc.data().value : (key.indexOf('counter')>=0 ? 0 : []);
        _loadedKeys[key] = true;
        var cs = document.getElementById('connStatus'); if(cs) cs.textContent = '🟢 متصل';
        if(allLoaded() && !_appStarted){ _appStarted = true; startApp(); }
        else if(_appStarted){ refreshCurrentView(); }
      }, function(err){
        console.error(err);
        var cs = document.getElementById('connStatus'); if(cs) cs.textContent = '🔴 غير متصل';
      });
    });
  }catch(e){
    showFatalError(e);
  }
}
function showFatalError(e){
  document.getElementById('loadingScreen').innerHTML = '<p style="color:#e74c3c;padding:20px;text-align:center">تعذر الاتصال بالخادم. تحقق من الإنترنت وأعد تحميل الصفحة.</p>';
}
bootApp();

/* ============ DATA LAYER ============ */
function save(key, value){
  _dataCache[key] = value;
  if(db) db.collection('cashier_data').doc(key).set({value:value, updatedAt:firebase.firestore.FieldValue.serverTimestamp()});
}
function nextCounter(name, cb){
  if(!db){ var v=(_dataCache[name]||0)+1; _dataCache[name]=v; cb(v); return; }
  var ref = db.collection('cashier_data').doc(name);
  db.runTransaction(function(t){
    return t.get(ref).then(function(doc){
      var val = ((doc.exists && doc.data().value) ? doc.data().value : 0) + 1;
      t.set(ref, {value:val, updatedAt:firebase.firestore.FieldValue.serverTimestamp()});
      return val;
    });
  }).then(function(val){ _dataCache[name]=val; cb(val); });
}
function genId(){ return Date.now().toString(36) + Math.random().toString(36).substr(2,6); }

function getUsers(){ return _dataCache['cashier_users']||[]; } function saveUsers(v){ save('cashier_users',v); }
function getProducts(){ return _dataCache['cashier_products']||[]; } function saveProducts(v){ save('cashier_products',v); }
function getSales(){ return _dataCache['cashier_sales']||[]; } function saveSales(v){ save('cashier_sales',v); }
function getPurchases(){ return _dataCache['cashier_purchases']||[]; } function savePurchases(v){ save('cashier_purchases',v); }
function getSuppliers(){ return _dataCache['cashier_suppliers']||[]; } function saveSuppliers(v){ save('cashier_suppliers',v); }
function getDisbursements(){ return _dataCache['cashier_disbursements']||[]; } function saveDisbursements(v){ save('cashier_disbursements',v); }
function getShifts(){ return _dataCache['cashier_shifts']||[]; } function saveShifts(v){ save('cashier_shifts',v); }
function getStockAdjustments(){ return _dataCache['cashier_stock_adjustments']||[]; } function saveStockAdjustments(v){ save('cashier_stock_adjustments',v); }
function getWallets(){ return _dataCache['cashier_wallets']||{vodafone:0,instapay:0}; } function saveWallets(v){ save('cashier_wallets',v); }
function getWalletTransactions(){ return _dataCache['cashier_wallet_transactions']||[]; } function saveWalletTransactions(v){ save('cashier_wallet_transactions',v); }

function seedData(){
  if(!_dataCache['cashier_users'] || _dataCache['cashier_users'].length===0){
    save('cashier_users', [
      {id:'1', username:'MOHAMED NAZIH', password:'admin123', role:'admin', displayName:'MOHAMED NAZIH'},
      {id:'2', username:'ABDALLAH', password:'cashier123', role:'cashier', displayName:'ABDALLAH'}
    ]);
  }
  if(!_dataCache['cashier_wallets']) save('cashier_wallets', {vodafone:0, instapay:0});
  ['cashier_products','cashier_sales','cashier_purchases','cashier_suppliers','cashier_disbursements','cashier_shifts','cashier_stock_adjustments','cashier_wallet_transactions'].forEach(function(k){
    if(!_dataCache[k]) save(k, []);
  });
  ['invoice_counter','purchase_counter','wallet_counter'].forEach(function(k){
    if(_dataCache[k]===undefined || _dataCache[k]===null) save(k, 0);
  });
}

function formatDate(iso){
  if(!iso) return '-';
  var d = new Date(iso);
  return d.toLocaleDateString('ar-EG') + ' ' + d.toLocaleTimeString('ar-EG', {hour:'2-digit',minute:'2-digit'});
}
function paymentLabel(m){ return m==='cash'?'نقدي':(m==='vodafone'?'فودافون كاش':'انستاباي'); }
function badgeForStatus(status){
  var map = {pending:'<span class="badge badge-warning">قيد الانتظار</span>', approved:'<span class="badge badge-success">موافق عليها</span>', rejected:'<span class="badge badge-danger">مرفوضة</span>'};
  return map[status]||status;
}

/* ============ APP START / AUTH ============ */
function startApp(){
  document.getElementById('loadingScreen').style.display = 'none';
  seedData();
  var saved = sessionStorage.getItem('current_user');
  if(saved){
    try{ CURRENT_USER = JSON.parse(saved); showMainApp(); }
    catch(e){ document.getElementById('loginScreen').style.display='flex'; }
  } else {
    document.getElementById('loginScreen').style.display='flex';
  }
}
function doLogin(){
  var username = document.getElementById('loginUsername').value.trim();
  var password = document.getElementById('loginPassword').value;
  var user = getUsers().find(function(u){ return u.username===username && u.password===password; });
  if(!user){ document.getElementById('loginError').textContent = 'اسم المستخدم أو كلمة المرور غير صحيحة'; return; }
  CURRENT_USER = user;
  sessionStorage.setItem('current_user', JSON.stringify(user));
  showMainApp();
}
function showMainApp(){
  document.getElementById('loginScreen').style.display='none';
  document.getElementById('mainApp').style.display='block';
  ACTIVE_TAB = ROLE_PERMISSIONS[CURRENT_USER.role][0];
  renderTopbar();
  renderTabs();
  renderActiveTab();
}
function doLogout(){
  try{
    closeModal();
    closeBarcodeScanner();
    sessionStorage.removeItem('current_user');
  }catch(e){}
  window.location.replace(window.location.pathname + window.location.search);
}

/* ============ MODAL ============ */
function showModal(html){
  document.getElementById('modalInner').innerHTML = html;
  document.getElementById('modalOverlay').style.display = 'flex';
}
function closeModal(){
  document.getElementById('modalOverlay').style.display = 'none';
}

/* ============ BARCODE SCANNER ============ */
function ensureBarcodeLib(cb){
  if(window.Html5Qrcode){ cb(); return; }
  loadScript('https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js').then(cb);
}
function openBarcodeScanner(onResult){
  _scanCallback = onResult;
  ensureBarcodeLib(function(){
    document.getElementById('scannerOverlay').style.display = 'flex';
    html5QrCode = new Html5Qrcode('scannerContainer');
    html5QrCode.start({facingMode:'environment'}, {fps:10, qrbox:220}, function(decodedText){
      closeBarcodeScanner();
      if(_scanCallback) _scanCallback(decodedText);
    }, function(err){}).catch(function(err){
      alert('تعذر فتح الكاميرا: ' + err);
      closeBarcodeScanner();
    });
  });
}
function closeBarcodeScanner(){
  var ov = document.getElementById('scannerOverlay');
  if(ov) ov.style.display = 'none';
  if(html5QrCode){
    try{ html5QrCode.stop().then(function(){ html5QrCode.clear(); }).catch(function(){}); }catch(e){}
    html5QrCode = null;
  }
}
function scanIntoField(fieldId){
  openBarcodeScanner(function(code){
    var el = document.getElementById(fieldId);
    if(el) el.value = code;
  });
}
function scanForCashier(){
  openBarcodeScanner(function(code){
    var p = getProducts().find(function(x){ return x.barcode===code; });
    if(!p){ alert('لم يتم العثور على منتج بهذا الباركود'); return; }
    addToCart(p.id);
  });
}

/* ============ TABS / TOPBAR ============ */
function renderTopbar(){
  var lowCount = getProducts().filter(function(p){ return p.stock<=(p.minStock||5); }).length;
  var html = '<div class="topbar">'+
    '<div class="logo-wrap"><div class="logo-icon">🛒</div><div class="logo-text"><h1>زين ماركت</h1><span>نظام إدارة الكاشير</span></div></div>'+
    '<div style="display:flex;align-items:center;gap:12px">'+
    '<span id="connStatus" style="font-size:12px">🟢 متصل</span>'+
    '<span style="cursor:pointer;position:relative" onclick="openStockAlertsModal()">🔔'+(lowCount>0?'<span class="badge-count">'+lowCount+'</span>':'')+'</span>'+
    '<span>'+CURRENT_USER.displayName+'</span>'+
    '<button class="btn btn-sm" onclick="doLogout()">🚪 خروج</button>'+
    '</div></div>';
  document.getElementById('topbarWrap').innerHTML = html;
}
function openStockAlertsModal(){
  var low = getProducts().filter(function(p){ return p.stock<=(p.minStock||5); });
  var html = '<h3>تنبيهات المخزون</h3>';
  if(low.length===0) html += '<p>لا توجد تنبيهات حالياً</p>';
  else {
    html += '<table class="data-table"><tr><th>المنتج</th><th>المخزون</th><th>الحد الأدنى</th></tr>';
    low.forEach(function(p){ html += '<tr><td>'+p.name+'</td><td>'+p.stock+'</td><td>'+(p.minStock||5)+'</td></tr>'; });
    html += '</table>';
  }
  showModal(html);
}
function renderTabs(){
  var perms = ROLE_PERMISSIONS[CURRENT_USER.role];
  var html = '<div class="tabs-row">';
  perms.forEach(function(t){
    html += '<button class="tab-btn'+(t===ACTIVE_TAB?' active':'')+'" onclick="switchTab(\''+t+'\')">'+TAB_LABELS[t]+'</button>';
  });
  html += '</div>';
  document.getElementById('tabsWrap').innerHTML = html;
}
function switchTab(tab){
  closeBarcodeScanner();
  closeModal();
  ACTIVE_TAB = tab;
  renderTabs();
  renderActiveTab();
}
function renderActiveTab(){
  if(_liveInterval){ clearInterval(_liveInterval); _liveInterval = null; }
  switch(ACTIVE_TAB){
    case 'cashier': renderCashier(); break;
    case 'purchases': renderPurchases(); break;
    case 'disbursements': renderDisbursements(); break;
    case 'wallets': renderWallets(); break;
    case 'live': renderLive(); break;
    case 'inventory': renderInventory(); break;
    case 'products': renderProducts(); break;
    case 'reports': renderReports(); break;
    case 'users': renderUsers(); break;
  }
}
function refreshCurrentView(){
  if(!CURRENT_USER) return;
  renderTopbar();
  if(document.getElementById('mainApp').style.display!=='none') renderActiveTab();
}

/* ============ CASHIER TAB (split screen) ============ */
function getActiveShift(){
  return getShifts().find(function(s){ return s.cashierName===CURRENT_USER.displayName && !s.closed; });
}
function renderCashier(){
  var el = document.getElementById('tabContent');
  var shift = getActiveShift();
  var html = '';
  if(!shift){
    html += '<div class="banner warning">⚠️ لم تبدأ شيفت عمل بعد. يجب بدء شيفت قبل البيع.<br><button class="btn btn-primary" onclick="openStartShiftModal()">▶️ بدء شيفت جديد</button></div>';
  } else {
    var stats = calcShiftStats(shift);
    html += '<div class="banner info"><span>🕐 شيفت '+shift.cashierName+' - بدأ '+formatDate(shift.startTime)+' | المبلغ الافتتاحي: '+shift.openingAmount+' ج | المتوقع بالدرج الآن: '+stats.expected.toFixed(2)+' ج</span>'+
      '<button class="btn btn-sm btn-danger" onclick="openEndShiftModal(\''+shift.id+'\')">⏹️ إنهاء الشيفت</button></div>';
  }
  html += '<div class="cashier-split">';
  html += '<div class="cashier-cart-panel" id="cartPanel"></div>';
  html += '<div class="cashier-products-panel">';
  html += '<input type="text" id="productSearch" placeholder="🔍 ابحث عن منتج أو اكتب الباركود" oninput="renderProductGrid()">';
  html += ' <button class="btn btn-sm" onclick="scanForCashier()">📷 مسح</button>';
  html += '<div class="product-grid" id="productGrid"></div>';
  html += '</div></div>';
  el.innerHTML = html;
  renderCartPanelInto();
  renderProductGrid();
}
function renderProductGrid(){
  var searchEl = document.getElementById('productSearch');
  var term = searchEl ? searchEl.value.trim().toLowerCase() : '';
  var products = getProducts().filter(function(p){
    return !term || p.name.toLowerCase().indexOf(term)>=0 || (p.barcode||'').toLowerCase().indexOf(term)>=0;
  });
  var html = products.map(function(p){
    var cls = 'product-card' + (p.stock<=0?' out-stock': (p.stock<=(p.minStock||5)?' low-stock':''));
    return '<div class="'+cls+'" onclick="addToCart(\''+p.id+'\')">'+
      '<div style="font-weight:700">'+p.name+'</div>'+
      '<div style="color:var(--primary);font-weight:700">'+p.price+' ج</div>'+
      '<div style="font-size:11px;color:#888">متاح: '+p.stock+'</div></div>';
  }).join('');
  document.getElementById('productGrid').innerHTML = html || '<p>لا توجد منتجات مطابقة</p>';
}
function addToCart(productId){
  var shift = getActiveShift();
  if(!shift){ alert('يجب بدء شيفت أولاً قبل البيع'); return; }
  var product = getProducts().find(function(p){ return p.id===productId; });
  if(!product || product.stock<=0){ alert('المنتج غير متاح في المخزون'); return; }
  var line = CART.find(function(c){ return c.productId===productId; });
  if(line){
    if(line.qty+1 > product.stock){ alert('الكمية المتاحة في المخزون غير كافية'); return; }
    line.qty++;
  } else {
    CART.push({productId:productId, name:product.name, price:product.price, qty:1});
  }
  renderCartPanelInto();
}
function changeCartQty(i, delta){
  var c = CART[i]; if(!c) return;
  var product = getProducts().find(function(p){ return p.id===c.productId; });
  var newQty = c.qty + delta;
  if(newQty<=0){ CART.splice(i,1); renderCartPanelInto(); return; }
  if(product && newQty>product.stock){ alert('الكمية المتاحة غير كافية'); return; }
  c.qty = newQty;
  renderCartPanelInto();
}
function removeFromCart(i){ CART.splice(i,1); renderCartPanelInto(); }
function renderCartPanelInto(){
  document.getElementById('cartPanel').innerHTML = buildCartPanelHTML();
}
function buildCartPanelHTML(){
  var html = '<h3 style="margin-top:0">🧾 السلة / الفاتورة</h3>';
  if(CART.length===0){
    html += '<p style="color:#888">السلة فارغة - اختر منتجات من القائمة بجانبها</p>';
  } else {
    html += '<table class="data-table"><tr><th>المنتج</th><th>الكمية</th><th>السعر</th><th>الإجمالي</th><th></th></tr>';
    CART.forEach(function(c,i){
      html += '<tr><td>'+c.name+'</td>'+
        '<td><button class="btn btn-sm" onclick="changeCartQty('+i+',-1)">-</button> '+c.qty+' <button class="btn btn-sm" onclick="changeCartQty('+i+',1)">+</button></td>'+
        '<td>'+c.price+'</td><td>'+(c.price*c.qty).toFixed(2)+'</td>'+
        '<td><button class="btn btn-sm btn-danger" onclick="removeFromCart('+i+')">🗑️</button></td></tr>';
    });
    html += '</table>';
  }
  var subtotal = CART.reduce(function(a,c){ return a+c.price*c.qty; },0);
  html += '<label>الخصم %</label><input type="number" id="cartDiscount" value="0" oninput="updateCartTotals()">';
  html += '<label>الضريبة %</label><input type="number" id="cartTax" value="0" oninput="updateCartTotals()">';
  html += '<label>طريقة الدفع</label><select id="cartPayment"><option value="cash">نقدي</option><option value="vodafone">فودافون كاش</option><option value="instapay">انستاباي</option></select>';
  html += '<p>الإجمالي الفرعي: <span id="cartSubtotalDisp">'+subtotal.toFixed(2)+'</span> ج</p>';
  html += '<p style="font-size:18px"><b>الإجمالي النهائي: <span id="cartTotalDisp">'+subtotal.toFixed(2)+'</span> ج</b></p>';
  html += '<button class="btn btn-primary" style="width:100%" onclick="processCheckout()">✅ إتمام البيع</button>';
  return html;
}
function updateCartTotals(){
  var discountPercent = parseFloat(document.getElementById('cartDiscount').value)||0;
  var taxPercent = parseFloat(document.getElementById('cartTax').value)||0;
  var subtotal = CART.reduce(function(a,c){ return a+c.price*c.qty; },0);
  var afterDiscount = subtotal - (subtotal*discountPercent/100);
  var total = afterDiscount + (afterDiscount*taxPercent/100);
  document.getElementById('cartSubtotalDisp').textContent = subtotal.toFixed(2);
  document.getElementById('cartTotalDisp').textContent = total.toFixed(2);
}
function processCheckout(){
  var shift = getActiveShift();
  if(!shift){ alert('يجب بدء شيفت أولاً'); return; }
  if(CART.length===0){ alert('السلة فارغة'); return; }
  var discountPercent = parseFloat(document.getElementById('cartDiscount').value)||0;
  var taxPercent = parseFloat(document.getElementById('cartTax').value)||0;
  var paymentMethod = document.getElementById('cartPayment').value;
  var subtotal = CART.reduce(function(a,c){ return a+c.price*c.qty; },0);
  var afterDiscount = subtotal - (subtotal*discountPercent/100);
  var total = afterDiscount + (afterDiscount*taxPercent/100);
  var cartCopy = CART.slice();
  nextCounter('invoice_counter', function(num){
    var sale = {
      invoiceNum:num, date:new Date().toISOString(), items:cartCopy,
      subtotal:subtotal, discountPercent:discountPercent, taxPercent:taxPercent, total:total,
      soldBy:CURRENT_USER.displayName, paymentMethod:paymentMethod
    };
    var products = getProducts();
    cartCopy.forEach(function(c){
      var p = products.find(function(pp){ return pp.id===c.productId; });
      if(p) p.stock -= c.qty;
    });
    saveProducts(products);
    var sales = getSales(); sales.push(sale); saveSales(sales);
    if(paymentMethod==='vodafone' || paymentMethod==='instapay'){
      var wallets = getWallets();
      wallets[paymentMethod] = (wallets[paymentMethod]||0) + total;
      saveWallets(wallets);
      var txs = getWalletTransactions();
      txs.push({id:genId(), walletType:paymentMethod, operation:'sale', amount:total, commission:0, phone:'', cashEffect:0, walletEffect:total, date:new Date().toISOString(), user:CURRENT_USER.displayName});
      saveWalletTransactions(txs);
    }
    CART = [];
    showInvoice(sale);
    renderCashier();
  });
}

/* ---- Shift management ---- */
function openStartShiftModal(){
  showModal('<h3>بدء شيفت جديد</h3><label>المبلغ الافتتاحي بالدرج</label><input type="number" id="shiftOpenAmt" value="0"><button class="btn btn-primary" onclick="confirmStartShift()">بدء الشيفت</button>');
}
function confirmStartShift(){
  try{
    var amt = parseFloat(document.getElementById('shiftOpenAmt').value) || 0;
    var shifts = getShifts();
    shifts.push({id:genId(), cashierName:CURRENT_USER.displayName, openingAmount:amt, startTime:new Date().toISOString(), endTime:null, closingAmount:null, closed:false, expectedAmount:0, difference:0});
    saveShifts(shifts);
    closeModal();
    renderCashier();
  }catch(e){
    alert('حدث خطأ أثناء بدء الشيفت: ' + e.message);
    closeModal();
    renderCashier();
  }
}
function openEndShiftModal(shiftId){
  var shift = getShifts().find(function(s){ return s.id===shiftId; });
  var stats = calcShiftStats(shift);
  showModal('<h3>إنهاء الشيفت</h3><p>المبلغ المتوقع بالدرج: <b>'+stats.expected.toFixed(2)+' ج</b></p><label>المبلغ الفعلي المعدود بالدرج</label><input type="number" id="shiftCloseAmt" value="0"><button class="btn btn-primary" onclick="confirmEndShift(\''+shiftId+'\')">تأكيد الإنهاء</button>');
}
function calcShiftStats(shift){
  if(!shift) return {cashSalesTotal:0, walletCashTotal:0, expensesTotal:0, expected:0};
  var sales = getSales().filter(function(s){ return s.soldBy===shift.cashierName && new Date(s.date) >= new Date(shift.startTime); });
  var cashSalesTotal = sales.filter(function(s){ return s.paymentMethod==='cash'; }).reduce(function(a,s){ return a+s.total; },0);
  var walletCashTotal = getWalletTransactions().filter(function(w){ return w.user===shift.cashierName && new Date(w.date) >= new Date(shift.startTime); }).reduce(function(a,w){ return a + (w.cashEffect||0); },0);
  var expensesTotal = getDisbursements().filter(function(d){ return d.requestedBy===shift.cashierName && d.source==='drawer' && d.status==='approved' && new Date(d.date) >= new Date(shift.startTime); }).reduce(function(a,d){ return a+d.amount; },0);
  var expected = (shift.openingAmount||0) + cashSalesTotal - expensesTotal + walletCashTotal;
  return {cashSalesTotal:cashSalesTotal, walletCashTotal:walletCashTotal, expensesTotal:expensesTotal, expected:expected};
}
function confirmEndShift(shiftId){
  try{
    var actual = parseFloat(document.getElementById('shiftCloseAmt').value) || 0;
    var shifts = getShifts();
    var shift = shifts.find(function(s){ return s.id===shiftId; });
    if(!shift){
      alert('تعذر العثور على بيانات الشيفت، حاول الضغط على "إنهاء الشيفت" مرة أخرى من الصفحة الرئيسية');
      closeModal();
      renderCashier();
      return;
    }
    var stats = calcShiftStats(shift);
    shift.closed = true;
    shift.endTime = new Date().toISOString();
    shift.closingAmount = actual;
    shift.expectedAmount = stats.expected;
    shift.difference = actual - stats.expected;
    saveShifts(shifts);
    closeModal();
    renderCashier();
  }catch(e){
    alert('حدث خطأ أثناء إنهاء الشيفت: ' + e.message);
    closeModal();
    renderCashier();
  }
}

function saveProductForm(){
  var id = document.getElementById('prodId').value;
  var products = getProducts();
  var name = document.getElementById('prodName').value.trim();
  var price = parseFloat(document.getElementById('prodPrice').value)||0;
  var stock = parseFloat(document.getElementById('prodStock').value)||0;
  var barcode = document.getElementById('prodBarcode').value.trim();
  var minStock = parseFloat(document.getElementById('prodMinStock').value)||5;
  if(!name){ alert('اسم المنتج مطلوب'); return; }
  if(id){
    var p = products.find(function(x){ return x.id===id; });
    p.name=name; p.price=price; p.stock=stock; p.barcode=barcode; p.minStock=minStock;
  } else {
    products.push({id:genId(), name:name, price:price, stock:stock, barcode:barcode, minStock:minStock, dateAdded:new Date().toISOString()});
  }
  saveProducts(products);
  closeModal();
  renderProducts();
}
function deleteProduct(id){
  if(!confirm('تأكيد حذف المنتج؟')) return;
  saveProducts(getProducts().filter(function(p){ return p.id!==id; }));
  renderProducts();
}

/* ============ PURCHASES TAB ============ */
function buildInstallments(total, n){
  n = n||3;
  var base = Math.floor((total/n)*100)/100;
  var installments = [];
  var sum = 0;
  for(var i=0;i<n-1;i++){ installments.push({id:genId(), amount:base, paid:false, disbursementRequestId:null, paidDate:null}); sum += base; }
  installments.push({id:genId(), amount: Math.round((total-sum)*100)/100, paid:false, disbursementRequestId:null, paidDate:null});
  return installments;
}
function renderPurchases(){
  var suppliers = getSuppliers();
  var purchases = getPurchases().filter(function(p){ return CURRENT_USER.role==='admin' || p.requestedBy===CURRENT_USER.displayName; });
  var html = '<h3>فاتورة شراء جديدة</h3>';
  if(suppliers.length===0) html += '<p style="color:#888">لا يوجد موردين بعد.</p>';
  html += '<label>المورد</label><select id="purSupplier">'+suppliers.map(function(s){ return '<option value="'+s.id+'">'+s.name+' ('+(s.type==='cash'?'كاش':'آجل')+')</option>'; }).join('')+'</select>';
  if(CURRENT_USER.role==='admin') html += ' <button class="btn btn-sm" onclick="openAddSupplierModal()">+ إضافة مورد</button>';
  html += '<div style="margin-top:10px;padding:10px;background:#fff;border-radius:8px">';
  html += '<label>المنتج</label><select id="purProductSelect" onchange="togglePurNewProduct()"><option value="new">+ منتج جديد</option>'+getProducts().map(function(p){ return '<option value="'+p.id+'">'+p.name+'</option>'; }).join('')+'</select>';
  html += '<div id="purNewProductFields"><label>اسم المنتج الجديد</label><input id="purNewName"><label>الباركود</label><div style="display:flex;gap:5px"><input id="purNewBarcode" style="flex:1"><button class="btn btn-sm" onclick="scanIntoField(\'purNewBarcode\')">📷</button></div></div>';
  html += '<label>الكمية</label><input type="number" id="purQty" value="1">';
  html += '<label>سعر الشراء (للوحدة)</label><input type="number" id="purCost" value="0">';
  html += '<label>سعر البيع (للوحدة)</label><input type="number" id="purSell" value="0">';
  html += '<button class="btn btn-sm" onclick="addPurchaseItem()">+ إضافة للفاتورة</button>';
  html += '</div>';
  html += '<table class="data-table"><tr><th>المنتج</th><th>الكمية</th><th>شراء</th><th>بيع</th><th></th></tr>'+renderPurchaseItemsRows()+'</table>';
  html += '<p>إجمالي الفاتورة: <b>'+purchaseItemsTotal().toFixed(2)+'</b> ج</p>';
  html += '<button class="btn btn-primary" onclick="submitPurchase()">✅ تأكيد الفاتورة</button>';
  html += '<hr><h3>سجل فواتير الشراء</h3><table class="data-table"><tr><th>رقم</th><th>التاريخ</th><th>المورد</th><th>الإجمالي</th><th>الحالة</th><th>بواسطة</th><th>إجراءات</th></tr>';
  purchases.slice().reverse().forEach(function(p){
    html += '<tr><td>'+p.purchaseNum+'</td><td>'+formatDate(p.date)+'</td><td>'+p.supplierName+'</td><td>'+p.total.toFixed(2)+'</td><td>'+badgeForStatus(p.status)+'</td><td>'+p.requestedBy+'</td><td>';
    if(CURRENT_USER.role==='admin' && p.status==='pending'){
      html += '<button class="btn btn-sm btn-primary" onclick="approvePurchase(\''+p.id+'\')">✔️ موافقة</button> <button class="btn btn-sm btn-danger" onclick="rejectPurchase(\''+p.id+'\')">✖️ رفض</button>';
    }
    if(p.status==='approved' && p.supplierType==='credit'){
      html += '<button class="btn btn-sm" onclick="viewInstallments(\''+p.id+'\')">🧾 الأقساط</button>';
    }
    if(p.status==='rejected' && p.rejectReason){ html += '<br><small style="color:#e74c3c">السبب: '+p.rejectReason+'</small>'; }
    html += '</td></tr>';
  });
  html += '</table>';
  document.getElementById('tabContent').innerHTML = html;
}
function togglePurNewProduct(){
  var sel = document.getElementById('purProductSelect').value;
  document.getElementById('purNewProductFields').style.display = sel==='new' ? 'block' : 'none';
}
function renderPurchaseItemsRows(){
  return PURCHASE_ITEMS.map(function(it,i){
    return '<tr><td>'+it.name+'</td><td>'+it.qty+'</td><td>'+it.costPrice+'</td><td>'+it.sellPrice+'</td><td><button class="btn btn-sm btn-danger" onclick="removePurchaseItem('+i+')">🗑️</button></td></tr>';
  }).join('');
}
function purchaseItemsTotal(){ return PURCHASE_ITEMS.reduce(function(a,it){ return a + it.costPrice*it.qty; },0); }
function addPurchaseItem(){
  var sel = document.getElementById('purProductSelect').value;
  var qty = parseFloat(document.getElementById('purQty').value)||0;
  var cost = parseFloat(document.getElementById('purCost').value)||0;
  var sell = parseFloat(document.getElementById('purSell').value)||0;
  if(qty<=0){ alert('أدخل كمية صحيحة'); return; }
  if(sel==='new'){
    var name = document.getElementById('purNewName').value.trim();
    var barcode = document.getElementById('purNewBarcode').value.trim();
    if(!name){ alert('أدخل اسم المنتج'); return; }
    PURCHASE_ITEMS.push({productId:null, name:name, qty:qty, costPrice:cost, sellPrice:sell, isNew:true, barcode:barcode});
  } else {
    var p = getProducts().find(function(x){ return x.id===sel; });
    PURCHASE_ITEMS.push({productId:p.id, name:p.name, qty:qty, costPrice:cost, sellPrice: sell||p.price, isNew:false});
  }
  renderPurchases();
}
function removePurchaseItem(i){ PURCHASE_ITEMS.splice(i,1); renderPurchases(); }
function submitPurchase(){
  if(PURCHASE_ITEMS.length===0){ alert('أضف منتجات للفاتورة أولاً'); return; }
  var supplierId = document.getElementById('purSupplier').value;
  var supplier = getSuppliers().find(function(s){ return s.id===supplierId; });
  if(!supplier){ alert('اختر مورد'); return; }
  var total = purchaseItemsTotal();
  var itemsCopy = PURCHASE_ITEMS.slice();
  nextCounter('purchase_counter', function(num){
    var isAdmin = CURRENT_USER.role==='admin';
    var purchase = {
      id:genId(), purchaseNum:num, date:new Date().toISOString(), supplierId:supplier.id, supplierName:supplier.name, supplierType:supplier.type,
      items:itemsCopy, total:total, requestedBy:CURRENT_USER.displayName,
      status: isAdmin?'approved':'pending', approvedBy: isAdmin?CURRENT_USER.displayName:null, approvedDate: isAdmin?new Date().toISOString():null,
      rejectReason:null, installments: (supplier.type==='credit' && isAdmin) ? buildInstallments(total,3) : []
    };
    var purchases = getPurchases(); purchases.push(purchase); savePurchases(purchases);
    if(isAdmin) applyPurchaseStock(purchase);
    PURCHASE_ITEMS = [];
    renderPurchases();
  });
}
function applyPurchaseStock(purchase){
  var products = getProducts();
  purchase.items.forEach(function(it){
    if(it.isNew){
      products.push({id:genId(), name:it.name, price:it.sellPrice||0, stock:it.qty, barcode:it.barcode||'', minStock:5, dateAdded:new Date().toISOString()});
    } else {
      var p = products.find(function(pp){ return pp.id===it.productId; });
      if(p){ p.stock += it.qty; if(it.sellPrice) p.price = it.sellPrice; }
    }
  });
  saveProducts(products);
}

  var purchases = getPurchases();

  renderPurchases();
}

function submitWalletOp(){
  var type = document.getElementById('walType').value;
  var op = document.getElementById('walOp').value;
  var amount = parseFloat(document.getElementById('walAmount').value)||0;
  var phone = document.getElementById('walPhone').value.trim();
  if(amount<=0){ alert('أدخل مبلغ صحيح'); return; }
  var commission = 0, cashEffect = 0, walletEffect = 0;
  if(op==='withdraw'){
    commission = amount<1000 ? 5 : 15;
    cashEffect = -(amount - commission);
    walletEffect = amount;
  } else {
    cashEffect = amount;
    walletEffect = -amount;
  }
  var wallets = getWallets();
  wallets[type] = (wallets[type]||0) + walletEffect;
  saveWallets(wallets);
  var txs = getWalletTransactions();
  txs.push({id:genId(), walletType:type, operation:op, amount:amount, commission:commission, phone:phone, cashEffect:cashEffect, walletEffect:walletEffect, date:new Date().toISOString(), user:CURRENT_USER.displayName});
  saveWalletTransactions(txs);
  renderWallets();
}
function adjustWalletBalance(){
  var type = document.getElementById('walAdjType').value;
  var amount = parseFloat(document.getElementById('walAdjAmount').value)||0;
  var wallets = getWallets();
  wallets[type] = (wallets[type]||0) + amount;
  saveWallets(wallets);

    '</div>';

  html += '<table class="data-table"><tr><th>الاسم</th><th>الباركود</th><th>المخزون الحالي</th><th>الحد الأدنى</th><th>تاريخ الإضافة</th><th>إجراء</th></tr>';
  products.forEach(function(p){
    html += '<tr><td>'+p.name+'</td><td>'+(p.barcode||'-')+'</td><td>'+p.stock+'</td><td>'+(p.minStock||5)+'</td><td>'+formatDate(p.dateAdded)+'</td><td><button class="btn btn-sm" onclick="adjustSingleProductStock(\''+p.id+'\')">⚖️ تسوية</button></td></tr>';
  });
  html += '</table>';
  html += '<h3>سجل التسويات</h3><table class="data-table"><tr><th>المنتج</th><th>قبل</th><th>بعد</th><th>الفرق</th><th>النوع</th><th>السبب</th><th>التاريخ</th><th>بواسطة</th></tr>';
  adjustments.slice().reverse().forEach(function(a){
    html += '<tr><td>'+a.productName+'</td><td>'+a.qtyBefore+'</td><td>'+a.qtyAfter+'</td><td>'+a.difference+'</td><td>'+(a.type==='increase'?'<span class="badge badge-success">زيادة</span>':'<span class="badge badge-danger">نقص</span>')+'</td><td>'+a.reason+'</td><td>'+formatDate(a.date)+'</td><td>'+a.user+'</td></tr>';
  });
  html += '</table>';
  document.getElementById('tabContent').innerHTML = html;
}
function logStockAdjustment(p, newQty, reason){
  var adjustments = getStockAdjustments();
  var diff = newQty - p.stock;
  adjustments.push({id:genId(), productId:p.id, productName:p.name, qtyBefore:p.stock, qtyAfter:newQty, difference:diff, type: diff>=0?'increase':'decrease', reason:reason, date:new Date().toISOString(), user:CURRENT_USER.displayName});
  saveStockAdjustments(adjustments);
}
function adjustSingleProductStock(productId){
  var products = getProducts();
  var p = products.find(function(x){ return x.id===productId; });
  if(!p) return;
  var newQty = prompt('الكمية الفعلية الجديدة لـ "'+p.name+'" (الحالية: '+p.stock+')', p.stock);
  if(newQty===null) return;
  newQty = parseFloat(newQty);
  if(isNaN(newQty)){ alert('قيمة غير صحيحة'); return; }
  var reason = prompt('سبب التسوية؟') || 'جرد';
  logStockAdjustment(p, newQty, reason);
  p.stock = newQty;
  saveProducts(products);
  renderInventory();
}
function scanForInventoryAdjust(){
  openBarcodeScanner(function(code){
    var p = getProducts().find(function(x){ return x.barcode===code; });
    if(!p){ alert('لم يتم العثور على منتج بهذا الباركود'); return; }
    adjustSingleProductStock(p.id);
  });
}

function submitStockCount(){
  var inputs = document.querySelectorAll('.stockCountInput');
  var products = getProducts();
  inputs.forEach(function(inp){
    var id = inp.getAttribute('data-id');
    var newQty = parseFloat(inp.value);

function resetAllData(){
  if(!confirm('تحذير: سيتم حذف جميع البيانات نهائياً من كل الأجهزة. هل أنت متأكد؟')) return;
  if(!confirm('تأكيد نهائي: لا يمكن التراجع عن هذا الإجراء. هل تريد المتابعة؟')) return;
  if(!db) return;
  var batch = db.batch();
  SYNC_KEYS.forEach(function(key){ batch.delete(db.collection('cashier_data').doc(key)); });
  batch.commit().then(function(){
    alert('تم حذف جميع البيانات، سيتم إعادة تحميل الصفحة');
    window.location.reload();
  });
}

/* ============ EXCEL EXPORT ============ */
function ensureXLSX(cb){
  if(window.XLSX){ cb(); return; }
  loadScript('https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js').then(cb);
}
function exportToExcel(data, filename, sheetName){
  ensureXLSX(function(){
    var ws = XLSX.utils.json_to_sheet(data);
    var wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, sheetName||'Sheet1');
    XLSX.writeFile(wb, filename);
  });
}
function exportProductsExcel(){ exportToExcel(getProducts(), 'المنتجات.xlsx', 'المنتجات'); }
function exportDisbursementsExcel(){
  var list = getDisbursements().filter(function(d){ return CURRENT_USER.role==='admin' || d.requestedBy===CURRENT_USER.displayName; });
  exportToExcel(list, 'طلبات_الصرف.xlsx', 'الصرف');
}
function exportSalesExcel(){
  var list = getSales().filter(function(s){ return CURRENT_USER.role==='admin' || s.soldBy===CURRENT_USER.displayName; });
  exportToExcel(list, 'المبيعات.xlsx', 'المبيعات');
}
function exportWalletsExcel(){
  var list = getWalletTransactions().filter(function(t){ return CURRENT_USER.role==='admin' || t.user===CURRENT_USER.displayName; });
  exportToExcel(list, 'المحافظ.xlsx', 'المحافظ');
}
function exportInventoryExcel(){ exportToExcel(getProducts(), 'المخزون.xlsx', 'المخزون'); }
