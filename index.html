<style>

<script>
var APP_BUILD = 10;
var firebaseConfig = {
  apiKey: "AIzaSyDIp3OlRAP0Wa7Ea1W87NZkYAwOe0xueSQ",
  authDomain: "casheir-840ee.firebaseapp.com",

var db = firebase.firestore();
try { db.enablePersistence({synchronizeTabs:true}).catch(function(){}); } catch(e){}
var CD = db.collection('cashier_data');

var ROLE_PERMISSIONS = {
  admin: ['cashier','purchases','disbursements','returns','wallets','live','inventory','products','reports','profit','safe','deficits','users'],
  cashier: ['cashier','purchases','disbursements','returns','wallets','reports']
};
var TAB_DEFS = [
  {id:'cashier',label:'💰 الكاشير'},{id:'purchases',label:'📥 فواتير الشراء'},{id:'disbursements',label:'💸 طلبات الصرف'},
  {id:'returns',label:'↩️ المرتجعات والتوالف'},{id:'wallets',label:'💳 المحافظ الإلكترونية'},{id:'live',label:'📡 متابعة مباشرة'},
  {id:'inventory',label:'📦 المخزون'},{id:'products',label:'🛒 المنتجات'},{id:'reports',label:'📊 التقارير'},
  {id:'profit',label:'📈 الأرباح'},{id:'safe',label:'🏦 الخزنة'},{id:'deficits',label:'⚠️ العجز'},{id:'users',label:'👥 إدارة المستخدمين'}
];
var SYNC_KEYS = ['cashier_users','cashier_products','cashier_sales','cashier_purchases','cashier_suppliers','cashier_disbursements','cashier_shifts','cashier_stock_adjustments','cashier_wallets','cashier_wallet_transactions','cashier_safe','cashier_safe_transactions','cashier_returns','cashier_damages','invoice_counter','purchase_counter','wallet_counter'];
var DEFAULT_USERS = [
  {id:'u_admin',displayName:'MOHAMED NAZIH',password:'admin123',role:'admin'},
  {id:'u_cashier',displayName:'ABDALLAH',password:'cashier123',role:'cashier'}
];
var PAY = {cash:'نقدي',vodafone:'فودافون كاش',instapay:'انستاباي'};
var METHODS = {paid:'الكاشير سدد العجز',salary:'خصم من مستحقات الكاشير',writeoff:'شطب العجز (خسارة)'};

var _dataCache = {}, CURRENT_USER = null, CURRENT_TAB = 'cashier', CART = [], PUR_ITEMS = [];
var checkoutBusy = false, currentInvoiceBody = '', scannerObj = null, appReady = false, bannerState = '', settling = false, liveTimer = null;

window.onerror = function(m){ console.error(m); };

/* ---------- helpers ---------- */
function $(id){ return document.getElementById(id); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function num(v){ var n=parseFloat(v); return isNaN(n)?0:n; }
function r2(n){ return Math.round((n+Number.EPSILON)*100)/100; }
function fmt(n){ return Number(r2(num(n))).toLocaleString('en-US',{maximumFractionDigits:2}); }
function nowISO(){ return new Date().toISOString(); }
function fdate(d){ return d?new Date(d).toLocaleString('ar-EG'):'-'; }
function sameDay(d){ return new Date(d).toDateString()===new Date().toDateString(); }
function sameMonth(d){ var a=new Date(d),b=new Date(); return a.getMonth()===b.getMonth()&&a.getFullYear()===b.getFullYear(); }
function sum(arr,f){ return arr.reduce(function(a,x){return a+num(x[f]);},0); }
function genId(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function isAdmin(){ return CURRENT_USER&&CURRENT_USER.role==='admin'; }
function mine(arr,field){ return isAdmin()?arr:arr.filter(function(x){return x[field]===CURRENT_USER.displayName;}); }
function clean(o){ return JSON.parse(JSON.stringify(o===undefined?null:o)); }
function modalOpen(){ return $('modalOverlay').style.display==='flex'||$('scannerOverlay').style.display==='flex'; }

/* ---------- data layer ---------- */
function defaultValueFor(k){
  if(k==='cashier_wallets') return {vodafone:0,instapay:0};
  if(k==='cashier_safe') return {balance:0};
  if(k==='invoice_counter'||k==='purchase_counter'||k==='wallet_counter') return 0;
  return [];
}
function load(k){ var v=_dataCache[k]; if(v===undefined||v===null) return defaultValueFor(k); return JSON.parse(JSON.stringify(v)); }
function save(k,v){ var c=clean(v); _dataCache[k]=c; return CD.doc(k).set({v:c,updatedAt:Date.now()}); }
function getUsers(){ var u=load('cashier_users'); return u.length?u:DEFAULT_USERS; }
function nextCounter(key,start){
  var ref=CD.doc(key);
  return db.runTransaction(function(t){
    return t.get(ref).then(function(d){
      var n=(d.exists&&typeof d.data().v==='number')?d.data().v+1:start;
      t.set(ref,{v:n,updatedAt:Date.now()}); return n;
    });
  }).then(function(n){ _dataCache[key]=n; return n; });
}
function adjustSafeBalance(delta,tx){
  var ref=CD.doc('cashier_safe'), tref=CD.doc('cashier_safe_transactions');
  return db.runTransaction(function(t){
    return Promise.all([t.get(ref),t.get(tref)]).then(function(r){
      var cur=r[0].exists?(r[0].data().v||{balance:0}):{balance:0};
      var nb=r2(num(cur.balance)+delta);
      var list=r[1].exists?(r[1].data().v||[]):[];
      if(tx){ tx=clean(tx); tx.id=genId(); tx.date=nowISO(); tx.amount=delta; list.push(tx); }
      t.set(ref,{v:{balance:nb},updatedAt:Date.now()});
      t.set(tref,{v:list,updatedAt:Date.now()});
      return {nb:nb,list:list};
    });
  }).then(function(res){
    _dataCache.cashier_safe={balance:res.nb}; _dataCache.cashier_safe_transactions=res.list;
    if(CURRENT_TAB==='safe'&&!modalOpen()) renderTab('safe');
    return res.nb;
  });
}
function adjustWalletBalance(wallet,delta,tx){
  var ref=CD.doc('cashier_wallets'), tref=CD.doc('cashier_wallet_transactions');
  return db.runTransaction(function(t){
    return Promise.all([t.get(ref),t.get(tref)]).then(function(r){
      var cur=r[0].exists?(r[0].data().v||{vodafone:0,instapay:0}):{vodafone:0,instapay:0};
      cur[wallet]=r2(num(cur[wallet])+delta);
      var list=r[1].exists?(r[1].data().v||[]):[];
      if(tx){ tx=clean(tx); tx.id=genId(); tx.date=nowISO(); tx.wallet=wallet; tx.user=tx.user||CURRENT_USER.displayName; list.push(tx); }
      t.set(ref,{v:cur,updatedAt:Date.now()});
      t.set(tref,{v:list,updatedAt:Date.now()});
      return {w:cur,list:list};
    });
  }).then(function(res){
    _dataCache.cashier_wallets=res.w; _dataCache.cashier_wallet_transactions=res.list;
    if(CURRENT_TAB==='wallets'&&!modalOpen()) renderTab('wallets');
    return res.w;
  });
}
function safeBalance(){ return num(load('cashier_safe').balance); }

/* ---------- boot ---------- */
CD.onSnapshot({includeMetadataChanges:true},function(snap){
  if(!appReady&&snap.empty&&snap.metadata.fromCache) return;
  var changes=snap.docChanges();
  changes.forEach(function(ch){
    if(ch.type==='removed') delete _dataCache[ch.doc.id]; else _dataCache[ch.doc.id]=ch.doc.data().v;
  });
  if(!snap.metadata.fromCache&&!(_dataCache.cashier_users||[]).length) save('cashier_users',DEFAULT_USERS);
  if(!appReady){ appReady=true; boot(); }
  else if(changes.length) refreshCurrentView();
},function(err){ console.error(err); });
setTimeout(function(){ if(!appReady){ appReady=true; boot(); } },15000);

function boot(){
  $('loading').style.display='none';
  var n=sessionStorage.getItem('current_user');
  var u=n&&getUsers().find(function(x){return x.displayName===n;});
  if(u){ CURRENT_USER=u; showApp(); } else { $('login').style.display='block'; }
}
function doLogin(){
  var n=$('lgName').value.trim().toLowerCase(), p=$('lgPass').value;
  var u=getUsers().find(function(x){return String(x.displayName).toLowerCase()===n&&x.password===p;});
  if(!u){ $('lgErr').textContent='اسم المستخدم أو كلمة المرور غير صحيحة'; return; }
  sessionStorage.setItem('current_user',u.displayName); CURRENT_USER=u;
  $('login').style.display='none'; showApp();
}
function logout(){ sessionStorage.removeItem('current_user'); window.location.replace(window.location.pathname); }
function showApp(){
  $('app').style.display='block';
  $('buildBadge').textContent='نسخة '+APP_BUILD;
  $('userLbl').textContent='👤 '+CURRENT_USER.displayName+(isAdmin()?' (مدير)':' (كاشير)');
  $('pwBtn').style.display=isAdmin()?'inline-block':'none';
  if(!liveTimer) liveTimer=setInterval(function(){ if(CURRENT_TAB==='live'&&!modalOpen()) renderLiveTable(); },3000);
  switchTab('cashier');
}
function buildTabs(){
  if(!CURRENT_USER) return;
  var perms=ROLE_PERMISSIONS[CURRENT_USER.role]||[];
  var pend=load('cashier_shifts').filter(function(s){return s.deficitStatus==='pending';}).length;
  $('tabs').innerHTML=TAB_DEFS.filter(function(t){return perms.indexOf(t.id)>-1;}).map(function(t){
    return '<button class="'+(t.id===CURRENT_TAB?'on':'')+'" onclick="switchTab(\''+t.id+'\')">'+t.label+(t.id==='deficits'&&pend?' ('+pend+')':'')+'</button>';
  }).join('');
}
function switchTab(t){
  var perms=ROLE_PERMISSIONS[CURRENT_USER.role]||[];
  if(perms.indexOf(t)<0) return;
  CURRENT_TAB=t; buildTabs(); renderTab(t); window.scrollTo(0,0);
}
function renderTab(t){
  var m={cashier:renderCashier,purchases:renderPurchases,disbursements:renderDisbursements,returns:renderReturns,wallets:renderWallets,live:renderLive,inventory:renderInventory,products:renderProducts,reports:renderReports,profit:renderProfit,safe:renderSafe,deficits:renderDeficits,users:renderUsers};
  if(m[t]) m[t]();
}
function refreshCurrentView(){
  buildTabs();
  if(modalOpen()) return;
  if(CURRENT_TAB==='cashier'){ renderCashierGrid(); renderShiftBanner(); return; }
  if(CURRENT_TAB==='live') return;
  var a=document.activeElement;
  if(a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)&&$('content').contains(a)) return;
  renderTab(CURRENT_TAB);
}

/* ---------- modal ---------- */
function openModal(title,html,wide){
  $('modalTitle').textContent=title; $('modalBody').innerHTML=html;
  $('modalBox').className='modal'+(wide?' wide':'');
  $('modalOverlay').style.display='flex';
}
function closeModal(){ $('modalOverlay').style.display='none'; $('modalBody').innerHTML=''; }

/* ---------- scanner ---------- */
function startScanner(cb){
  $('scannerOverlay').style.display='flex';
  try{
    scannerObj=new Html5Qrcode('scannerReader');
    scannerObj.start({facingMode:'environment'},{fps:10,qrbox:{width:250,height:150}},function(text){ stopScanner(); cb(text); },function(){})
    .catch(function(e){ alert('تعذر تشغيل الكاميرا: '+e); stopScanner(); });
  }catch(e){ alert('الماسح غير متاح'); stopScanner(); }
}
function stopScanner(){
  var done=function(){ $('scannerOverlay').style.display='none'; $('scannerReader').innerHTML=''; scannerObj=null; };
  if(scannerObj){ scannerObj.stop().then(function(){ try{scannerObj.clear();}catch(e){} done(); }).catch(done); } else done();
}
function scanIntoField(id){ startScanner(function(code){ $(id).value=code; if(id==='purBarcode') onPurBarcodeChange(); }); }
function scanForCashier(){
  startScanner(function(code){
    var p=load('cashier_products').find(function(x){return String(x.barcode)===String(code);});
    if(p) addToCart(p.id); else alert('المنتج غير موجود: '+code);
  });
}
function scanForInventoryAdjust(){
  startScanner(function(code){
    var p=load('cashier_products').find(function(x){return String(x.barcode)===String(code);});
    if(p) openAdjustModal(p.id); else alert('المنتج غير موجود: '+code);
  });
}

/* ---------- excel ---------- */
function xl(name,sheet,rows){
  if(typeof XLSX==='undefined'){ alert('مكتبة Excel لم تُحمّل، تأكد من الإنترنت'); return; }
  if(!rows.length){ alert('لا توجد بيانات للتصدير'); return; }
  var ws=XLSX.utils.json_to_sheet(rows), wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,sheet); wb.Workbook={Views:[{RTL:true}]};
  XLSX.writeFile(wb,name+'_'+new Date().toISOString().slice(0,10)+'.xlsx');
}

/* ---------- shifts ---------- */
function openShiftOf(name){ var s=load('cashier_shifts'); for(var i=0;i<s.length;i++) if(s[i].cashierName===name&&!s[i].closed) return s[i]; return null; }
function myShift(){ return openShiftOf(CURRENT_USER.displayName); }
function calcShiftStats(sh){
  var z={cashSalesTotal:0,walletCashTotal:0,expensesTotal:0,returnsTotal:0,expected:0,salesCount:0};
  if(!sh) return z;
  load('cashier_sales').forEach(function(s){ if(s.shiftId===sh.id){ z.salesCount++; if((s.paymentMethod||'cash')==='cash') z.cashSalesTotal+=num(s.total); } });
  load('cashier_disbursements').forEach(function(d){ if(d.shiftId===sh.id&&d.status==='approved'&&d.source==='drawer') z.expensesTotal+=num(d.amount); });
  load('cashier_returns').forEach(function(r){ if(r.shiftId===sh.id&&r.source==='drawer') z.returnsTotal+=num(r.refundAmount); });
  var st=new Date(sh.startTime).getTime(), en=(sh.closed&&sh.endTime)?new Date(sh.endTime).getTime():Infinity;
  load('cashier_wallet_transactions').forEach(function(t){
    if(t.user!==sh.cashierName) return;
    var tm=new Date(t.date).getTime(); if(tm<st||tm>en) return;
    if(t.operation==='withdraw') z.walletCashTotal+=num(t.amount)+num(t.commission);
    else if(t.operation==='deposit') z.walletCashTotal-=num(t.amount);
  });
  z.expected=r2(num(sh.openingAmount)+z.cashSalesTotal-z.expensesTotal-z.returnsTotal+z.walletCashTotal);
  return z;
}
function pendingDeficitOf(name){
  return load('cashier_shifts').filter(function(s){return s.cashierName===name&&s.deficitStatus==='pending';}).reduce(function(a,s){return a+num(s.deficit);},0);
}
function openShift(){
  var v=$('openAmt').value; if(v===''||num(v)<0){ alert('اكتب مبلغ بداية الدرج'); return; }
  if(myShift()){ alert('عندك شيفت مفتوح بالفعل'); return; }
  var list=load('cashier_shifts');
  list.push({id:genId(),cashierName:CURRENT_USER.displayName,openingAmount:num(v),startTime:nowISO(),endTime:null,closingAmount:null,closed:false,expectedAmount:null,difference:null,deficit:0,deficitStatus:null,transferred:false});
  save('cashier_shifts',list); bannerState=''; renderShiftBanner();

function endShiftModal(){

  openModal('🔒 إنهاء الشيفت',
    '<div class="cards"><div class="stat">بداية الدرج<b>'+fmt(sh.openingAmount)+'</b></div><div class="stat">مبيعات نقدية<b>'+fmt(st.cashSalesTotal)+'</b></div><div class="stat red">مصروفات ومرتجعات<b>'+fmt(st.expensesTotal+st.returnsTotal)+'</b></div><div class="stat">المحافظ (كاش)<b>'+fmt(st.walletCashTotal)+'</b></div><div class="stat org">المتوقع بالدرج<b>'+fmt(st.expected)+'</b></div></div>'+
    '<label>المبلغ الفعلي الموجود في الدرج</label><input id="actualAmt" type="number" min="0" placeholder="عُد الفلوس واكتبها">'+
    '<p class="muted" style="font-size:12px">لو المبلغ مساوي أو أكتر من المتوقع بيتحول للخزنة تلقائي. لو فيه عجز مش هيتحول وبيتسجل في تاب "العجز" لحد ما المدير يعمل تسوية.</p>'+
    '<button class="big" onclick="confirmEndShift()">تأكيد إنهاء الشيفت</button>');
}
function confirmEndShift(){
  try{
    var sh=myShift(); if(!sh){ alert('مفيش شيفت مفتوح'); closeModal(); return; }
    var v=$('actualAmt').value; if(v===''||num(v)<0){ alert('اكتب المبلغ الفعلي'); return; }
    var actual=num(v), st=calcShiftStats(sh), diff=r2(actual-st.expected);
    var list=load('cashier_shifts');
    list.forEach(function(s){
      if(s.id===sh.id){
        s.closed=true; s.endTime=nowISO(); s.closingAmount=actual; s.expectedAmount=st.expected; s.difference=diff;
        if(diff<0){ s.deficit=-diff; s.deficitStatus='pending'; s.transferred=false; } else { s.deficit=0; s.deficitStatus=null; s.transferred=actual>0; }
      }
    });
    save('cashier_shifts',list); closeModal(); bannerState='';
    if(diff<0){
      alert('⚠️ تم إنهاء الشيفت.\nالمتوقع: '+fmt(st.expected)+'\nالفعلي: '+fmt(actual)+'\nالعجز: '+fmt(-diff)+' ج\nالمبلغ لم يتحول للخزنة، وهيتحول بعد تسوية العجز من المدير.');
      renderShiftBanner(); buildTabs();
    } else if(actual>0){
      adjustSafeBalance(actual,{type:'shift_close',description:'إقفال شيفت '+sh.cashierName,user:sh.cashierName})
      .then(function(nb){ alert('✅ تم إنهاء الشيفت'+(diff>0?' (زيادة '+fmt(diff)+' ج)':'')+'\nتم تحويل '+fmt(actual)+' ج للخزنة.\nرصيد الخزنة الآن: '+fmt(nb)+' ج'); })
      .catch(function(e){
        var l2=load('cashier_shifts'); l2.forEach(function(s){ if(s.id===sh.id) s.transferred=false; }); save('cashier_shifts',l2);
        alert('⚠️ تم إنهاء الشيفت لكن فشل التحويل للخزنة: '+e.message+'\nبلّغ المدير يضيف المبلغ يدوي.');
      });
      renderShiftBanner();
    } else { alert('تم إنهاء الشيفت'); renderShiftBanner(); }
  }catch(e){ console.error(e); alert('حصل خطأ: '+e.message); }
}

/* ---------- cashier ---------- */
function stockCls(p){ var s=num(p.stock),m=(p.minStock==null||p.minStock==='')?5:num(p.minStock); return s<=0?'out':(s<=m?'low':''); }
function renderCashier(){
  $('content').innerHTML='<div id="shiftBanner"></div><div class="split">'+
  '<div class="cartpanel card"><h3>🧾 الفاتورة</h3><div id="cartItems"></div>'+
  '<div class="row2"><div><label>خصم %</label><input id="discIn" type="number" min="0" value="0" oninput="renderCartTotals()"></div><div><label>ضريبة %</label><input id="taxIn" type="number" min="0" value="0" oninput="renderCartTotals()"></div></div>'+
  '<label>طريقة الدفع</label><select id="payIn"><option value="cash">نقدي</option><option value="vodafone">فودافون كاش</option><option value="instapay">انستاباي</option></select>'+
  '<div id="cartTotals" class="tot"></div><button class="big" id="checkoutBtn" onclick="processCheckout()">✅ إتمام البيع</button><button class="sec big" onclick="clearCart()">مسح الفاتورة</button></div>'+
  '<div class="prodpanel card"><div class="row"><input id="posSearch" placeholder="🔍 ابحث بالاسم أو الباركود" oninput="renderCashierGrid()" onkeydown="posSearchKey(event)"><button onclick="scanForCashier()">📷</button></div><div id="prodGrid" class="grid"></div></div></div>';
  bannerState=''; renderShiftBanner(); renderCart(); renderCashierGrid();
}
function renderCashierGrid(){
  var g=$('prodGrid'); if(!g) return;
  var q=($('posSearch').value||'').trim().toLowerCase();
  var ps=load('cashier_products').filter(function(p){ return !q||String(p.name||'').toLowerCase().indexOf(q)>-1||String(p.barcode||'').indexOf(q)>-1; });
  g.innerHTML=ps.map(function(p){ return '<div class="pc '+stockCls(p)+'" onclick="addToCart(\''+p.id+'\')"><b>'+esc(p.name)+'</b><div>'+fmt(p.price)+' ج</div><small>المخزون: '+num(p.stock)+'</small></div>'; }).join('')||'<p class="muted">لا توجد منتجات</p>';
}
function posSearchKey(e){
  if(e.key!=='Enter') return;
  var q=$('posSearch').value.trim(); if(!q) return;
  var p=load('cashier_products').find(function(x){return String(x.barcode)===q;});
  if(p){ addToCart(p.id); $('posSearch').value=''; renderCashierGrid(); }

function addToCart(id){
  if(!myShift()){ alert('لازم تفتح شيفت الأول'); return; }
  var p=load('cashier_products').find(function(x){return x.id===id;}); if(!p) return;
  var it=CART.find(function(x){return x.productId===id;});
  if(it) it.qty++; else CART.push({productId:id,name:p.name,price:num(p.price),costPrice:num(p.costPrice),qty:1});
  renderCart();
}
function chgQty(i,d){ CART[i].qty+=d; if(CART[i].qty<=0) CART.splice(i,1); renderCart(); }
function setQty(i,v){ var q=Math.floor(num(v)); if(q<=0) CART.splice(i,1); else CART[i].qty=q; renderCart(); }
function rmCart(i){ CART.splice(i,1); renderCart(); }
function clearCart(){ CART=[]; renderCart(); }
function renderCart(){
  var el=$('cartItems'); if(!el) return;
  el.innerHTML=CART.length?CART.map(function(it,i){
    return '<div class="cartrow"><div class="cn">'+esc(it.name)+'<small>'+fmt(it.price)+' ج</small></div><div class="qty"><button class="sm" onclick="chgQty('+i+',-1)">−</button><input type="number" value="'+it.qty+'" onchange="setQty('+i+',this.value)"><button class="sm" onclick="chgQty('+i+',1)">+</button></div><b>'+fmt(it.price*it.qty)+'</b><button class="sm red" onclick="rmCart('+i+')">✖</button></div>';
  }).join(''):'<p class="muted">الفاتورة فاضية</p>';
  renderCartTotals();
}
function computeCart(){
  var d=$('discIn')?num($('discIn').value):0, t=$('taxIn')?num($('taxIn').value):0;
  var sub=0,cost=0; CART.forEach(function(it){ sub+=it.price*it.qty; cost+=it.costPrice*it.qty; });
  var da=r2(sub*d/100), after=sub-da, ta=r2(after*t/100), total=r2(after+ta);
  return {sub:r2(sub),d:d,t:t,discountAmount:da,taxAmount:ta,total:total,profit:r2(sub-cost-da)};
}
function renderCartTotals(){
  var el=$('cartTotals'); if(!el) return; var c=computeCart();
  el.innerHTML='<div><span>المجموع</span><span>'+fmt(c.sub)+'</span></div><div><span>الخصم</span><span>- '+fmt(c.discountAmount)+'</span></div><div><span>الضريبة</span><span>+ '+fmt(c.taxAmount)+'</span></div><div class="g"><span>الإجمالي</span><span>'+fmt(c.total)+' ج</span></div>';
}
function processCheckout(){
  if(checkoutBusy) return;
  var sh=myShift(); if(!sh){ alert('لازم تفتح شيفت الأول'); return; }
  if(!CART.length){ alert('الفاتورة فاضية'); return; }
  var c=computeCart(), pay=$('payIn').value;
  checkoutBusy=true; $('checkoutBtn').disabled=true;
  nextCounter('invoice_counter',1001).then(function(n){
    var sale={id:genId(),invoiceNum:'INV-'+n,date:nowISO(),
      items:CART.map(function(i){return {productId:i.productId,name:i.name,price:i.price,costPrice:i.costPrice,qty:i.qty};}),
      subtotal:c.sub,discountPercent:c.d,taxPercent:c.t,total:c.total,soldBy:CURRENT_USER.displayName,paymentMethod:pay,shiftId:sh.id,profit:c.profit};
    var prods=load('cashier_products');
    CART.forEach(function(it){ prods.forEach(function(p){ if(p.id===it.productId) p.stock=num(p.stock)-it.qty; }); });
    save('cashier_products',prods);
    var sales=load('cashier_sales'); sales.push(sale); save('cashier_sales',sales);
    if(pay!=='cash') adjustWalletBalance(pay,sale.total,{operation:'sale',amount:sale.total,commission:0,note:sale.invoiceNum}).catch(function(e){ alert('تعذر تحديث رصيد المحفظة: '+e.message); });
    CART=[]; if($('discIn')) $('discIn').value=0; if($('taxIn')) $('taxIn').value=0;
    renderCart(); renderCashierGrid(); bannerState=''; renderShiftBanner(); showInvoice(sale);
  }).catch(function(e){ alert('تعذر إتمام البيع: '+e.message); })
  .then(function(){ checkoutBusy=false; var b=$('checkoutBtn'); if(b) b.disabled=false; });
}

function adjEntry(p,after,reason){
  var before=num(p.stock);
  return {id:genId(),productId:p.id,productName:p.name,qtyBefore:before,qtyAfter:after,difference:after-before,type:after>=before?'increase':'decrease',reason:reason,date:nowISO(),user:CURRENT_USER.displayName};

function pushAdjust(entries){ var l=load('cashier_stock_adjustments'); entries.forEach(function(e){ l.push(e); }); save('cashier_stock_adjustments',l); }
function renderReturns(){

function onRetChange(){
  var p=load('cashier_products').find(function(x){return x.id===$('retProd').value;}); if(!p) return;
  $('retRefund').value=r2(num(p.price)*num($('retQty').value));
}
function processReturn(){
  var prods=load('cashier_products'), p=prods.find(function(x){return x.id===$('retProd').value;});
  if(!p){ alert('اختر المنتج'); return; }
  var q=num($('retQty').value); if(q<=0){ alert('الكمية غير صحيحة'); return; }
  var refund=num($('retRefund').value), src=$('retSrc').value, res=$('retRes').value==='1', reason=$('retReason').value.trim()||'-';
  var sh=myShift(); if(src==='drawer'&&!sh){ alert('لازم شيفت مفتوح للصرف من الدرج'); return; }
  if(src==='safe'&&refund>safeBalance()){ alert('رصيد الخزنة غير كافٍ'); return; }
  var after=num(p.stock)+(res?q:-q), entry=adjEntry(p,after,res?'مرتجع قابل لإعادة البيع':'مرتجع تالف');
  prods.forEach(function(x){ if(x.id===p.id) x.stock=after; });
  save('cashier_products',prods); pushAdjust([entry]);
  if(!res){ var dm=load('cashier_damages'); dm.push({id:genId(),productId:p.id,productName:p.name,qty:q,lossValue:r2(num(p.costPrice)*q),reason:'مرتجع غير صالح: '+reason,processedBy:CURRENT_USER.displayName,date:nowISO()}); save('cashier_damages',dm); }
  var rl=load('cashier_returns'); rl.push({id:genId(),productId:p.id,productName:p.name,qty:q,price:num(p.price),costPrice:num(p.costPrice),refundAmount:refund,source:src,resalable:res,reason:reason,shiftId:sh?sh.id:null,processedBy:CURRENT_USER.displayName,date:nowISO()});
  save('cashier_returns',rl);
  if(src==='safe'&&refund>0) adjustSafeBalance(-refund,{type:'return',description:'مرتجع: '+p.name,user:CURRENT_USER.displayName}).catch(function(e){ alert('فشل خصم الخزنة: '+e.message); });
  renderReturns(); bannerState='';
}
function processDamage(){
  var prods=load('cashier_products'), p=prods.find(function(x){return x.id===$('dmProd').value;});
  if(!p){ alert('اختر المنتج'); return; }
  var q=num($('dmQty').value); if(q<=0){ alert('الكمية غير صحيحة'); return; }
  var reason=$('dmReason').value.trim()||'-', after=num(p.stock)-q, entry=adjEntry(p,after,'تالف: '+reason);
  prods.forEach(function(x){ if(x.id===p.id) x.stock=after; });
  save('cashier_products',prods); pushAdjust([entry]);
  var dm=load('cashier_damages'); dm.push({id:genId(),productId:p.id,productName:p.name,qty:q,lossValue:r2(num(p.costPrice)*q),reason:reason,processedBy:CURRENT_USER.displayName,date:nowISO()}); save('cashier_damages',dm);
  renderReturns();
}

function onWalletAmt(){
  var a=num($('wlAmt').value), op=$('wlOp').value;
  $('wlComm').textContent=(op==='withdraw'&&a>0)?('العمولة: '+commissionFor(a)+' ج — يدفع العميل: '+fmt(a+commissionFor(a))+' ج'):'';
}
function submitWalletOp(){
  var w=$('wlW').value, op=$('wlOp').value, a=num($('wlAmt').value);
  if(a<=0){ alert('اكتب المبلغ'); return; }
  if(!myShift()){ alert('لازم تفتح شيفت الأول'); return; }
  var comm=op==='withdraw'?commissionFor(a):0;
  if(op==='withdraw'&&num(load('cashier_wallets')[w])<a){ alert('رصيد المحفظة غير كافٍ'); return; }
  adjustWalletBalance(w,op==='withdraw'?-a:a,{operation:op,amount:a,commission:comm,note:''}).then(function(){ renderWallets(); bannerState=''; }).catch(function(e){ alert('فشل: '+e.message); });
}
function openWalletAdjust(w){
  if(!isAdmin()) return;
  openModal('تعديل رصيد '+(w==='vodafone'?'فودافون كاش':'انستاباي'),'<label>الرصيد الجديد</label><input id="wlNew" type="number" value="'+num(load('cashier_wallets')[w])+'"><button class="big" onclick="submitWalletAdjust(\''+w+'\')">حفظ</button>');
}
function submitWalletAdjust(w){
  var v=$('wlNew').value; if(v===''){ alert('اكتب الرصيد'); return; }
  var ws=load('cashier_wallets'), old=num(ws[w]), nv=num(v); ws[w]=nv; save('cashier_wallets',ws);
  var l=load('cashier_wallet_transactions'); l.push({id:genId(),wallet:w,operation:'adjust',amount:r2(nv-old),commission:0,date:nowISO(),user:CURRENT_USER.displayName,note:'من '+fmt(old)+' إلى '+fmt(nv)}); save('cashier_wallet_transactions',l);

function saveAdjust(id){

function applyCount(){
  var prods=load('cashier_products'), entries=[];
  Array.prototype.forEach.call(document.querySelectorAll('.cntIn'),function(inp){
    if(inp.value==='') return;
    var p=prods.find(function(x){return x.id===inp.getAttribute('data-id');}); if(!p) return;
    var after=num(inp.value); if(after===num(p.stock)) return;
    entries.push(adjEntry(p,after,'جرد دوري')); p.stock=after;
  });
  if(!entries.length){ alert('لا توجد فروق'); return; }
  save('cashier_products',prods); pushAdjust(entries); closeModal(); renderInventory(); alert('تم تسوية '+entries.length+' صنف');
}

/* ---------- profit ---------- */
function getProfitBreakdown(sales){
  var m={};
  sales.forEach(function(s){ s.items.forEach(function(it){
    var k=it.productId||it.name, o=m[k]||(m[k]={name:it.name,qty:0,revenue:0,cost:0,profit:0});
    o.qty+=it.qty; o.revenue+=it.price*it.qty; o.cost+=num(it.costPrice)*it.qty; o.profit=o.revenue-o.cost;
  }); });
  return Object.keys(m).map(function(k){return m[k];}).sort(function(a,b){return b.profit-a.profit;});
}
function monthlyFigures(){
  var sales=load('cashier_sales').filter(function(s){return sameMonth(s.date);});
  var gross=sum(sales,'profit');
  var disb=sum(load('cashier_disbursements').filter(function(d){return d.status==='approved'&&sameMonth(d.approvedDate||d.date);}),'amount');
  var dmg=sum(load('cashier_damages').filter(function(d){return sameMonth(d.date);}),'lossValue');
  var ret=load('cashier_returns').filter(function(r){return sameMonth(r.date);}).reduce(function(a,r){return a+(num(r.refundAmount)-num(r.costPrice)*num(r.qty));},0);
  var wo=load('cashier_shifts').filter(function(s){return s.deficitStatus==='settled'&&s.settlement&&s.settlement.method==='writeoff'&&sameMonth(s.settlement.date);}).reduce(function(a,s){return a+num(s.deficit);},0);
  return {sales:sales,gross:gross,disb:disb,dmg:dmg,ret:ret,wo:wo,net:r2(gross-disb-dmg-ret-wo)};
}
function renderProfit(){
  var ts=load('cashier_sales').filter(function(s){return sameDay(s.date);}), m=monthlyFigures();
  var bd=getProfitBreakdown(ts);
  $('content').innerHTML='<div class="cards"><div class="stat">ربح اليوم<b>'+fmt(sum(ts,'profit'))+'</b></div><div class="stat">إجمالي ربح الشهر<b>'+fmt(m.gross)+'</b></div><div class="stat red">مصروفات معتمدة (الشهر)<b>'+fmt(m.disb)+'</b></div><div class="stat red">خسارة التوالف<b>'+fmt(m.dmg)+'</b></div><div class="stat red">أثر المرتجعات<b>'+fmt(m.ret)+'</b></div><div class="stat red">عجز مشطوب<b>'+fmt(m.wo)+'</b></div><div class="stat org">صافي الشهر<b>'+fmt(m.net)+'</b></div></div>'+
  '<div class="card"><div class="row"><h3 style="flex:1">ربح اليوم لكل منتج</h3><button class="sec" onclick="exportProfitDaily()">📥 يومي</button><button class="sec" onclick="exportProfitMonthly()">📥 شهري</button></div><div class="tw"><table><tr><th>المنتج</th><th>الكمية</th><th>الإيراد</th><th>التكلفة</th><th>الربح</th></tr>'+bd.map(function(b){return '<tr><td>'+esc(b.name)+'</td><td>'+b.qty+'</td><td>'+fmt(b.revenue)+'</td><td>'+fmt(b.cost)+'</td><td><b>'+fmt(b.profit)+'</b></td></tr>';}).join('')+'</table></div></div>';
}

/* ---------- deficits ---------- */
function renderDeficits(){
  var all=load('cashier_shifts').filter(function(s){return s.closed&&num(s.deficit)>0;}).slice().reverse();
  var pend=all.filter(function(s){return s.deficitStatus==='pending';}), done=all.filter(function(s){return s.deficitStatus==='settled';});
  var by={}; pend.forEach(function(s){ by[s.cashierName]=(by[s.cashierName]||0)+num(s.deficit); });
  var h='<div class="cards"><div class="stat red">عدد شيفتات العجز المعلقة<b>'+pend.length+'</b></div><div class="stat red">إجمالي العجز المعلق<b>'+fmt(sum(pend,'deficit'))+' ج</b></div><div class="stat org">مبالغ محجوزة (لم تدخل الخزنة)<b>'+fmt(sum(pend,'closingAmount'))+' ج</b></div></div>';
  h+='<div class="card"><h3>العجز المعلق لكل كاشير</h3>'+(Object.keys(by).length?'<table><tr><th>الكاشير</th><th>إجمالي العجز</th></tr>'+Object.keys(by).map(function(k){return '<tr><td>'+esc(k)+'</td><td><b style="color:var(--red)">'+fmt(by[k])+' ج</b></td></tr>';}).join('')+'</table>':'<p class="muted">لا يوجد عجز معلق ✅</p>')+'</div>';
  h+='<div class="card" style="border:2px solid var(--red)"><div class="row"><h3 style="flex:1">⚠️ شيفتات عليها عجز (بانتظار التسوية)</h3><button class="sec" onclick="exportDeficitsExcel()">📥 Excel</button></div><div class="tw"><table><tr><th>الكاشير</th><th>تاريخ الإقفال</th><th>المتوقع</th><th>الفعلي (محجوز)</th><th>العجز</th><th></th></tr>'+pend.map(function(s){return '<tr><td>'+esc(s.cashierName)+'</td><td>'+fdate(s.endTime)+'</td><td>'+fmt(s.expectedAmount)+'</td><td>'+fmt(s.closingAmount)+'</td><td><b style="color:var(--red)">'+fmt(s.deficit)+'</b></td><td><button class="sm" onclick="openSettleDeficit(\''+s.id+'\')">⚖️ تسوية</button></td></tr>';}).join('')+'</table></div></div>';
  h+='<div class="card"><h3>✅ عجز تمت تسويته</h3><div class="tw"><table><tr><th>الكاشير</th><th>تاريخ الإقفال</th><th>العجز</th><th>طريقة التسوية</th><th>حُوّل للخزنة</th><th>تاريخ التسوية</th><th>ملاحظة</th></tr>'+done.map(function(s){var st=s.settlement||{};return '<tr><td>'+esc(s.cashierName)+'</td><td>'+fdate(s.endTime)+'</td><td>'+fmt(s.deficit)+'</td><td>'+esc(METHODS[st.method]||'-')+'</td><td>'+fmt(st.transferAmount)+'</td><td>'+fdate(st.date)+'</td><td>'+esc(st.note||'')+'</td></tr>';}).join('')+'</table></div></div>';
  $('content').innerHTML=h;
}
function openSettleDeficit(id){
  var s=load('cashier_shifts').find(function(x){return x.id===id;}); if(!s||s.deficitStatus!=='pending') return;
  openModal('⚖️ تسوية عجز — '+s.cashierName,
   '<div class="cards"><div class="stat">المتوقع<b>'+fmt(s.expectedAmount)+'</b></div><div class="stat">الفعلي المحجوز<b>'+fmt(s.closingAmount)+'</b></div><div class="stat red">العجز<b>'+fmt(s.deficit)+'</b></div></div>'+
   '<label>طريقة التسوية</label><select id="stMethod" onchange="updSettlePreview('+num(s.closingAmount)+','+num(s.deficit)+')"><option value="paid">'+METHODS.paid+'</option><option value="salary">'+METHODS.salary+'</option><option value="writeoff">'+METHODS.writeoff+'</option></select>'+
   '<label>ملاحظة</label><input id="stNote"><p>المبلغ اللي هيتحول للخزنة: <b id="stPrev"></b> ج</p>'+
   '<button class="big" onclick="confirmSettleDeficit(\''+id+'\')">تأكيد التسوية</button>');
  updSettlePreview(num(s.closingAmount),num(s.deficit));
}
function updSettlePreview(actual,deficit){ $('stPrev').textContent=fmt(actual+($('stMethod').value==='paid'?deficit:0)); }
function confirmSettleDeficit(id){
  if(settling) return;
  var sh=load('cashier_shifts').find(function(s){return s.id===id;});
  if(!sh||sh.deficitStatus!=='pending'){ alert('العجز ده اتسوّى قبل كده'); closeModal(); renderDeficits(); return; }
  var m=$('stMethod').value, note=$('stNote').value.trim(), amt=r2(num(sh.closingAmount)+(m==='paid'?num(sh.deficit):0));
  settling=true;
  var pr=amt>0?adjustSafeBalance(amt,{type:'shift_close',description:'تسوية عجز شيفت '+sh.cashierName+' ('+METHODS[m]+')',user:CURRENT_USER.displayName}):Promise.resolve(safeBalance());
  pr.then(function(nb){
    var l=load('cashier_shifts');
    l.forEach(function(s){ if(s.id===id){ s.deficitStatus='settled'; s.transferred=true; s.settlement={method:m,note:note,date:nowISO(),by:CURRENT_USER.displayName,transferAmount:amt}; } });
    save('cashier_shifts',l); closeModal(); renderDeficits(); buildTabs();
    alert('✅ تمت التسوية. تم تحويل '+fmt(amt)+' ج للخزنة.\nرصيد الخزنة الآن: '+fmt(nb)+' ج');
  }).catch(function(e){ alert('فشل التحويل للخزنة: '+e.message); })
  .then(function(){ settling=false; });
}
function exportDeficitsExcel(){
  xl('العجز','Deficits',load('cashier_shifts').filter(function(s){return s.closed&&num(s.deficit)>0;}).map(function(s){var st=s.settlement||{};return {'الكاشير':s.cashierName,'تاريخ الإقفال':fdate(s.endTime),'المتوقع':s.expectedAmount,'الفعلي':s.closingAmount,'العجز':s.deficit,'الحالة':s.deficitStatus==='pending'?'معلق':'تمت التسوية','طريقة التسوية':METHODS[st.method]||'','حُوّل للخزنة':st.transferAmount||0,'تاريخ التسوية':st.date?fdate(st.date):'','ملاحظة':st.note||''};}));
}

/* ---------- users ---------- */
function renderUsers(){
  var us=getUsers();
  $('content').innerHTML='<div class="card"><h3>👥 المستخدمين</h3><div class="tw"><table><tr><th>الاسم</th><th>الدور</th><th></th></tr>'+us.map(function(u){return '<tr><td>'+esc(u.displayName)+'</td><td>'+(u.role==='admin'?'مدير':'كاشير')+'</td><td><button class="sm sec" onclick="openPasswordModal(\''+u.id+'\')">🔑 كلمة المرور</button> '+(u.displayName===CURRENT_USER.displayName?'':'<button class="sm red" onclick="deleteUser(\''+u.id+'\')">🗑️ حذف</button>')+'</td></tr>';}).join('')+'</table></div></div>'+
  '<div class="card"><h3>➕ إضافة مستخدم</h3><div class="row2"><div><label>الاسم</label><input id="nuName"></div><div><label>كلمة المرور</label><input id="nuPass"></div></div><label>الدور</label><select id="nuRole"><option value="cashier">كاشير</option><option value="admin">مدير</option></select><button class="big" onclick="addUser()">إضافة</button></div>'+
  '<div class="danger-zone"><h3>⚠️ منطقة الخطر</h3><p>مسح كل البيانات (منتجات، مبيعات، خزنة، مستخدمين...) نهائياً.</p><button class="red" onclick="resetAllData()">🔄 إعادة ضبط كامل (تصفير كل البيانات)</button></div>';
}
function addUser(){
  var n=$('nuName').value.trim(), p=$('nuPass').value;
  if(!n||p.length<3){ alert('اكتب الاسم وكلمة مرور (3 حروف على الأقل)'); return; }
  var us=getUsers(); if(us.some(function(u){return String(u.displayName).toLowerCase()===n.toLowerCase();})){ alert('الاسم موجود'); return; }
  us.push({id:genId(),displayName:n,password:p,role:$('nuRole').value}); save('cashier_users',us); renderUsers();
}
function deleteUser(id){
  var us=getUsers(), u=us.find(function(x){return x.id===id;}); if(!u||u.displayName===CURRENT_USER.displayName) return;
  if(!confirm('حذف '+u.displayName+'؟')) return;
  save('cashier_users',us.filter(function(x){return x.id!==id;})); renderUsers();
}
function openPasswordModal(uid){
  if(!isAdmin()) return;
  var us=getUsers(), u=uid?us.find(function(x){return x.id===uid;}):CURRENT_USER; if(!u) return;
  openModal('🔑 تغيير كلمة مرور '+u.displayName,'<label>كلمة المرور الجديدة</label><input id="newPw" type="text"><button class="big" onclick="savePassword(\''+u.id+'\')">حفظ</button>');
}
function savePassword(uid){
  var p=$('newPw').value; if(p.length<3){ alert('3 حروف على الأقل'); return; }
  var us=getUsers(); us.forEach(function(u){ if(u.id===uid) u.password=p; }); save('cashier_users',us);
  if(CURRENT_USER.id===uid) CURRENT_USER.password=p;
  closeModal(); alert('تم تغيير كلمة المرور');
}
function resetAllData(){
  if(!isAdmin()) return;
  if(!confirm('⚠️ ده هيمسح كل البيانات نهائياً. متأكد؟')) return;
  if(!confirm('تأكيد أخير: مفيش رجعة بعد كده. تكمل؟')) return;
  CD.get().then(function(snap){
    var docs=snap.docs, chunks=[];
    for(var i=0;i<docs.length;i+=400) chunks.push(docs.slice(i,i+400));
    return Promise.all(chunks.map(function(ch){ var b=db.batch(); ch.forEach(function(d){ b.delete(d.ref); }); return b.commit(); }));
  }).then(function(){
    _dataCache={}; sessionStorage.removeItem('current_user'); alert('تم تصفير كل البيانات'); window.location.replace(window.location.pathname);
  }).catch(function(e){ alert('فشل: '+e.message); });
}
</script>
