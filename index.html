<style>
*{box-sizing:border-box}
body{margin:0;font-family:'Cairo',Arial,sans-serif;background:#f1f8f2;color:#1b3a1f}
:root{--g:#2e7d32;--g2:#43a047;--gl:#e8f5e9;--r:#c62828;--b:#1565c0;--o:#ef6c00}

.badge-build{background:rgba(255,255,255,.25);padding:2px 10px;border-radius:12px;font-size:12px}

.tabs .tab{text-align:right;width:100%}
.layout #content{flex:1;min-width:0;margin:0}
@media(max-width:860px){.layout{display:block}.tabs{flex-direction:row;width:auto;max-height:none;overflow-x:auto;overflow-y:hidden;border-left:none;border-bottom:2px solid var(--gl)}.tabs .tab{width:auto}}
.tab{border:none;background:var(--gl);color:var(--g);padding:9px 14px;border-radius:10px;cursor:pointer;font-family:inherit;font-weight:700;white-space:nowrap;font-size:14px}
.tab.active{background:var(--g);color:#fff}
.tab .cnt{background:var(--r);color:#fff;border-radius:10px;padding:0 7px;margin-right:4px;font-size:12px}

input,select,textarea{font-family:inherit;font-size:15px;padding:9px;border:1px solid #b9d8bb;border-radius:8px;background:#fff}
button{font-family:inherit}

.btn:hover{background:#1b5e20}
.btn-red{background:var(--r)}.btn-blue{background:var(--b)}.btn-gray{background:#757575}.btn-or{background:var(--o)}
.btn-sm{padding:4px 10px;font-size:12px}
.panel{background:#fff;border-radius:12px;padding:14px;margin-bottom:12px;box-shadow:0 1px 4px rgba(0,0,0,.08)}
.panel h2,.panel h3{margin:0 0 10px;color:var(--g)}
.center{text-align:center}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:12px}
.card{background:#fff;border-radius:12px;padding:12px;border-right:5px solid var(--g);box-shadow:0 1px 4px rgba(0,0,0,.08)}

.card.red{border-color:var(--r)}.card.red .v{color:var(--r)}

.card.blue{border-color:var(--b)}.card.blue .v{color:var(--b)}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;background:#fff;font-size:14px}
th{background:var(--g);color:#fff;padding:8px;white-space:nowrap}
td{padding:7px;border-bottom:1px solid #e0eee1;text-align:center}
tr:nth-child(even) td{background:#f7fbf7}
td.empty{color:#999;padding:20px}
.bd{display:inline-block;padding:2px 10px;border-radius:10px;font-size:12px;font-weight:700}
.bd.g{background:#c8e6c9;color:#1b5e20}.bd.r{background:#ffcdd2;color:#b71c1c}.bd.o{background:#ffe0b2;color:#e65100}.bd.b{background:#bbdefb;color:#0d47a1}.bd.n{background:#eee;color:#555}
.split{display:flex;gap:12px;align-items:flex-start}

.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;max-height:70vh;overflow-y:auto}
.pc{background:#fff;border:2px solid #c8e6c9;border-radius:10px;padding:8px;cursor:pointer;text-align:center}
.pc:hover{border-color:var(--g)}
.pc.low{background:#fff8e1;border-color:#ffb300}.pc.out{background:#ffebee;border-color:#e53935}
.pc .n{font-weight:700;font-size:14px}.pc .p{color:var(--g);font-weight:900}.pc .s{font-size:12px;color:#666}
tr.low td{background:#fff8e1!important}tr.out td{background:#ffebee!important}
.ci{display:flex;align-items:center;gap:6px;border-bottom:1px solid #e0eee1;padding:6px 0;font-size:14px}
.ci .nm{flex:1}.ci input{width:60px;text-align:center;padding:4px}
.qb{background:var(--gl);border:none;width:26px;height:26px;border-radius:50%;cursor:pointer;font-weight:900}
.tot{background:var(--gl);padding:10px;border-radius:8px;margin:8px 0;font-size:15px}
.tot .big{font-size:22px;font-weight:900;color:var(--g)}
.banner{background:linear-gradient(90deg,#1b5e20,#43a047);color:#fff;border-radius:12px;padding:10px 14px;margin-bottom:12px;display:flex;gap:16px;flex-wrap:wrap;align-items:center}
.banner b{font-size:18px}
#modalOverlay,#scanOverlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:1000;align-items:center;justify-content:center;padding:10px}
#scanOverlay{z-index:1200}
.modal{background:#fff;border-radius:14px;padding:16px;width:100%;max-width:480px;max-height:92vh;overflow-y:auto}
.modal.wide{max-width:860px}
.modal h3{margin:0 0 10px;color:var(--g);display:flex;justify-content:space-between;align-items:center}
.modal input,.modal select,.modal textarea{width:100%;margin:4px 0 8px}
.modal .row input,.modal .row select{width:auto;flex:1;min-width:110px}
.xbtn{background:none;border:none;font-size:22px;cursor:pointer;color:#888}
.invlink{color:var(--b);cursor:pointer;text-decoration:underline;font-weight:700}
.hint{font-size:13px;margin:-4px 0 8px}.hint.ok{color:#2e7d32}.hint.bad{color:#c62828}
.warnbox{background:#ffebee;border:2px solid #e53935;color:#b71c1c;border-radius:10px;padding:10px;margin-bottom:12px}
.danger-zone{border:2px dashed var(--r);border-radius:12px;padding:14px;margin-top:20px;background:#fff5f5}
label.lb{font-weight:700;font-size:14px}
.pc.bn{background:#e3f2fd;border-color:#1565c0}
</style>

 </div>

<div id="app">
 <div class="topbar">

<script>
var APP_BUILD = 27;
var firebaseConfig = {
  apiKey: "AIzaSyDIp3OlRAP0Wa7Ea1W87NZkYAwOe0xueSQ",
  authDomain: "casheir-840ee.firebaseapp.com",
  projectId: "casheir-840ee",
  storageBucket: "casheir-840ee.firebasestorage.app",
  messagingSenderId: "1078746217763",
  appId: "1:1078746217763:web:7f74831f502ca1b20be096"
};
var ROLE_PERMISSIONS = {
  admin: ['cashier','superpay','purchases','disbursements','suppliers','returns','wallets','live','inventory','products','bundles','movements','reports','profit','safe','deficits','employees','customers','users'],
  cashier: ['cashier','superpay','purchases','disbursements','returns','wallets','reports','customers']
};
var SYNC_KEYS = ['cashier_users','cashier_products','cashier_sales','cashier_purchases','cashier_suppliers','cashier_disbursements','cashier_shifts','cashier_stock_adjustments','cashier_counts','cashier_wallets','cashier_wallet_transactions','cashier_superpay','cashier_superpay_tx','cashier_sp_products','cashier_sp_sales','cashier_sp_settings','cashier_bundles','cashier_categories','cashier_supplier_payments','cashier_customers','cashier_customer_payments','cashier_emp_advances','cashier_supplier_debts','cashier_employees','cashier_emp_deductions','cashier_salary_payments','sp_counter','cashier_safe','cashier_safe_transactions','cashier_returns','cashier_damages','invoice_counter','purchase_counter','wallet_counter'];
var PAY = {cash:'نقدي',vodafone:'فودافون كاش',instapay:'انستاباي'};
var METHODS = {paid:'الكاشير سدد العجز',salary:'خصم من مستحقات الكاشير',writeoff:'شطب العجز (خسارة)'};
var TAB_DEFS = [
 {id:'cashier',icon:'💰',label:'الكاشير'},{id:'superpay',icon:'💳',label:'سوبر باي'},{id:'purchases',icon:'📥',label:'المشتريات'},{id:'suppliers',icon:'🏭',label:'حساب الموردين'},
 {id:'disbursements',icon:'💸',label:'المصروفات'},{id:'returns',icon:'↩️',label:'مرتجعات وتالف'},
 {id:'wallets',icon:'📲',label:'المحافظ'},{id:'live',icon:'📡',label:'متابعة مباشرة'},
 {id:'inventory',icon:'📦',label:'الجرد'},{id:'products',icon:'🛒',label:'المنتجات'},{id:'bundles',icon:'🎁',label:'التجميعات'},
 {id:'movements',icon:'🔁',label:'حركة الصنف'},
 {id:'reports',icon:'📊',label:'التقارير'},{id:'profit',icon:'📈',label:'الأرباح'},
 {id:'safe',icon:'🏦',label:'الخزنة'},{id:'deficits',icon:'⚠️',label:'العجز'},{id:'employees',icon:'🧑‍💼',label:'الموظفين'},{id:'customers',icon:'🧾',label:'آجل عملاء'},{id:'users',icon:'👥',label:'المستخدمين'}
];

/* ========== Firebase ========== */
firebase.initializeApp(firebaseConfig);
var db = firebase.firestore();
try{ db.enablePersistence({synchronizeTabs:true}).catch(function(){}); }catch(e){}
var COL = 'cashier_data';
var _dataCache = {};
var DATA_READY = false;
var CURRENT_USER = null;
var currentTab = 'cashier';

function defaultValueFor(k){
  if(k==='cashier_wallets') return {vodafone:0,instapay:0};
  if(k==='cashier_safe'||k==='cashier_superpay') return {balance:0};
  
  if(k==='invoice_counter'||k==='purchase_counter'||k==='wallet_counter'||k==='sp_counter') return 0;
  return [];
}
function load(k){ var v=_dataCache[k]; return (v===undefined||v===null)?defaultValueFor(k):v; }
function save(k,v){ if(k==='cashier_products')syncLoose(v); _dataCache[k]=v; return db.collection(COL).doc(k).set({v:v,updatedAt:Date.now()}); }
function genId(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,8); }

function nextCounter(key,start){
  var ref=db.collection(COL).doc(key);
  return db.runTransaction(function(t){
    return t.get(ref).then(function(s){
      var n; if(!s.exists||typeof s.data().v!=='number') n=start; else n=s.data().v+1;
      t.set(ref,{v:n,updatedAt:Date.now()}); return n;
    });
  }).then(function(n){ _dataCache[key]=n; return n; });
}
function adjustSafeBalance(delta,tx){
  var sRef=db.collection(COL).doc('cashier_safe'), tRef=db.collection(COL).doc('cashier_safe_transactions');
  var res={};
  return db.runTransaction(function(t){
    return Promise.all([t.get(sRef),t.get(tRef)]).then(function(r){
      var safe=r[0].exists?(r[0].data().v||{balance:0}):{balance:0};
      var txs=r[1].exists?(r[1].data().v||[]):[];
      var nb=Math.round((num(safe.balance)+delta)*100)/100;
      var rec=Object.assign({id:genId(),date:new Date().toISOString(),user:CURRENT_USER?CURRENT_USER.displayName:''},tx||{});
      rec.amount=delta; rec.balanceAfter=nb; txs=txs.concat([rec]);
      t.set(sRef,{v:{balance:nb},updatedAt:Date.now()});
      t.set(tRef,{v:txs,updatedAt:Date.now()});
      res={balance:nb,txs:txs};
    });
  }).then(function(){
    _dataCache['cashier_safe']={balance:res.balance}; _dataCache['cashier_safe_transactions']=res.txs;
    if(!modalOpen()&&currentTab==='safe')renderSafe();
    return res.balance;
  });
}
function adjustWalletBalance(wallet,delta,tx){
  var wRef=db.collection(COL).doc('cashier_wallets'), tRef=db.collection(COL).doc('cashier_wallet_transactions');
  var res={};
  return db.runTransaction(function(t){
    return Promise.all([t.get(wRef),t.get(tRef)]).then(function(r){
      var w=r[0].exists?(r[0].data().v||{vodafone:0,instapay:0}):{vodafone:0,instapay:0};
      var txs=r[1].exists?(r[1].data().v||[]):[];
      w[wallet]=Math.round((num(w[wallet])+delta)*100)/100;
      var rec=Object.assign({id:genId(),wallet:wallet,date:new Date().toISOString(),user:CURRENT_USER?CURRENT_USER.displayName:''},tx||{});
      txs=txs.concat([rec]);
      rec.balanceAfter=w[wallet]; t.set(wRef,{v:w,updatedAt:Date.now()}); t.set(tRef,{v:txs,updatedAt:Date.now()});
      res={w:w,txs:txs};
    });
  }).then(function(){
    _dataCache['cashier_wallets']=res.w; _dataCache['cashier_wallet_transactions']=res.txs;
    if(!modalOpen()&&currentTab==='wallets')renderWallets();
    return res.w;
  });
}

db.collection(COL).onSnapshot(function(snap){
  snap.docChanges().forEach(function(ch){
    if(ch.type==='removed') delete _dataCache[ch.doc.id];
    else { var d=ch.doc.data(); _dataCache[ch.doc.id]=d.v; }
  });
  if(_dataCache.cashier_products)syncLoose(_dataCache.cashier_products);
  if(!DATA_READY && (!snap.metadata.fromCache || snap.size>0)) dataReady();
  else if(DATA_READY) refreshCurrentView();
},function(err){ console.error(err); dataReady(); });
setTimeout(function(){ if(!DATA_READY) dataReady(); },15000);

function dataReady(){
  if(DATA_READY)return; DATA_READY=true;
  $('loading').style.display='none';
  var s=null; try{ s=JSON.parse(sessionStorage.getItem('current_user')||'null'); }catch(e){}
  if(s){
    var u=findUser(s.username||s.displayName);
    if(u){ CURRENT_USER=userView(u); enterApp(); return; }
  }
  $('login').style.display='flex';
}

/* ========== Helpers ========== */
function $(id){return document.getElementById(id);}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function num(v){var n=parseFloat(v);return isNaN(n)?0:n;}
function r2(n){return Math.round(num(n)*100)/100;}
function money(n){return r2(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})+' ج.م';}
function fdate(d){if(!d)return '-';var x=new Date(d);return x.toLocaleString('en-GB',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});}
function isToday(d){return new Date(d).toDateString()===new Date().toDateString();}
function monthKey(d){var x=new Date(d);return x.getFullYear()+'-'+('0'+(x.getMonth()+1)).slice(-2);}
function isAdmin(){return CURRENT_USER&&CURRENT_USER.role==='admin';}
function me(){return CURRENT_USER?CURRENT_USER.displayName:'';}
function card(l,v,c){return '<div class="card '+(c||'')+'"><div class="l">'+l+'</div><div class="v">'+v+'</div></div>';}
function tbl(h,rows){return '<div class="tw"><table><thead><tr>'+h.map(function(x){return '<th>'+x+'</th>';}).join('')+'</tr></thead><tbody>'+(rows.length?rows.join(''):'<tr><td colspan="'+h.length+'" class="empty">لا توجد بيانات</td></tr>')+'</tbody></table></div>';}
function bd(t,c){return '<span class="bd '+c+'">'+t+'</span>';}
function xl(filename,sheets){
  try{
    var wb=XLSX.utils.book_new();
    sheets.forEach(function(s){ var ws=XLSX.utils.json_to_sheet(s.rows.length?s.rows:[{'لا توجد بيانات':''}]); XLSX.utils.book_append_sheet(wb,ws,s.name.slice(0,31)); });
    wb.Workbook={Views:[{RTL:true}]};
    XLSX.writeFile(wb,filename);
  }catch(e){alert('تعذر التصدير: '+e.message);}
}
window.onerror=function(m){console.error(m);};

/* ========== Modal / Scanner ========== */
function focusCashSearch(){
  if(!CURRENT_USER||currentTab!=='cashier'||modalOpen())return;
  var s=$('cashSearch'); if(!s)return;
  var a=document.activeElement;
  if(a&&a!==s&&/INPUT|TEXTAREA|SELECT/.test(a.tagName))return;
  try{s.focus({preventScroll:true});}catch(e){s.focus();}
}
/* keep the cashier search box always ready (scanner / typing) */
document.addEventListener('click',function(){ setTimeout(focusCashSearch,0); },true);
document.addEventListener('keydown',function(e){
  if(e.ctrlKey||e.metaKey||e.altKey||e.key.length!==1)return;
  var a=document.activeElement;
  if(a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName))return;
  focusCashSearch();
},true);
setInterval(function(){ var a=document.activeElement; if(!a||a===document.body)focusCashSearch(); },1000);
function openModal(title,html,wide){ if(document.activeElement&&document.activeElement.blur)document.activeElement.blur(); $('modalBox').className=wide?'modal wide':'modal'; $('modalTitle').innerHTML=title; $('modalBody').innerHTML=html; $('modalOverlay').style.display='flex'; }
function closeModal(){ $('modalOverlay').style.display='none'; $('modalBody').innerHTML=''; setTimeout(focusCashSearch,0); }
function modalOpen(){ return $('modalOverlay').style.display==='flex'||$('scanOverlay').style.display==='flex'; }
var SCANNER=null;
function openScanner(cb){
  if(typeof Html5Qrcode==='undefined'){alert('مكتبة المسح لم تُحمّل');return;}
  $('scanOverlay').style.display='flex';
  SCANNER=new Html5Qrcode('qrReader'); var done=false;
  SCANNER.start({facingMode:'environment'},{fps:10,qrbox:{width:250,height:150}},function(text){
    if(done)return; done=true; stopScanner(function(){cb(text);});
  },function(){}).catch(function(){ alert('تعذر تشغيل الكاميرا — تأكد من الصلاحية وأن الموقع HTTPS'); stopScanner(); });
}
function stopScanner(cb){
  var s=SCANNER; SCANNER=null;
  function fin(){ $('scanOverlay').style.display='none'; $('qrReader').innerHTML=''; if(cb)cb(); setTimeout(focusCashSearch,0); }
  if(s){ s.stop().then(function(){try{s.clear();}catch(e){} fin();}).catch(fin); } else fin();
}
function scanIntoField(fid){
  openScanner(function(code){
    $(fid).value=normBC(code);
    if(fid==='prodBarcode')onProdBarcodeInput(); else if(fid==='purBarcode')onPurBarcodeChange();
  });
}

/* ========== Users / Login ========== */
function defaultUsers(){return [
  {id:'u_admin',username:'MOHAMED NAZIH',displayName:'MOHAMED NAZIH',password:'admin123',role:'admin'},
  {id:'u_cash',username:'ABDALLAH',displayName:'ABDALLAH',password:'cashier123',role:'cashier'}];}
function getUsers(){var u=load('cashier_users');return (u&&u.length)?u:defaultUsers();}
function uName(u){return u.displayName||u.username||u.name||'';}
function findUser(name){
  var n=String(name||'').trim().toLowerCase();
  return getUsers().filter(function(u){return String(u.username||'').trim().toLowerCase()===n||uName(u).trim().toLowerCase()===n;})[0]||null;
}

function normBC(b){return String(b==null?'':b).trim();}
function findByBarcode(code,excludeId,list){

  list=list||load('cashier_products');

function duplicateBarcodes(){

/* ========== Shift ========== */
function getOpenShift(){ return load('cashier_shifts').filter(function(s){return s.cashierName===me()&&!s.closed;})[0]||null; }
function calcShiftStats(sh){
  var r={cashSalesTotal:0,walletCashTotal:0,expensesTotal:0,returnsTotal:0,expected:0,salesCount:0,otherIn:0,nonCash:{}};
  if(!sh)return r;
  try{
    load('cashier_sales').forEach(function(s){ if(s.shiftId===sh.id){r.salesCount++; if(!s.paymentMethod||s.paymentMethod==='cash')r.cashSalesTotal+=num(s.total); else r.nonCash[s.paymentMethod]=(r.nonCash[s.paymentMethod]||0)+num(s.total);} });
    load('cashier_sp_sales').forEach(function(s){ if(s.shiftId===sh.id&&s.paymentMethod==='cash'){r.salesCount++; r.cashSalesTotal+=num(s.total);} });
    load('cashier_customer_payments').forEach(function(x){ if(x.shiftId===sh.id&&x.dest==='drawer')r.otherIn+=num(x.amount); });
    load('cashier_emp_advances').forEach(function(x){ if(x.type==='repay'&&x.method==='drawer'&&x.shiftId===sh.id)r.otherIn+=num(x.amount); });
    var st=new Date(sh.startTime).getTime(), en=sh.endTime?new Date(sh.endTime).getTime():Infinity;
    load('cashier_wallet_transactions').forEach(function(t){
      if(t.user!==sh.cashierName)return; var tt=new Date(t.date).getTime(); if(tt<st||tt>en)return;
      if(t.operation==='withdraw')r.walletCashTotal+=num(t.amount)+num(t.commission);
      else if(t.operation==='deposit'){ r.walletCashTotal-=num(t.amount); r.walletCashTotal+=num(t.commission); }
    });
    load('cashier_disbursements').forEach(function(d){ if(d.shiftId===sh.id&&d.status==='approved'&&d.source==='drawer')r.expensesTotal+=num(d.amount); });
    load('cashier_returns').forEach(function(x){ if(x.shiftId===sh.id&&x.source==='drawer')r.returnsTotal+=num(x.refundAmount); });
  }catch(e){}
  r.expected=r2(num(sh.openingAmount)+r.cashSalesTotal-r.expensesTotal-r.returnsTotal+r.walletCashTotal+r.otherIn);
  return r;
}
function pendingDeficitOf(name){
  return r2(load('cashier_shifts').filter(function(s){return s.cashierName===name&&s.deficitStatus==='pending';}).reduce(function(a,s){return a+num(s.deficit);},0));
}

  var l=load('cashier_shifts');

}

}
var ENDING=false;
function confirmEndShift(){
  var sh=getOpenShift(); if(!sh){closeModal();return;}
  var raw=$('actualCash').value; if(raw===''){alert('اكتب المبلغ الفعلي');return;}
  if(ENDING)return; ENDING=true;
  var actual=r2(raw), st=calcShiftStats(sh), diff=r2(actual-st.expected), id=sh.id;
  var list=load('cashier_shifts'); var s=list.filter(function(x){return x.id===id;})[0];
  s.closed=true; s.endTime=new Date().toISOString(); s.closingAmount=actual; s.expectedAmount=st.expected; s.difference=diff;
  if(diff<-0.004){
    s.deficit=-diff; s.deficitStatus='pending'; s.transferred=false;
    save('cashier_shifts',list); closeModal(); ENDING=false;
    alert('⚠️ تم إنهاء الشيفت مع عجز\nالمتوقع: '+money(st.expected)+'\nالفعلي: '+money(actual)+'\nالعجز: '+money(-diff)+'\nلم يتم تحويل المبلغ للخزنة حتى تسوية العجز من المدير.');
    renderTab('cashier'); return;
  }
  s.deficit=0; s.deficitStatus=null; s.transferred=false;
  save('cashier_shifts',list); closeModal();
  if(actual>0){
    adjustSafeBalance(actual,{type:'shift_close',description:'تحويل شيفت '+me()}).then(function(nb){
      var l2=load('cashier_shifts'); l2.forEach(function(x){if(x.id===id)x.transferred=true;}); save('cashier_shifts',l2);
      ENDING=false; alert('✅ تم إنهاء الشيفت وتحويل '+money(actual)+' للخزنة'+(isAdmin()?'\nرصيد الخزنة الآن: '+money(nb):'')); renderTab('cashier');
    }).catch(function(e){ ENDING=false; alert('❌ تم إغلاق الشيفت لكن فشل التحويل للخزنة: '+e.message); renderTab('cashier'); });
  } else { ENDING=false; alert('تم إنهاء الشيفت'); renderTab('cashier'); }
}

function inventoryValue(){
  var r={units:0,cost:0,sale:0,neg:0,count:0};
  load('cashier_products').forEach(function(p){
    var s=num(p.stock); r.count++;
    if(s<0){r.neg++;return;}
    r.units+=s; r.cost+=s*num(p.costPrice); r.sale+=s*num(p.price);
  });
  r.cost=r2(r.cost); r.sale=r2(r.sale); r.units=r2(r.units);
  return r;
}

function countDiffHtml(p,v){

  if(Math.abs(d)<0.0001)return bd('مطابق','g');

  }))+

  openModal('🔍 جرد دوري جديد',html,true);

function onCountIn(id,v){
  if(v==='')delete COUNT.entries[id]; else COUNT.entries[id]=v;
  var p=load('cashier_products').filter(function(x){return x.id===id;})[0];
  var c=$('cd_'+id); if(p&&c)c.innerHTML=countDiffHtml(p,COUNT.entries[id]);
  updateCountProg();

function updateCountProg(){
  var el=$('cntProg'); if(!el)return;
  var total=load('cashier_products').length, n=Object.keys(COUNT.entries).length;
  el.innerHTML='تم جرد <b>'+n+'</b> من <b>'+total+'</b> منتج — متبقي <b style="color:#c62828">'+(total-n)+'</b>';
}
function filterCountRows(){
  var q=(COUNT.q||'').trim().toLowerCase();
  document.querySelectorAll('.cntRow').forEach(function(r){r.style.display=(!q||r.getAttribute('data-s').indexOf(q)>=0)?'':'none';});
}
function computeCount(){
  var prods=load('cashier_products').filter(function(p){return !p.looseOf;}), items=[], unc=[], same=0;
  prods.forEach(function(p){
    var v=COUNT.entries[p.id];
    if(v===undefined){unc.push({productId:p.id,name:p.name,stock:num(p.stock),costPrice:num(p.costPrice),barcode:p.barcode||''});return;}
    var b=num(p.stock), a=num(v), d=r2(a-b);
    if(Math.abs(d)<0.0001){same++;return;}
    items.push({productId:p.id,name:p.name,before:b,after:a,diff:d,costPrice:num(p.costPrice),value:r2(d*num(p.costPrice))});
  });
  var inc=0,dec=0; items.forEach(function(i){ if(i.diff>0)inc+=i.value; else dec+=-i.value; });
  return {items:items,unc:unc,same:same,total:prods.length,counted:prods.length-unc.length,inc:r2(inc),dec:r2(dec),net:r2(inc-dec)};
}
function finalizeCount(){
  if(COUNT_BUSY)return;
  var r=computeCount();
  if(!r.counted){alert('لم تجرد أي منتج بعد');return;}
  if(r.unc.length){ var ack=$('cntAck'); if(!ack||!ack.checked){alert('لازم تأكد إنك راجعت الأصناف غير المجرودة قبل إقفال الجرد');return;} }
  var cf=$('cntConfirm'); if(!cf||!cf.checked){alert('لازم تأكد فروقات الجرد (العجز والزيادة) قبل إقفال الجرد');return;}
  COUNT_BUSY=true;
  var prods=load('cashier_products'), now=new Date().toISOString(), reason=(COUNT.reason||'').trim()||'جرد دوري', adj=load('cashier_stock_adjustments');
  r.items.forEach(function(i){
    prods.forEach(function(p){ if(p.id===i.productId)p.stock=i.after; });
    adj.push({id:genId(),productId:i.productId,productName:i.name,qtyBefore:i.before,qtyAfter:i.after,difference:i.diff,type:i.diff>0?'increase':'decrease',reason:reason+' (جرد)',date:now,user:me()});
  });
  var cs=load('cashier_counts');
  cs.push({id:genId(),date:now,user:me(),reason:reason,total:r.total,counted:r.counted,same:r.same,items:r.items,uncounted:r.unc.map(function(u){return {productId:u.productId,name:u.name,stock:u.stock};}),incValue:r.inc,decValue:r.dec,netValue:r.net});
  save('cashier_products',prods); save('cashier_stock_adjustments',adj); save('cashier_counts',cs);
  COUNT_BUSY=false; COUNT={entries:{},reason:'جرد دوري',q:''};
  closeModal(); alert('✅ تم إقفال الجرد\nتم جرد '+r.counted+' من '+r.total+'\nأصناف بها فروق: '+r.items.length+'\nلم يُجرد: '+r.unc.length+'\nصافي الفروق: '+money(r.net));
  renderInventory();
}

/* ========== Profit ========== */
function monthlyFigures(){
  var mk=monthKey(new Date()), inM=function(d){return monthKey(d)===mk;};
  var sales=load('cashier_sales').filter(function(s){return inM(s.date);});
  var sum=function(a,f){return a.reduce(function(x,y){return x+num(f(y));},0);};
  var gross=sum(sales,function(s){return s.profit;});
  var disb=sum(load('cashier_disbursements').filter(function(d){return d.status==='approved'&&d.category!=='purchase'&&d.category!=='installment'&&d.category!=='supplier'&&d.category!=='advance'&&inM(d.approvedDate||d.date);}),function(d){return d.amount;});
  var dmg=sum(load('cashier_damages').filter(function(d){return inM(d.date);}),function(d){return d.lossValue;});
  var ret=sum(load('cashier_returns').filter(function(d){return inM(d.date);}),function(x){return num(x.refundAmount)-num(x.costPrice)*num(x.qty);});
  var wo=sum(load('cashier_shifts').filter(function(s){return s.deficitStatus==='settled'&&s.settlement&&s.settlement.method==='writeoff'&&inM(s.settlement.date);}),function(s){return s.deficit;});
  var sp=spProfitMonthSum();
  return {sales:sum(sales,function(s){return s.total;}),gross:r2(gross),sp:sp,disb:r2(disb),dmg:r2(dmg),ret:r2(ret),wo:r2(wo),net:r2(gross+sp-disb-dmg-ret-wo)};
}
function getProfitBreakdown(daily){
  var mk=monthKey(new Date()), m={};
  load('cashier_sales').forEach(function(s){
    if(daily?!isToday(s.date):monthKey(s.date)!==mk)return;
    s.items.forEach(function(i){var k=i.productId||i.name; var o=m[k]=m[k]||{name:i.name,qty:0,rev:0,cost:0}; o.qty+=num(i.qty);o.rev+=num(i.price)*num(i.qty);o.cost+=num(i.costPrice)*num(i.qty);});
  });
  return Object.keys(m).map(function(k){var o=m[k];return {name:o.name,qty:o.qty,rev:r2(o.rev),cost:r2(o.cost),profit:r2(o.rev-o.cost)};}).sort(function(a,b){return b.profit-a.profit;});
}

function confirmSettleDeficit(id){
  if(!isAdmin()||settling)return;
  var s=load('cashier_shifts').filter(function(x){return x.id===id;})[0]; if(!s||s.deficitStatus!=='pending')return;

function spAdjust(delta,tx){
  var bRef=db.collection(COL).doc('cashier_superpay'), tRef=db.collection(COL).doc('cashier_superpay_tx');
  var res={};
  return db.runTransaction(function(t){
    return Promise.all([t.get(bRef),t.get(tRef)]).then(function(r){
      var sp=r[0].exists?(r[0].data().v||{balance:0}):{balance:0};
      var txs=r[1].exists?(r[1].data().v||[]):[];
      var nb=Math.round((num(sp.balance)+delta)*100)/100;
      var rec=Object.assign({id:genId(),date:new Date().toISOString(),user:me()},tx||{});
      rec.amount=delta; rec.balanceAfter=nb; txs=txs.concat([rec]);
      t.set(bRef,{v:{balance:nb},updatedAt:Date.now()});
      t.set(tRef,{v:txs,updatedAt:Date.now()});
      res={balance:nb,txs:txs};
    });
  }).then(function(){
    _dataCache['cashier_superpay']={balance:res.balance}; _dataCache['cashier_superpay_tx']=res.txs;
    return res.balance;
  });
}
function moveFunds(from,to,amt,note){
  amt=r2(amt);
  var dn=note?' - '+note:'';
  function debit(){
    var d='تحويل إلى '+ENDPOINTS[to]+dn;
    if(from==='safe')return adjustSafeBalance(-amt,{type:'transfer',description:d});
    if(from==='superpay')return spAdjust(-amt,{type:'transfer_out',description:d});
    return adjustWalletBalance(from,-amt,{operation:'transfer_out',amount:amt,commission:0,note:d});
  }
  function credit(){
    var d='تحويل من '+ENDPOINTS[from]+dn;
    if(to==='safe')return adjustSafeBalance(amt,{type:'transfer',description:d});
    if(to==='superpay')return spAdjust(amt,{type:'transfer_in',description:d});
    return adjustWalletBalance(to,amt,{operation:'transfer_in',amount:amt,commission:0,note:d});
  }
  return debit().then(credit);
}

      if(p){
        if(touched[p.id]){out.skip.push('سطر '+line+' ('+nm+'): المنتج مكرر داخل الملف');return;}
        touched[p.id]=1; if(bc&&!normBC(p.barcode))f.barcode=bc;
        out.upd.push({id:p.id,name:p.name,fields:f});
      } else {
        out.add.push({name:nm,barcode:bc,costPrice:f.costPrice||0,price:f.price||0,stock:f.stock||0,minStock:f.minStock!==undefined?f.minStock:5,category:f.category||''});
      }
    });

      (out.skip.length?'<div class="warnbox" style="max-height:140px;overflow:auto">'+out.skip.map(esc).join('<br>')+'</div>':'')+
      ((out.add.length||out.upd.length)?'<button class="btn" onclick="applyProductsImport()">✅ تنفيذ الاستيراد</button>':'');
  });
}
function applyProductsImport(){

    if(x.fields.stock!==undefined&&x.fields.stock!==before)adj.push({id:genId(),productId:p.id,productName:p.name,qtyBefore:before,qtyAfter:x.fields.stock,difference:x.fields.stock-before,type:x.fields.stock>=before?'increase':'decrease',reason:'استيراد من Excel',date:now,user:u});
  });
  PIMP.add.forEach(function(a){
    var np={id:genId(),name:a.name,category:a.category||'',barcode:a.barcode&&!findByBarcode(a.barcode,null,prods)?a.barcode:'',costPrice:a.costPrice,price:a.price,stock:a.stock,minStock:a.minStock,dateAdded:now};
    prods.push(np);

  });

  var n=PIMP.add.length+PIMP.upd.length; PIMP=null; closeModal(); alert('✅ تم استيراد '+n+' منتج'); renderProducts();
}

/* ---------- product bundles ---------- */
var BUN={id:null,name:'',barcode:'',items:[]};
function prodById(id){return load('cashier_products').filter(function(x){return x.id===id;})[0]||null;}
function bundlePrice(b){return r2((b.items||[]).reduce(function(a,c){var p=prodById(c.productId);return a+(p?num(p.price)*num(c.qty):0);},0));}
function bundleCost(b){return r2((b.items||[]).reduce(function(a,c){var p=prodById(c.productId);return a+(p?num(p.costPrice)*num(c.qty):0);},0));}
function bundleAvail(b){
  var m=Infinity; (b.items||[]).forEach(function(c){var p=prodById(c.productId); var n=p?Math.floor(num(p.stock)/Math.max(1,num(c.qty))):0; if(n<m)m=n;});
  return m===Infinity?0:m;
}
function findBundleByBarcode(code,excludeId){
  code=normBC(code); if(!code)return null;
  return load('cashier_bundles').filter(function(b){return normBC(b.barcode)===code&&b.id!==excludeId;})[0]||null;
}

function saveBundle(){

function renderProductGrid(){
  var q=CASH_SEARCH.trim().toLowerCase();

  var bl=load('cashier_bundles').filter(function(b){return !CASH_CAT&&(!q||String(b.name).toLowerCase().indexOf(q)>=0||normBC(b.barcode).indexOf(q)>=0);});

function addBundleToCart(id){
  var b=load('cashier_bundles').filter(function(x){return x.id===id;})[0]; if(!b)return;
  if(b.items.some(function(c){return !prodById(c.productId);})){alert('بعض مكونات التجميعة اتحذفت من المنتجات');return;}
  var it=CART.filter(function(x){return x.bundleId===id;})[0];
  if(it)it.qty++;
  else CART.push({productId:null,bundleId:id,name:'🎁 '+b.name,price:bundlePrice(b),costPrice:bundleCost(b),qty:1,components:b.items.map(function(c){var p=prodById(c.productId);return {productId:c.productId,name:p.name,qty:num(c.qty),price:num(p.price),costPrice:num(p.costPrice)};})});
  renderCart();
}
function processCheckout(){
  if(checkoutBusy)return;
  var sh=getOpenShift(); if(!sh){alert('افتح شيفت أولاً');return renderCashier();}
  if(!CART.length){alert('الفاتورة فارغة');return;}
  checkoutBusy=true;
  var t=calcTotals(), items=CART.map(function(i){
    var o={productId:i.productId,name:i.name,price:i.price,costPrice:i.costPrice,qty:num(i.qty)};
    if(i.bundleId){o.bundleId=i.bundleId;o.components=i.components;}
    return o;
  });
  var profit=r2(items.reduce(function(a,i){return a+(i.price-i.costPrice)*i.qty;},0)-t.discountAmount);
  var pm=PAYM, custId=CUST_SEL, cust=null;
  if(pm==='credit'){ cust=load('cashier_customers').filter(function(c){return c.id===custId;})[0]; if(!cust){alert('اختر العميل للبيع الآجل');checkoutBusy=false;return;} }
  nextCounter('invoice_counter',1001).then(function(n){
    var sale={id:genId(),invoiceNum:'INV-'+n,date:new Date().toISOString(),items:items,subtotal:t.subtotal,discountPercent:DISC,taxPercent:TAX,total:t.total,soldBy:me(),paymentMethod:pm,shiftId:sh.id,profit:profit};
    if(cust){sale.customerId=cust.id;sale.customerName=cust.name;}
    var prods=load('cashier_products');
    items.forEach(function(i){
      if(i.components){ i.components.forEach(function(c){ deductStock(prods,c.productId,num(c.qty)*i.qty); }); }
      else deductStock(prods,i.productId,i.qty);
    });
    save('cashier_products',prods);
    var sales=load('cashier_sales'); sales.push(sale); save('cashier_sales',sales);
    var p=(pm!=='cash'&&pm!=='credit')?adjustWalletBalance(pm,t.total,{operation:'sale',amount:t.total,commission:0,note:sale.invoiceNum}):Promise.resolve();
    return p.then(function(){return sale;});
  }).then(function(sale){
    CART=[];DISC=0;TAX=0;PAYM='cash';CUST_SEL=''; checkoutBusy=false; renderCashier(); showInvoice(sale);
  }).catch(function(e){ checkoutBusy=false; alert('حدث خطأ أثناء البيع: '+e.message); });
}

/* ---------- item movement ---------- */
var MV_Q='', MV_TYPE='';
function buildMovements(){
  var byId={}; load('cashier_products').forEach(function(p){byId[p.id]=p;});
  var out=[];
  function bc(id){var p=byId[id]; return p?normBC(p.barcode):'';}
  load('cashier_sales').forEach(function(s){
    (s.items||[]).forEach(function(i){
      var ref={k:'sale',id:s.id,n:s.invoiceNum||s.id};
      if(i.components){ i.components.forEach(function(c){ out.push({date:s.date,name:c.name,barcode:bc(c.productId),type:'بيع',qty:-num(c.qty)*num(i.qty),ref:ref,user:s.soldBy,note:'ضمن تجميعة: '+i.name}); }); }
      else out.push({date:s.date,name:i.name,barcode:bc(i.productId),type:'بيع',qty:-num(i.qty),ref:ref,user:s.soldBy,note:''});
    });
  });
  load('cashier_purchases').forEach(function(p){
    if(p.status!=='approved')return;
    (p.items||[]).forEach(function(i){ out.push({date:p.approvedDate||p.date,name:i.name,barcode:normBC(i.barcode)||bc(i.productId),type:'شراء',qty:num(i.qty),ref:{k:'pur',id:p.id,n:p.purchaseNum||p.id},user:p.requestedBy,note:'المورد: '+p.supplierName}); });

/* ---------- supplier account: free-amount payment ---------- */
function instPaid(i){ return i.paid?num(i.amount):num(i.paidAmount); }
function supplierStats(sup){
  var ps=load('cashier_purchases').filter(function(p){return p.supplierId===sup.id&&p.status==='approved';});
  var total=0,paid=0;
  ps.forEach(function(p){
    total+=num(p.total);
    if(p.installments){ p.installments.forEach(function(i){ paid+=instPaid(i); }); }
    else if(p.paid)paid+=num(p.total);
  });
  var debts=load('cashier_supplier_debts').filter(function(x){return x.supplierId===sup.id;}).reduce(function(a,x){return a+num(x.amount);},0);
  total+=debts;
  var adv=load('cashier_supplier_payments').filter(function(x){return x.supplierId===sup.id;}).reduce(function(a,x){return a+num(x.advance);},0);
  paid+=adv;
  var pend=load('cashier_purchases').filter(function(p){return p.supplierId===sup.id&&p.status==='pending';}).reduce(function(a,p){return a+num(p.total);},0);
  return {purchases:ps,count:ps.length,total:r2(total),paid:r2(paid),due:r2(total-paid),pending:r2(pend),advance:r2(adv),debts:r2(debts)};
}
function allocateSupplierPayment(d){
  var left=num(d.amount), ps=load('cashier_purchases');
  ps.filter(function(p){return p.supplierId===d.supplierId&&p.status==='approved'&&p.installments;}).sort(function(a,b){return new Date(a.date)-new Date(b.date);}).forEach(function(p){
    p.installments.forEach(function(i){
      if(left<=0||i.paid)return;
      var rem=r2(num(i.amount)-num(i.paidAmount)); if(rem<=0)return;
      var x=Math.min(rem,left); i.paidAmount=r2(num(i.paidAmount)+x); left=r2(left-x);
      if(i.paidAmount>=num(i.amount)-0.001)i.paid=true;
    });
  });
  save('cashier_purchases',ps);
  var l=load('cashier_supplier_payments');
  l.push({id:genId(),supplierId:d.supplierId,supplierName:d.supplierName||'',amount:num(d.amount),advance:left,allocated:r2(num(d.amount)-left),source:d.source,note:d.note||'',date:new Date().toISOString(),by:d.requestedBy,disbId:d.id});
  save('cashier_supplier_payments',l);
}
function openSupplierPay(id){
  var s=load('cashier_suppliers').filter(function(x){return x.id===id;})[0]; if(!s)return;
  var st=supplierStats(s);
  openModal('💵 سداد للمورد: '+esc(s.name),'<div class="tot">المتبقي على المورد: <b>'+money(st.due)+'</b></div><label class="lb">المبلغ المدفوع</label><input type="number" id="spyAmt" step="0.01" min="0" value="'+(st.due>0?st.due:'')+'"><label class="lb">مصدر الدفع</label><select id="spySrc">'+srcOptions('safe')+'</select><label class="lb">ملاحظة (اختياري)</label><input id="spyNote"><small>الدفعة بتتوزع تلقائياً على أقدم الأقساط غير المسددة، وأي زيادة بتتسجل كدفعة مقدمة للمورد. '+(isAdmin()?'':'(محتاجة اعتماد المدير)')+'</small><br><button class="btn" onclick="confirmSupplierPay(\''+id+'\')">تأكيد السداد</button>');

/* ---------- receive funds helper ---------- */
var RECV={drawer:'الدرج',safe:'الخزنة',vodafone:'فودافون كاش',instapay:'انستاباي'};
function recvOptions(){ return Object.keys(RECV).map(function(k){return '<option value="'+k+'">إلى '+RECV[k]+'</option>';}).join(''); }
function receiveFunds(dest,amount,desc){
  amount=num(amount);
  if(dest==='safe')return adjustSafeBalance(amount,{type:'deposit',description:desc});
  if(dest==='vodafone'||dest==='instapay')return adjustWalletBalance(dest,amount,{operation:'income',amount:amount,commission:0,note:desc});
  return Promise.resolve();
}

/* ---------- customers (آجل عملاء) ---------- */
function custStats(c){
  var sales=load('cashier_sales').filter(function(s){return s.customerId===c.id;});
  var pays=load('cashier_customer_payments').filter(function(x){return x.customerId===c.id;});
  var st=r2(sales.reduce(function(a,s){return a+num(s.total);},0)), pt=r2(pays.reduce(function(a,x){return a+num(x.amount);},0)), op=num(c.openingBalance);
  return {sales:sales,pays:pays,salesTotal:st,paid:pt,opening:op,due:r2(op+st-pt)};
}
function renderCustomers(){
  var cs=load('cashier_customers'), rows=cs.map(function(c){return {c:c,s:custStats(c)};});
  var due=rows.reduce(function(a,r){return a+r.s.due;},0);
  $('content').innerHTML='<div class="cards">'+card('إجمالي المستحق على العملاء',money(due),due>0?'red':'')+card('عدد العملاء',cs.length)+card('عملاء عليهم مديونية',rows.filter(function(r){return r.s.due>0;}).length,'or')+'</div>'+
  '<div class="panel"><div class="row"><h3 style="margin:0;flex:1">🧾 آجل عملاء</h3><input id="custQ" placeholder="بحث باسم العميل..." oninput="filterCust()"><button class="btn" onclick="openCustomerModal()">➕ عميل جديد</button><button class="btn btn-blue" onclick="exportCustomers()">📥 Excel</button></div><p style="font-size:13px;color:#555;margin:0 0 8px">للبيع الآجل: من شاشة الكاشير اختار طريقة الدفع "آجل (على حساب عميل)" واختار العميل، وبعدها سدّد من كشف حسابه.</p>'+
  tbl(['العميل','الهاتف','رصيد سابق','مبيعات آجل','المسدد','المتبقي','إجراء'],rows.map(function(r){
    return '<tr class="crow" data-s="'+esc((r.c.name+' '+(r.c.phone||'')).toLowerCase())+'"><td><b>'+esc(r.c.name)+'</b></td><td>'+esc(r.c.phone||'-')+'</td><td>'+money(r.s.opening)+'</td><td>'+money(r.s.salesTotal)+'</td><td>'+money(r.s.paid)+'</td><td style="color:'+(r.s.due>0?'#c62828':'#2e7d32')+'"><b>'+money(r.s.due)+'</b></td><td><button class="btn btn-sm btn-blue" onclick="viewCustomer(\''+r.c.id+'\')">كشف حساب</button> <button class="btn btn-sm" onclick="openCustomerPay(\''+r.c.id+'\')">💵 تحصيل</button> <button class="btn btn-sm btn-gray" onclick="openCustomerModal(\''+r.c.id+'\')">تعديل</button></td></tr>';
  }))+'</div>';
}
function filterCust(){ var q=$('custQ').value.trim().toLowerCase(); document.querySelectorAll('.crow').forEach(function(r){r.style.display=(!q||r.getAttribute('data-s').indexOf(q)>=0)?'':'none';}); }
function openCustomerModal(id){
  var c=id?load('cashier_customers').filter(function(x){return x.id===id;})[0]:null; c=c||{};
  openModal(id?'✏️ تعديل عميل':'➕ عميل جديد','<label class="lb">الاسم</label><input id="cuName" value="'+esc(c.name||'')+'"><label class="lb">الهاتف</label><input id="cuPhone" value="'+esc(c.phone||'')+'"><label class="lb">رصيد سابق مستحق عليه (اختياري)</label><input type="number" id="cuOpen" step="0.01" min="0" value="'+(c.openingBalance!=null?c.openingBalance:'')+'"><button class="btn" onclick="saveCustomer(\''+(id||'')+'\')">💾 حفظ</button>');
}
function saveCustomer(id){
  var name=$('cuName').value.trim(); if(!name){alert('اكتب اسم العميل');return;}
  var l=load('cashier_customers'), data={name:name,phone:$('cuPhone').value.trim(),openingBalance:num($('cuOpen').value)};
  var rec;
  if(id)l.forEach(function(x){if(x.id===id)Object.assign(x,data);}); else {rec=Object.assign({id:genId(),dateAdded:new Date().toISOString()},data);l.push(rec);}
  save('cashier_customers',l); if(rec&&currentTab==='cashier')CUST_SEL=rec.id;
  closeModal(); renderTab(currentTab);
}
function viewCustomer(id){
  var c=load('cashier_customers').filter(function(x){return x.id===id;})[0]; if(!c)return;
  var s=custStats(c);
  var h='<div class="cards">'+card('رصيد سابق',money(s.opening))+card('مبيعات آجل',money(s.salesTotal))+card('المسدد',money(s.paid),'blue')+card('المتبقي',money(s.due),s.due>0?'red':'')+'</div>'+
  '<div class="row" style="margin:8px 0"><button class="btn" onclick="openCustomerPay(\''+id+'\')">💵 تحصيل دفعة</button></div>'+
  '<h4>🧾 فواتير الآجل</h4>'+tbl(['الفاتورة','التاريخ','الإجمالي','الكاشير'],s.sales.slice().reverse().map(function(x){return '<tr><td><span class="invlink" onclick="viewSaleById(\''+x.id+'\')">'+esc(x.invoiceNum||x.id)+'</span></td><td>'+fdate(x.date)+'</td><td>'+money(x.total)+'</td><td>'+esc(x.soldBy)+'</td></tr>';}))+
  '<h4>💵 الدفعات</h4>'+tbl(['التاريخ','المبلغ','المحصّل في','ملاحظة','بواسطة'],s.pays.slice().reverse().map(function(x){return '<tr><td>'+fdate(x.date)+'</td><td><b>'+money(x.amount)+'</b></td><td>'+(RECV[x.dest]||x.dest)+'</td><td>'+esc(x.note||'')+'</td><td>'+esc(x.by||'')+'</td></tr>';}));
  openModal('🧾 كشف حساب '+esc(c.name),h,true);
}
function openCustomerPay(id){
  var c=load('cashier_customers').filter(function(x){return x.id===id;})[0]; if(!c)return; var s=custStats(c);
  openModal('💵 تحصيل من '+esc(c.name),'<div class="tot">المتبقي عليه: <b>'+money(s.due)+'</b></div><label class="lb">المبلغ</label><input type="number" id="cpAmt" step="0.01" min="0" value="'+(s.due>0?s.due:'')+'"><label class="lb">يتحصّل في</label><select id="cpDest">'+recvOptions()+'</select><label class="lb">ملاحظة</label><input id="cpNote"><button class="btn" onclick="confirmCustomerPay(\''+id+'\')">تأكيد التحصيل</button>');
}
var CP_BUSY=false;
function confirmCustomerPay(id){
  if(CP_BUSY)return;
  var c=load('cashier_customers').filter(function(x){return x.id===id;})[0]; if(!c)return;
  var a=num($('cpAmt').value), dest=$('cpDest').value, note=$('cpNote').value.trim(), sh=getOpenShift();
  if(a<=0){alert('اكتب مبلغ صحيح');return;}
  if(dest==='drawer'&&!sh){alert('لازم تفتح شيفت للتحصيل في الدرج');return;}
  CP_BUSY=true;
  receiveFunds(dest,a,'تحصيل من العميل '+c.name+(note?' - '+note:'')).then(function(){
    var l=load('cashier_customer_payments'); l.push({id:genId(),customerId:id,amount:a,dest:dest,shiftId:(dest==='drawer'&&sh)?sh.id:null,note:note,date:new Date().toISOString(),by:me()}); save('cashier_customer_payments',l);
    CP_BUSY=false; closeModal(); alert('✅ تم تحصيل '+money(a)+' من '+c.name); renderCustomers();
  }).catch(function(e){CP_BUSY=false;alert('فشل: '+e.message);});
}
function exportCustomers(){
  xl('آجل_عملاء.xlsx',[{name:'العملاء',rows:load('cashier_customers').map(function(c){var s=custStats(c);return {'العميل':c.name,'الهاتف':c.phone||'','رصيد سابق':s.opening,'مبيعات آجل':s.salesTotal,'المسدد':s.paid,'المتبقي':s.due};})}]);
}

/* ---------- employees with advances ---------- */
function empAdvBalance(empId){
  return r2(load('cashier_emp_advances').filter(function(x){return x.empId===empId;}).reduce(function(a,x){return a+(x.type==='advance'?num(x.amount):-num(x.amount));},0));
}
function empMonthData(emp,mk){
  var allSh=emp.userName?load('cashier_shifts').filter(function(s){return s.cashierName===emp.userName;}):[];
  var shifts=allSh.filter(function(s){return monthKey(s.startTime)===mk;});
  var hours=shifts.reduce(function(a,s){return a+shiftHours(s);},0);
  var ded=load('cashier_emp_deductions').filter(function(d){return d.empId===emp.id&&monthKey(d.date)===mk;});
  var dedSum=r2(ded.reduce(function(a,d){return a+num(d.amount);},0));
  var salDef=allSh.filter(function(s){return s.deficitStatus==='settled'&&s.settlement&&s.settlement.method==='salary'&&!s.salaryDeducted;});
  var salDefSum=r2(salDef.reduce(function(a,s){return a+num(s.deficit);},0));
  var pend=allSh.filter(function(s){return s.deficitStatus==='pending';});
  var pendSum=r2(pend.reduce(function(a,s){return a+num(s.deficit);},0));
  var paid=load('cashier_salary_payments').filter(function(p){return p.empId===emp.id&&p.month===mk;});
  var advDed=load('cashier_emp_advances').filter(function(x){return x.empId===emp.id&&x.type==='repay'&&x.method==='salary'&&x.month===mk;});
  var advDedSum=r2(advDed.reduce(function(a,x){return a+num(x.amount);},0));
  var base=num(emp.salary);
  return {shifts:shifts,hours:r2(hours),ded:ded,dedSum:dedSum,salDef:salDef,salDefSum:salDefSum,pend:pend,pendSum:pendSum,paid:paid,base:base,advDed:advDed,advDedSum:advDedSum,advBal:empAdvBalance(emp.id),net:r2(base-dedSum-salDefSum-advDedSum)};
}

  tbl(['الموظف','حساب الكاشير','الراتب الأساسي','ساعات العمل','الخصومات','عجز مخصوم','عجز معلق','سلف متبقية','الصافي المستحق','الحالة','إجراء'],emps.map(function(e){
    var d=empMonthData(e,EMP_MONTH);
    return '<tr><td><b>'+esc(e.name)+'</b></td><td>'+esc(e.userName||'-')+'</td><td>'+money(d.base)+'</td><td>'+(e.userName?fmtHours(d.hours):'-')+'</td><td>'+money(d.dedSum)+'</td><td>'+money(d.salDefSum)+'</td><td style="color:#c62828">'+money(d.pendSum)+'</td><td style="color:'+(d.advBal>0?'#c62828':'#2e7d32')+'"><b>'+money(d.advBal)+'</b></td><td><b>'+money(d.net)+'</b></td><td>'+(d.paid.length?bd('تم الصرف','g'):bd('غير مصروف','o'))+'</td><td><button class="btn btn-sm btn-blue" onclick="viewEmployee(\''+e.id+'\')">كشف الحساب</button> <button class="btn btn-sm btn-or" onclick="openAdvance(\''+e.id+'\')">💸 سلفة</button> <button class="btn btn-sm btn-or" onclick="openDeduction(\''+e.id+'\')">خصم</button> <button class="btn btn-sm" onclick="openPaySalary(\''+e.id+'\')">صرف الراتب</button> <button class="btn btn-sm btn-gray" onclick="openEmployeeModal(\''+e.id+'\')">تعديل</button></td></tr>';
  }))+'</div>';

  }))+
  '<h4>➖ الخصومات</h4>'+tbl(['التاريخ','المبلغ','السبب','بواسطة',''],d.ded.map(function(x){return '<tr><td>'+fdate(x.date)+'</td><td>'+money(x.amount)+'</td><td>'+esc(x.reason)+'</td><td>'+esc(x.by||'')+'</td><td><button class="btn btn-sm btn-red" onclick="deleteDeduction(\''+x.id+'\',\''+id+'\',\''+mk+'\')">✕</button></td></tr>';}))+
  (e.userName?'<h4>⚠️ العجز</h4>'+tbl(['التاريخ','العجز','الحالة'],d.pend.map(function(s){return '<tr><td>'+fdate(s.endTime)+'</td><td style="color:#c62828">'+money(s.deficit)+'</td><td>'+bd('معلق','r')+'</td></tr>';}).concat(d.salDef.map(function(s){return '<tr><td>'+fdate(s.endTime)+'</td><td>'+money(s.deficit)+'</td><td>'+bd('سيُخصم من الراتب','o')+'</td></tr>';}))):'')+
  '<h4>💵 سجل صرف الرواتب</h4>'+tbl(['الشهر','الأساسي','الخصومات','عجز','سلف','الصافي','المصدر','التاريخ'],pays.map(function(p){return '<tr><td>'+esc(p.month)+'</td><td>'+money(p.base)+'</td><td>'+money(p.manualDed)+'</td><td>'+money(p.deficitDed)+'</td><td>'+money(p.advDed)+'</td><td><b>'+money(p.net)+'</b></td><td>'+srcLabel(p.source)+'</td><td>'+fdate(p.date)+'</td></tr>';}))+
  '<div class="row" style="margin-top:8px"><button class="btn btn-or" onclick="openDeduction(\''+id+'\')">➖ خصم</button><button class="btn" onclick="openPaySalary(\''+id+'\',\''+mk+'\')">💵 صرف الراتب</button></div>';

function openPaySalary(id,mk){
  mk=mk||EMP_MONTH;
  var e=load('cashier_employees').filter(function(x){return x.id===id;})[0]; if(!e)return;
  var d=empMonthData(e,mk);
  openModal('💵 صرف راتب '+esc(e.name),'<div class="tot">الشهر: <b>'+mk+'</b><br>الأساسي: '+money(d.base)+'<br>خصومات: '+money(d.dedSum)+'<br>عجز مخصوم من المستحقات: '+money(d.salDefSum)+'<br>سلف مخصومة: '+money(d.advDedSum)+'<div class="big">الصافي: '+money(d.net)+'</div></div>'+(d.paid.length?'<div class="warnbox">⚠️ تم صرف راتب هذا الشهر من قبل</div>':'')+(d.pendSum?'<div class="warnbox">يوجد عجز معلق '+money(d.pendSum)+' لم يتم تسويته (لن يُخصم إلا بعد تسويته بطريقة "خصم من المستحقات")</div>':'')+(d.advBal>0?'<div class="warnbox">عليه سلف متبقية '+money(d.advBal)+' — لخصمها من الراتب استخدم "سداد سلفة ← خصم من الراتب"</div>':'')+'<label class="lb">مصدر الصرف</label><select id="salSrc">'+srcOptions('safe')+'</select><button class="btn" onclick="confirmPaySalary(\''+id+'\',\''+mk+'\')">تأكيد الصرف</button>');
}
function openAdvance(id){
  var e=load('cashier_employees').filter(function(x){return x.id===id;})[0]; if(!e)return;
  openModal('💸 سلفة لـ '+esc(e.name),'<div class="tot">سلف متبقية حالياً: <b>'+money(empAdvBalance(id))+'</b></div><label class="lb">المبلغ</label><input type="number" id="avAmt" step="0.01" min="0"><label class="lb">يُصرف من</label><select id="avSrc">'+srcOptions('safe')+'</select><label class="lb">ملاحظة / السبب</label><input id="avNote"><button class="btn" onclick="confirmAdvance(\''+id+'\')">تأكيد السلفة</button>');
}
var AV_BUSY=false;
function confirmAdvance(id){
  if(AV_BUSY)return;
  var e=load('cashier_employees').filter(function(x){return x.id===id;})[0]; if(!e)return;
  var a=num($('avAmt').value), src=$('avSrc').value, note=$('avNote').value.trim(), sh=getOpenShift();
  if(a<=0){alert('اكتب مبلغ صحيح');return;}
  if(src==='drawer'){ if(!sh){alert('لازم تفتح شيفت للصرف من الدرج');return;} if(calcShiftStats(sh).expected<a){alert('رصيد الدرج غير كافي');return;} }
  var err=checkFunds(src,a); if(err&&src!=='safe'){alert(err);return;}
  AV_BUSY=true;
  var now=new Date().toISOString(), dis={id:genId(),description:'سلفة للموظف '+e.name+(note?' - '+note:''),amount:a,source:src,category:'advance',purchaseId:null,installmentId:null,shiftId:(src==='drawer'&&sh)?sh.id:null,requestedBy:me(),status:'approved',approvedBy:me(),approvedDate:now,rejectReason:null,date:now};
  applyApprovedEffects(dis).then(function(){
    var ds=load('cashier_disbursements'); ds.push(dis); save('cashier_disbursements',ds);
    var l=load('cashier_emp_advances'); l.push({id:genId(),empId:id,type:'advance',amount:a,source:src,note:note,date:now,by:me()}); save('cashier_emp_advances',l);
    AV_BUSY=false; closeModal(); alert('✅ تم صرف سلفة '+money(a)+' لـ '+e.name); renderEmployees();
  }).catch(function(er){AV_BUSY=false;alert('فشل: '+er.message);});
}
function openAdvRepay(id,mk){
  var e=load('cashier_employees').filter(function(x){return x.id===id;})[0]; if(!e)return;
  var bal=empAdvBalance(id);
  openModal('↩️ سداد سلفة — '+esc(e.name),'<div class="tot">السلف المتبقية: <b>'+money(bal)+'</b></div><label class="lb">المبلغ</label><input type="number" id="arAmt" step="0.01" min="0" value="'+(bal>0?bal:'')+'"><label class="lb">طريقة السداد</label><select id="arMeth" onchange="var m=$(\'arMonthRow\');m.style.display=this.value===\'salary\'?\'block\':\'none\'"><option value="salary">خصم من الراتب</option>'+recvOptions().replace(/value="(\w+)">إلى /g,'value="$1">دفع كاش — إلى ')+'</select><div id="arMonthRow"><label class="lb">يُخصم من راتب شهر</label><input type="month" id="arMonth" value="'+(mk||EMP_MONTH)+'"></div><label class="lb">ملاحظة</label><input id="arNote"><button class="btn" onclick="confirmAdvRepay(\''+id+'\')">تأكيد السداد</button>');
}
function confirmAdvRepay(id){
  var e=load('cashier_employees').filter(function(x){return x.id===id;})[0]; if(!e)return;
  var a=num($('arAmt').value), m=$('arMeth').value, note=$('arNote').value.trim(), sh=getOpenShift(), bal=empAdvBalance(id);
  if(a<=0){alert('اكتب مبلغ صحيح');return;}
  if(a>bal+0.001&&!confirm('المبلغ أكبر من السلف المتبقية ('+money(bal)+'). متابعة؟'))return;
  if(m==='drawer'&&!sh){alert('لازم تفتح شيفت للسداد في الدرج');return;}
  var rec={id:genId(),empId:id,type:'repay',amount:a,method:m,month:m==='salary'?$('arMonth').value:null,shiftId:(m==='drawer'&&sh)?sh.id:null,note:note,date:new Date().toISOString(),by:me()};
  (m==='salary'?Promise.resolve():receiveFunds(m,a,'سداد سلفة '+e.name+(note?' - '+note:''))).then(function(){
    var l=load('cashier_emp_advances'); l.push(rec); save('cashier_emp_advances',l);
    closeModal(); alert('✅ تم تسجيل سداد '+money(a)); renderEmployees();
  }).catch(function(er){alert('فشل: '+er.message);});
}

/* ---------- suppliers: owed amounts without invoices ---------- */
function renderSuppliers(){
  var sups=load('cashier_suppliers'), rows=sups.map(function(s){return {s:s,st:supplierStats(s)};});
  var tot=rows.reduce(function(a,r){return a+r.st.total;},0), due=rows.reduce(function(a,r){return a+r.st.due;},0);
  var spIn=load('cashier_superpay_tx').filter(function(t){return t.type==='transfer_in';}).reduce(function(a,t){return a+num(t.amount);},0);
  $('content').innerHTML='<div class="cards">'+card('إجمالي المستحق للموردين (فواتير + مبالغ)',money(tot))+card('إجمالي المسدد',money(tot-due),'blue')+card('المتبقي للموردين',money(due),due>0?'red':'')+card('تغذية Super pay',money(spIn),'or')+'</div>'+
  '<div class="panel"><div class="row"><h3 style="margin:0;flex:1">🏭 حساب الموردين</h3><button class="btn" onclick="openSupplierDebt()">➕ مورد / مبلغ مستحق</button><button class="btn btn-blue" onclick="exportSuppliers()">📥 Excel</button></div>'+
  tbl(['المورد','النوع','عدد الفواتير','مبالغ مضافة','إجمالي المستحق','المسدد','المتبقي','قيد الاعتماد','إجراء'],rows.map(function(r){
    return '<tr><td><b>'+esc(r.s.name)+'</b></td><td>'+(isCredit(r.s)?bd('آجل','o'):bd('كاش','g'))+'</td><td>'+r.st.count+'</td><td>'+money(r.st.debts)+'</td><td>'+money(r.st.total)+'</td><td>'+money(r.st.paid)+'</td><td style="color:'+(r.st.due>0?'#c62828':'#2e7d32')+'"><b>'+money(r.st.due)+'</b></td><td>'+money(r.st.pending)+'</td><td><button class="btn btn-sm btn-blue" onclick="viewSupplier(\''+r.s.id+'\')">كشف حساب</button> <button class="btn btn-sm" onclick="openSupplierPay(\''+r.s.id+'\')">💵 سداد</button> <button class="btn btn-sm btn-gray" onclick="openSupplierEdit(\''+r.s.id+'\')">✏️ تعديل</button></td></tr>';
  }).concat(['<tr style="background:#f3e5f5"><td><b>Super pay</b></td><td>'+bd('رصيد','b')+'</td><td>-</td><td>-</td><td>'+money(spIn)+'</td><td>-</td><td>-</td><td>-</td><td><button class="btn btn-sm btn-blue" onclick="renderTab(\'superpay\')">فتح سوبر باي</button></td></tr>']))+'</div>';
}
function openSupplierDebt(supId){
  var sups=load('cashier_suppliers');
  openModal('➕ مبلغ مستحق لمورد','<label class="lb">المورد</label><select id="sdSup" onchange="$(\'sdNewRow\').style.display=this.value===\'__new\'?\'block\':\'none\'"><option value="__new"'+(supId?'':' selected')+'>➕ مورد جديد</option>'+sups.map(function(s){return '<option value="'+s.id+'"'+(supId===s.id?' selected':'')+'>'+esc(s.name)+'</option>';}).join('')+'</select><div id="sdNewRow" style="display:'+(supId?'none':'block')+'"><label class="lb">اسم المورد الجديد</label><input id="sdName"></div><label class="lb">المبلغ المستحق له</label><input type="number" id="sdAmt" step="0.01" min="0"><label class="lb">ملاحظة (اختياري)</label><input id="sdNote"><small>المبلغ بيتضاف على حساب المورد من غير فاتورة أصناف (مفيش تأثير على المخزون)، وتسدد منه براحتك من "سداد".</small><br><button class="btn" onclick="saveSupplierDebt()">💾 حفظ</button>');
}
function saveSupplierDebt(){
  var sid=$('sdSup').value, a=num($('sdAmt').value), note=$('sdNote').value.trim();
  if(a<=0){alert('اكتب المبلغ');return;}
  var sups=load('cashier_suppliers');
  if(sid==='__new'){
    var n=$('sdName').value.trim(); if(!n){alert('اكتب اسم المورد');return;}
    if(sups.some(function(s){return s.name===n;})){alert('المورد موجود بالفعل، اختاره من القايمة');return;}
    var s={id:genId(),name:n,type:'credit'}; sups.push(s); save('cashier_suppliers',sups); sid=s.id;
  }
  var l=load('cashier_supplier_debts'); l.push({id:genId(),supplierId:sid,amount:a,note:note,date:new Date().toISOString(),by:me()}); save('cashier_supplier_debts',l);
  closeModal(); renderSuppliers();
}
function viewSupplier(id){
  var s=load('cashier_suppliers').filter(function(x){return x.id===id;})[0]; if(!s)return;
  var st=supplierStats(s), all=load('cashier_purchases').filter(function(p){return p.supplierId===id;}).slice().reverse();
  var pays=load('cashier_supplier_payments').filter(function(x){return x.supplierId===id;}).slice().reverse();
  var debts=load('cashier_supplier_debts').filter(function(x){return x.supplierId===id;}).slice().reverse();
  var h='<div class="cards">'+card('إجمالي المستحق',money(st.total))+card('المسدد',money(st.paid),'blue')+card(st.due<0?'رصيد للمورد (دفعنا زيادة)':'المتبقي',money(Math.abs(st.due)),st.due>0?'red':'')+'</div>'+
  '<div class="row" style="margin:8px 0"><button class="btn" onclick="openSupplierPay(\''+id+'\')">💵 سداد دفعة للمورد</button><button class="btn btn-or" onclick="openSupplierDebt(\''+id+'\')">➕ إضافة مبلغ مستحق</button><button class="btn btn-gray" onclick="openSupplierEdit(\''+id+'\')">✏️ تعديل الاسم</button></div>'+
  tbl(['الفاتورة','التاريخ','الإجمالي','الحالة','السداد','المتبقي'],all.map(function(p){
    var paid=p.installments?p.installments.reduce(function(a,i){return a+instPaid(i);},0):(p.paid?num(p.total):0);
    return '<tr><td><span class="invlink" onclick="viewPurchaseDetails(\''+p.id+'\')">'+esc(p.purchaseNum||p.id)+'</span></td><td>'+fdate(p.date)+'</td><td>'+money(p.total)+'</td><td>'+stBadge(p.status)+'</td><td>'+money(paid)+'</td><td>'+money(p.status==='approved'?num(p.total)-paid:0)+'</td></tr>';
  }));
  if(debts.length)h+='<h4>➕ مبالغ مضافة على الحساب</h4>'+tbl(['التاريخ','المبلغ','ملاحظة','بواسطة'],debts.map(function(x){return '<tr><td>'+fdate(x.date)+'</td><td>'+money(x.amount)+'</td><td>'+esc(x.note||'')+'</td><td>'+esc(x.by||'')+'</td></tr>';}));
  var ins=[]; st.purchases.forEach(function(p){ (p.installments||[]).forEach(function(i){ if(!i.paid)ins.push({p:p,i:i}); }); });
  if(ins.length)h+='<h4>أقساط غير مسددة</h4>'+tbl(['الفاتورة','القسط','المتبقي منه','الحالة','إجراء'],ins.map(function(x){
    var rem=r2(num(x.i.amount)-num(x.i.paidAmount));
    var act=x.i.disbursementRequested?bd('طلب صرف قيد المراجعة','o'):'<button class="btn btn-sm" onclick="requestInstallment(\''+x.p.id+'\',\''+x.i.id+'\')">🧾 صرف القسط</button>';
    return '<tr><td>'+esc(x.p.purchaseNum||'')+'</td><td>'+x.i.number+'</td><td>'+money(rem)+'</td><td>'+(num(x.i.paidAmount)>0?bd('مسدد جزئياً','o'):bd('غير مدفوع','r'))+'</td><td>'+act+'</td></tr>';
  }));
  var pend=load('cashier_disbursements').filter(function(d){return d.category==='supplier'&&d.supplierId===id&&d.status==='pending';});
  if(pend.length)h+='<h4>دفعات في انتظار اعتماد المدير</h4>'+tbl(['التاريخ','المبلغ','المصدر','بواسطة'],pend.map(function(d){return '<tr><td>'+fdate(d.date)+'</td><td>'+money(d.amount)+'</td><td>'+srcLabel(d.source)+'</td><td>'+esc(d.requestedBy)+'</td></tr>';}));
  h+='<h4>💵 سجل الدفعات</h4>'+tbl(['التاريخ','المبلغ','المصدر','على أقساط','على الرصيد / مقدمة','ملاحظة','بواسطة'],pays.map(function(x){return '<tr><td>'+fdate(x.date)+'</td><td><b>'+money(x.amount)+'</b></td><td>'+srcLabel(x.source)+'</td><td>'+money(x.allocated)+'</td><td>'+money(x.advance)+'</td><td>'+esc(x.note||'')+'</td><td>'+esc(x.by||'')+'</td></tr>';}));
  openModal('🏭 كشف حساب '+esc(s.name),h,true);
}


function openSupplierEdit(id){
  var s=load('cashier_suppliers').filter(function(x){return x.id===id;})[0]; if(!s)return;
  openModal('✏️ تعديل المورد','<label class="lb">اسم المورد</label><input id="seName" value="'+esc(s.name)+'" onkeydown="if(event.key===\'Enter\')saveSupplierEdit(\''+id+'\')"><label class="lb">النوع (يؤثر على الفواتير الجديدة فقط)</label><select id="seType"><option value="cash"'+(isCredit(s)?'':' selected')+'>كاش</option><option value="credit"'+(isCredit(s)?' selected':'')+'>آجل</option></select><button class="btn" onclick="saveSupplierEdit(\''+id+'\')">💾 حفظ</button>');
}
function saveSupplierEdit(id){
  var n=$('seName').value.trim(); if(!n){alert('اكتب الاسم');return;}
  var l=load('cashier_suppliers');
  if(l.some(function(x){return x.name===n&&x.id!==id;})){alert('الاسم مستخدم لمورد آخر');return;}
  var s=l.filter(function(x){return x.id===id;})[0]; if(!s)return;
  var old=s.name; s.name=n; s.type=$('seType').value; save('cashier_suppliers',l);
  if(old!==n){
    var ps=load('cashier_purchases'); ps.forEach(function(p){if(p.supplierId===id)p.supplierName=n;}); save('cashier_purchases',ps);
    var sp=load('cashier_supplier_payments'); sp.forEach(function(p){if(p.supplierId===id)p.supplierName=n;}); save('cashier_supplier_payments',sp);
    var ds=load('cashier_disbursements'); ds.forEach(function(d){if(d.supplierId===id)d.supplierName=n;}); save('cashier_disbursements',ds);
  }
  closeModal(); renderSuppliers();
}


/* ---------- loose units (الفرط): e.g. cigarettes ---------- */
function syncLoose(list){
  if(!Array.isArray(list))return;
  var byId={}; list.forEach(function(p){byId[p.id]=p;});
  list.forEach(function(p){
    if(!p.looseOf)return;
    var par=byId[p.looseOf]; if(!par)return;
    var n=num(p.perPack)||1;
    p.stock=r2(num(p.looseOpen)+num(par.stock)*n);
    p.costPrice=r2(num(par.costPrice)/n);
  });
}
function deductStock(prods,id,q){
  q=num(q); var p=prods.filter(function(x){return x.id===id;})[0]; if(!p||q===0)return;
  if(p.looseOf){
    var par=prods.filter(function(x){return x.id===p.looseOf;})[0], n=num(p.perPack)||1;
    if(!par){p.stock=num(p.stock)-q;return;}
    var open=num(p.looseOpen), guard=0;
    while(open<q&&guard++<1000){ par.stock=num(par.stock)-1; open=r2(open+n); }
    p.looseOpen=r2(open-q);
    syncLoose(prods);
  } else p.stock=num(p.stock)-q;
}
function openLooseModal(id){
  var prods=load('cashier_products'), p=id?prods.filter(function(x){return x.id===id;})[0]:null; p=p||{};
  var parents=prods.filter(function(x){return !x.looseOf;});
  openModal(id?'✏️ تعديل منتج فرط':'🚬 منتج فرط جديد','<p style="font-size:13px;line-height:1.7;margin:0 0 6px">المنتج الفرط بيسحب من العلبة الأصلية: أول سيجارة بتتباع بتفتح علبة (تنقص من مخزون العلبة)، وبعدها بيخصم من اللي في العلبة المفتوحة، ولما تخلص بيفتح علبة جديدة تلقائي.</p>'+
   '<label class="lb">المنتج الأصلي (العلبة)</label><select id="lsPar" onchange="lsAuto()"><option value="">— اختر —</option>'+parents.map(function(x){return '<option value="'+x.id+'"'+(p.looseOf===x.id?' selected':'')+'>'+esc(x.name)+' — مخزون '+num(x.stock)+'</option>';}).join('')+'</select>'+
   '<label class="lb">اسم المنتج الفرط</label><input id="lsName" value="'+esc(p.name||'')+'">'+
   '<div class="row"><div style="flex:1"><label class="lb">عدد الوحدات في العلبة</label><input type="number" id="lsPer" min="1" value="'+(p.perPack||20)+'" oninput="lsAuto()"></div><div style="flex:1"><label class="lb">سعر بيع الواحدة</label><input type="number" id="lsPrice" step="0.01" min="0" value="'+(p.price!=null?p.price:'')+'"></div></div>'+
   '<div id="lsHint" class="hint ok"></div>'+
   '<label class="lb">الفئة</label><select id="lsCat">'+catOptions(p.category||'')+'</select>'+
   '<label class="lb">الباركود (اختياري)</label><input id="lsBc" value="'+esc(p.barcode||'')+'">'+
   (id?'<div class="tot">المتاح حالياً: <b>'+num(p.stock)+'</b> وحدة (منها '+num(p.looseOpen)+' في علبة مفتوحة)</div>':'')+
   '<button class="btn" onclick="saveLoose(\''+(id||'')+'\')">💾 حفظ</button>'+(id?' <button class="btn btn-red" onclick="deleteLoose(\''+id+'\')">حذف</button>':''));
  setTimeout(lsAuto,30);
}
function lsAuto(){
  var par=prodById($('lsPar').value), n=num($('lsPer').value)||1, h=$('lsHint'); if(!h)return;
  if(!par){h.textContent='';return;}
  if(!$('lsName').value.trim())$('lsName').value=par.name+' فرط';
  if(!$('lsCat').value&&par.category)$('lsCat').value=par.category;
  h.textContent='تكلفة الواحدة: '+money(num(par.costPrice)/n)+' — سعر العلبة: '+money(par.price)+' ('+money(num(par.price)/n)+' للواحدة)';
}
function saveLoose(id){
  var parId=$('lsPar').value, name=$('lsName').value.trim(), per=num($('lsPer').value), price=num($('lsPrice').value), bc=normBC($('lsBc').value);
  if(!parId){alert('اختر المنتج الأصلي');return;}
  if(!name){alert('اكتب اسم المنتج');return;}
  if(per<1){alert('عدد الوحدات لازم 1 أو أكتر');return;}
  if(price<=0){alert('اكتب سعر الواحدة');return;}
  if(bc){var o=findByBarcode(bc,id||null); if(o){alert('❌ الباركود مستخدم للمنتج: '+o.name);return;}}
  var l=load('cashier_products');
  if(id){ l.forEach(function(p){ if(p.id===id){ p.name=name; p.looseOf=parId; p.perPack=per; p.price=price; p.barcode=bc; p.category=$('lsCat').value; } }); }
  else l.push({id:genId(),name:name,category:$('lsCat').value,barcode:bc,price:price,costPrice:0,stock:0,minStock:5,looseOf:parId,perPack:per,looseOpen:0,dateAdded:new Date().toISOString()});
  save('cashier_products',l); closeModal(); renderProducts();
}
function deleteLoose(id){
  if(!confirm('حذف المنتج الفرط؟'))return;
  var p=prodById(id), open=p?num(p.looseOpen):0;
  if(open>0&&!confirm('فيه '+open+' وحدة في علبة مفتوحة، هتتحذف مع المنتج. متابعة؟'))return;
  save('cashier_products',load('cashier_products').filter(function(x){return x.id!==id;})); closeModal(); renderProducts();
}

</script>
