<style>

#tabsNav{background:#fff;display:flex;flex-wrap:wrap;gap:6px;padding:10px 16px;border-bottom:2px solid var(--bd)}
.nav-tab{padding:8px 14px;border-radius:8px;border:none;background:transparent;font-weight:700;font-size:14px;cursor:pointer;color:var(--tx)}

.card{background:#fff;border-radius:12px;padding:18px;box-shadow:0 3px 10px rgba(0,0,0,.06);margin-bottom:18px}
.card-title{font-size:17px;font-weight:800;color:var(--pd);margin-bottom:14px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;border-bottom:2px solid #e8f5e9;padding-bottom:8px}

.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-primary{background:var(--pg);color:#fff}.btn-primary:hover{background:var(--pd)}

tr:hover{background:#f1f8e9}

.prod-card:hover{border-color:var(--pg);transform:translateY(-2px)}
.prod-card.low{border-color:var(--org);background:#fffde7}.prod-card.out{border-color:var(--red);background:#ffebee}
.p-name{font-weight:800;font-size:14px;line-height:1.3}.p-price{font-weight:900;color:var(--pg);font-size:16px}.p-stock{font-size:11px;color:var(--mu)}
#modalOverlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:1000;padding:12px}
.modal-box{background:#fff;border-radius:14px;width:100%;max-width:680px;max-height:92vh;overflow-y:auto;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.modal-header{padding:14px 18px;background:var(--bg);border-bottom:1px solid var(--bd);display:flex;justify-content:space-between;align-items:center;position:sticky;top:0}
.modal-header h3{font-size:17px;font-weight:800;color:var(--pd)}

.modal-x-close:hover{color:var(--red)}
.modal-body{padding:18px}

.spinner{width:50px;height:50px;border:5px solid #e8f5e9;border-top:5px solid var(--pg);border-radius:50%;animation:spin .8s linear infinite;margin-bottom:14px}
@keyframes spin{to{transform:rotate(360deg)}}
.danger-zone{border:2px dashed var(--red);border-radius:10px;padding:14px;background:#fff5f5;margin-top:22px}
.danger-zone h3{color:var(--red);font-size:16px;margin-bottom:6px}
.danger-zone .note{font-size:12px;color:#555;margin-bottom:10px;line-height:1.5}
.note{font-size:12px;color:var(--mu)}
</style>

<body>
<div id="loadingOverlay"><div class="spinner"></div><div>جاري تحميل نظام زين ماركت... 🛒</div></div>

<div id="topbar">
  <div class="brand">
    <div class="logo-circle">🛒</div>
    <div><h1>زين ماركت</h1><div class="sub">نظام إدارة الكاشير والمبيعات</div></div>
    <span class="badge badge-green" id="buildBadge">نسخة 9</span>
  </div>
  <div class="user-area" id="topbarUserArea"></div>
</div>
<div id="tabsNav" style="display:none"></div>
<div id="viewContainer"></div>

<div id="modalOverlay">
  <div class="modal-box">
    <div class="modal-header"><h3 id="modalTitle"></h3><button class="modal-x-close" onclick="closeModal()">✖</button></div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<div id="scannerOverlay">
  <div id="scannerBox">
    <div style="padding:12px;background:#2e7d32;color:#fff;font-weight:bold;display:flex;justify-content:space-between;align-items:center">
      <span>📷 مسح الباركود بالكاميرا</span>
      <button onclick="closeBarcodeScanner()" style="background:none;border:none;color:#fff;font-size:16px;cursor:pointer">✖ إغلاق</button>
    </div>
    <div id="interactiveScanner" style="width:100%;min-height:250px;background:#000"></div>
  </div>
</div>

<script>
var APP_BUILD = 9;

var ROLE_PERMISSIONS = {
  admin: ['cashier','purchases','disbursements','returns','wallets','live','inventory','products','reports','profit','safe','users'],
  cashier: ['cashier','purchases','disbursements','returns','wallets','reports']
};
var TAB_DEFS = [
  {id:'cashier', label:'💰 الكاشير'},
  {id:'purchases', label:'📥 فواتير الشراء'},
  {id:'disbursements', label:'💸 طلبات الصرف'},
  {id:'returns', label:'↩️ المرتجعات والتوالف'},
  {id:'wallets', label:'💳 المحافظ الإلكترونية'},
  {id:'live', label:'📡 متابعة مباشرة'},
  {id:'inventory', label:'📦 المخزون'},
  {id:'products', label:'🛒 المنتجات'},
  {id:'reports', label:'📊 التقارير'},
  {id:'profit', label:'📈 الأرباح'},
  {id:'safe', label:'🏦 الخزنة'},
  {id:'users', label:'👥 إدارة المستخدمين'}
];
var SYNC_KEYS = ['cashier_users','cashier_products','cashier_sales','cashier_purchases','cashier_suppliers','cashier_disbursements','cashier_shifts','cashier_stock_adjustments','cashier_wallets','cashier_wallet_transactions','cashier_safe','cashier_safe_transactions','cashier_returns','cashier_damages','invoice_counter','purchase_counter','wallet_counter'];

var firebaseConfig = {
  apiKey: "AIzaSyDIp3OlRAP0Wa7Ea1W87NZkYAwOe0xueSQ",
  authDomain: "casheir-840ee.firebaseapp.com",
  projectId: "casheir-840ee",
  storageBucket: "casheir-840ee.firebasestorage.app",
  messagingSenderId: "1078746217763",
  appId: "1:1078746217763:web:7f74831f502ca1b20be096"
};

var db = null, _dataCache = {}, CURRENT_USER = null, CURRENT_TAB = 'cashier';
var cart = [], pendingPurchaseItems = [], html5QrCode = null, liveMonitorInterval = null;
var booted = false, loadedKeys = {}, checkoutBusy = false, currentInvoiceBody = '';
var cashierSearchValue = '';

/* ---------- safety net ---------- */
window.onerror = function(msg, url, line){
  console.error('Global error:', msg, 'line', line);
  try{ document.getElementById('modalOverlay').style.display='none'; }catch(e){}
  try{ closeBarcodeScanner(); }catch(e){}
};

/* ---------- helpers ---------- */
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function fmt(n){ return (parseFloat(n)||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function genId(p){ return (p||'id')+'_'+Date.now()+'_'+Math.floor(Math.random()*100000); }
function isAdmin(){ return CURRENT_USER && CURRENT_USER.role==='admin'; }
function sameMonth(iso){ var d=new Date(iso),n=new Date(); return d.getMonth()===n.getMonth()&&d.getFullYear()===n.getFullYear(); }
function sameDay(iso){ return new Date(iso).toDateString()===new Date().toDateString(); }
function payLabel(m){ return m==='cash'?'💵 نقدي':(m==='vodafone'?'💳 فودافون كاش':'💳 انستاباي'); }

/* ---------- boot ---------- */
window.addEventListener('load', bootApp);
window.addEventListener('online', function(){ setConn(true); });
window.addEventListener('offline', function(){ setConn(false); });
function setConn(on){ var el=document.getElementById('connStatus'); if(el){ el.className='dot '+(on?'on':'off'); el.title=on?'متصل':'غير متصل'; } }

function bootApp(){
  try{
    firebase.initializeApp(firebaseConfig);
    db = firebase.firestore();
    db.enablePersistence({synchronizeTabs:true}).catch(function(e){ console.warn('persistence:', e.message); });
    SYNC_KEYS.forEach(function(key){
      db.collection('cashier_data').doc(key).onSnapshot(function(doc){
        if(doc.exists && doc.data() && doc.data().v!==undefined) _dataCache[key]=doc.data().v;
        else _dataCache[key]=defaultValueFor(key);
        loadedKeys[key]=true;
        onKeyLoaded();
      }, function(err){
        console.error('listen error', key, err);
        if(_dataCache[key]===undefined) _dataCache[key]=defaultValueFor(key);
        loadedKeys[key]=true; onKeyLoaded();
      });
    });
    setTimeout(function(){ if(!booted){ SYNC_KEYS.forEach(function(k){ if(_dataCache[k]===undefined) _dataCache[k]=defaultValueFor(k); loadedKeys[k]=true; }); onKeyLoaded(); } }, 15000);
  }catch(e){
    document.getElementById('loadingOverlay').innerHTML='<div style="padding:20px;text-align:center">❌ تعذر الاتصال بقاعدة البيانات:<br>'+esc(e.message)+'<br><br>تأكد من اتصال الإنترنت وافتح الرابط الرسمي.</div>';
  }
}
function onKeyLoaded(){
  if(!booted){
    for(var i=0;i<SYNC_KEYS.length;i++){ if(!loadedKeys[SYNC_KEYS[i]]) return; }
    booted=true;
    document.getElementById('loadingOverlay').style.display='none';
    checkInitialAuth();
  } else {
    refreshCurrentView();
  }
}
/* realtime refresh: never touches the screen while a modal/scanner is open */
function refreshCurrentView(){
  if(!CURRENT_USER) return;
  if(document.getElementById('modalOverlay').style.display==='flex') return;
  if(document.getElementById('scannerOverlay').style.display==='flex') return;
  var t=CURRENT_TAB;
  if(t==='cashier') renderCashierGrid();
  else if(t==='live') return;
  else renderTab(t);
}

function defaultValueFor(key){
  if(key==='cashier_wallets') return {vodafone:0,instapay:0};
  if(key==='cashier_safe') return {balance:0};
  if(key==='invoice_counter'||key==='purchase_counter'||key==='wallet_counter') return 0;
  return [];
}
function load(key){ return _dataCache[key]!==undefined?_dataCache[key]:defaultValueFor(key); }
function save(key,val){
  _dataCache[key]=val;
  if(db) db.collection('cashier_data').doc(key).set({v:val,updatedAt:Date.now()}).catch(function(e){ console.error('save error',key,e); });
}

/* ---------- data accessors ---------- */
function getUsers(){ return (load('cashier_users')||[]).slice(); } function saveUsers(v){ save('cashier_users',v); }
function getProducts(){ return (load('cashier_products')||[]).slice(); } function saveProducts(v){ save('cashier_products',v); }
function getSales(){ return (load('cashier_sales')||[]).slice(); } function saveSales(v){ save('cashier_sales',v); }
function getPurchases(){ return (load('cashier_purchases')||[]).slice(); } function savePurchases(v){ save('cashier_purchases',v); }
function getSuppliers(){ return (load('cashier_suppliers')||[]).slice(); } function saveSuppliers(v){ save('cashier_suppliers',v); }
function getDisbursements(){ return (load('cashier_disbursements')||[]).slice(); } function saveDisbursements(v){ save('cashier_disbursements',v); }
function getShifts(){ return (load('cashier_shifts')||[]).slice(); } function saveShifts(v){ save('cashier_shifts',v); }
function getStockAdjustments(){ return (load('cashier_stock_adjustments')||[]).slice(); } function saveStockAdjustments(v){ save('cashier_stock_adjustments',v); }
function getWallets(){ return Object.assign({vodafone:0,instapay:0},load('cashier_wallets')); }
function getWalletTx(){ return (load('cashier_wallet_transactions')||[]).slice(); } function saveWalletTx(v){ save('cashier_wallet_transactions',v); }
function getSafe(){ return Object.assign({balance:0},load('cashier_safe')); }
function getSafeTransactions(){ return (load('cashier_safe_transactions')||[]).slice(); } function saveSafeTransactions(v){ save('cashier_safe_transactions',v); }
function getReturns(){ return (load('cashier_returns')||[]).slice(); } function saveReturns(v){ save('cashier_returns',v); }
function getDamages(){ return (load('cashier_damages')||[]).slice(); } function saveDamages(v){ save('cashier_damages',v); }
function getActiveShift(){
  var s=getShifts();
  for(var i=0;i<s.length;i++){ if(s[i].cashierName===CURRENT_USER.displayName && !s[i].closed) return s[i]; }
  return null;
}

/* ---------- atomic balance helpers ---------- */
function adjustSafeBalance(delta, txEntry){
  var ref=db.collection('cashier_data').doc('cashier_safe');
  return db.runTransaction(function(t){
    return t.get(ref).then(function(doc){
      var cur=0;
      if(doc.exists && doc.data() && doc.data().v && typeof doc.data().v.balance==='number') cur=doc.data().v.balance;
      var next=cur+delta;
      t.set(ref,{v:{balance:next},updatedAt:Date.now()});
      return next;
    });
  }).then(function(nb){
    _dataCache['cashier_safe']={balance:nb};
    if(txEntry){ var tx=getSafeTransactions(); tx.push(txEntry); saveSafeTransactions(tx); }
    if(CURRENT_TAB==='safe' && document.getElementById('modalOverlay').style.display!=='flex') renderSafe();
    return nb;
  });
}
function adjustWalletBalance(wallet, delta, txEntry){
  var ref=db.collection('cashier_data').doc('cashier_wallets');
  return db.runTransaction(function(t){
    return t.get(ref).then(function(doc){
      var cur={vodafone:0,instapay:0};
      if(doc.exists && doc.data() && doc.data().v) cur=doc.data().v;
      var next=(cur[wallet]||0)+delta;
      var obj={vodafone:wallet==='vodafone'?next:(cur.vodafone||0), instapay:wallet==='instapay'?next:(cur.instapay||0)};
      t.set(ref,{v:obj,updatedAt:Date.now()});
      return next;
    });
  }).then(function(nb){
    var w=getWallets(); w[wallet]=nb; _dataCache['cashier_wallets']=w;
    if(txEntry){ var tx=getWalletTx(); tx.push(txEntry); saveWalletTx(tx); }
    if(CURRENT_TAB==='wallets' && document.getElementById('modalOverlay').style.display!=='flex') renderWallets();
    return nb;
  });
}
function nextCounter(key, start){
  var ref=db.collection('cashier_data').doc(key);
  return db.runTransaction(function(t){
    return t.get(ref).then(function(doc){
      var n=start;
      if(doc.exists && doc.data() && doc.data().v) n=doc.data().v+1;
      t.set(ref,{v:n,updatedAt:Date.now()});
      return n;
    });
  });
}

/* ---------- auth ---------- */
function checkInitialAuth(){
  var users=getUsers();
  if(users.length===0){
    users=[{id:'u1',username:'MOHAMED NAZIH',displayName:'MOHAMED NAZIH',role:'admin',password:'admin123'},
           {id:'u2',username:'ABDALLAH',displayName:'ABDALLAH',role:'cashier',password:'cashier123'}];
    saveUsers(users);
  }
  var saved=sessionStorage.getItem('current_user');
  if(saved){ try{ CURRENT_USER=JSON.parse(saved); }catch(e){ CURRENT_USER=null; } }
  if(CURRENT_USER){
    var fresh=getUsers().filter(function(u){ return u.id===CURRENT_USER.id; })[0];
    if(!fresh){ CURRENT_USER=null; sessionStorage.removeItem('current_user'); }
  }
  if(!CURRENT_USER) renderLogin(); else renderApp();
}
function renderLogin(){
  document.getElementById('tabsNav').style.display='none';
  document.getElementById('topbarUserArea').innerHTML='<span class="dot on" id="connStatus"></span><span style="font-size:13px;font-weight:700">تسجيل الدخول</span>';
  document.getElementById('viewContainer').innerHTML=
   '<div style="max-width:400px;margin:40px auto" class="card"><div style="text-align:center;margin-bottom:18px"><div style="font-size:48px">🛒</div><h2 style="color:var(--pd);font-weight:900">زين ماركت</h2><p class="note">اختر المستخدم وادخل كلمة المرور</p></div>'+
   '<form onsubmit="doLogin(event)"><div class="form-group"><label>المستخدم</label><select id="loginUserSelect" class="form-control">'+
   getUsers().map(function(u){ return '<option value="'+u.id+'">'+esc(u.displayName)+' ('+(u.role==='admin'?'مدير':'كاشير')+')</option>'; }).join('')+
   '</select></div><div class="form-group"><label>كلمة المرور</label><input type="password" id="loginPass" class="form-control" required></div>'+
   '<button type="submit" class="btn btn-primary" style="width:100%;padding:12px;font-size:16px">🔑 دخول</button></form></div>';
}
function doLogin(e){
  e.preventDefault();
  var uid=document.getElementById('loginUserSelect').value, pass=document.getElementById('loginPass').value;
  var u=getUsers().filter(function(x){ return x.id===uid; })[0];
  if(u && u.password===pass){ CURRENT_USER=u; sessionStorage.setItem('current_user',JSON.stringify(u)); CURRENT_TAB='cashier'; renderApp(); }
  else alert('كلمة المرور غير صحيحة!');
}
function doLogout(){
  if(!confirm('هل تريد تسجيل الخروج؟')) return;
  CURRENT_USER=null; sessionStorage.removeItem('current_user');
  window.location.replace(window.location.pathname);
}
function renderApp(){
  document.getElementById('topbarUserArea').innerHTML=
   '<span class="dot on" id="connStatus" title="متصل"></span><div class="user-info"><div class="name">'+esc(CURRENT_USER.displayName)+'</div><span class="role-badge">'+(isAdmin()?'👑 مدير النظام':'💰 كاشير')+'</span></div><button class="btn btn-danger btn-sm" onclick="doLogout()">خروج 🚪</button>';
  setConn(navigator.onLine!==false);
  var allowed=ROLE_PERMISSIONS[CURRENT_USER.role]||[];

/* =================== CASHIER =================== */
function computeCart(){
  var subtotal=cart.reduce(function(s,i){ return s+i.price*i.qty; },0);
  var dEl=document.getElementById('cartDiscount'), tEl=document.getElementById('cartTax');
  var dp=dEl?(parseFloat(dEl.value)||0):0, tp=tEl?(parseFloat(tEl.value)||0):0;
  var da=subtotal*dp/100, ta=(subtotal-da)*tp/100;
  return {subtotal:subtotal,discountPercent:dp,taxPercent:tp,discountAmount:da,taxAmount:ta,total:subtotal-da+ta};
}
function renderCashier(){
  var sEl=document.getElementById('cashierSearch'); if(sEl) cashierSearchValue=sEl.value;
  var dEl=document.getElementById('cartDiscount'), tEl=document.getElementById('cartTax');
  var keepD=dEl?dEl.value:0, keepT=tEl?tEl.value:0;
  var pmEl=document.getElementById('checkoutPayMethod'), keepPM=pmEl?pmEl.value:'cash';
  var shift=getActiveShift(), banner;
  if(shift){
    var st=calcShiftStats(shift);
    banner='<div class="card" style="background:#e8f5e9;border-right:6px solid var(--pg);padding:14px"><div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px"><div><h3 style="font-weight:800;color:var(--pd)">🟢 الشيفت مفتوح</h3><div style="font-size:13px;margin-top:4px">بداية: <b>'+new Date(shift.startTime).toLocaleTimeString('ar-EG')+'</b> | عهدة البداية: <b>'+fmt(shift.openingAmount)+' ج</b> | المتوقع بالدرج الآن: <b>'+fmt(st.expected)+' ج</b></div></div><button class="btn btn-warning" onclick="openEndShiftModal()">🔒 إنهاء الشيفت</button></div></div>';
  } else {
    banner='<div class="card" style="background:#ffebee;border-right:6px solid var(--red);padding:14px"><div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px"><div><h3 style="font-weight:800;color:var(--red)">🔴 لا يوجد شيفت مفتوح</h3><div style="font-size:13px;margin-top:4px">افتح شيفت (عهدة البداية) عشان تقدر تبيع</div></div><button class="btn btn-primary" onclick="openStartShiftModal()">🔑 فتح شيفت جديد</button></div></div>';
  }
  var rows=cart.length===0?'<tr><td colspan="5" style="text-align:center;color:var(--mu);padding:26px">السلة فاضية.. اضغط على منتج لإضافته 🛒</td></tr>':
    cart.map(function(it,i){
      return '<tr><td style="font-weight:700">'+esc(it.name)+'</td><td>'+fmt(it.price)+'</td><td><input type="number" step="any" value="'+it.qty+'" style="width:64px;text-align:center" class="form-control" onchange="updateCartQty('+i+',this.value)"></td><td style="font-weight:800;color:var(--pg)">'+fmt(it.price*it.qty)+'</td><td><button class="btn btn-danger btn-sm" onclick="removeFromCart('+i+')">✖</button></td></tr>';
    }).join('');
  // temporarily compute totals using kept values
  var subtotal=cart.reduce(function(s,i){ return s+i.price*i.qty; },0);
  var dp=parseFloat(keepD)||0, tp=parseFloat(keepT)||0, da=subtotal*dp/100, ta=(subtotal-da)*tp/100, gt=subtotal-da+ta;
  document.getElementById('viewContainer').innerHTML=banner+
  '<div class="cashier-split"><div class="cashier-cart-panel card"><div class="card-title"><span>🧾 الفاتورة الحالية</span><button class="btn btn-danger btn-sm" onclick="clearCart()">تفريغ 🗑️</button></div>'+
  '<div class="table-responsive" style="max-height:300px;overflow-y:auto;margin-bottom:12px"><table><thead><tr><th>المنتج</th><th>السعر</th><th>الكمية</th><th>الإجمالي</th><th></th></tr></thead><tbody>'+rows+'</tbody></table></div>'+
  '<div style="background:#f8f9fa;padding:12px;border-radius:10px;border:1px solid var(--bd)">'+
  '<div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px"><span>المجموع الفرعي:</span><b>'+fmt(subtotal)+' ج</b></div>'+
  '<div style="display:flex;gap:10px;margin-bottom:8px"><div style="flex:1"><label style="font-size:11px;font-weight:700">خصم %</label><input type="number" id="cartDiscount" min="0" max="100" value="'+dp+'" class="form-control" onchange="renderCashier()"></div><div style="flex:1"><label style="font-size:11px;font-weight:700">ضريبة %</label><input type="number" id="cartTax" min="0" max="100" value="'+tp+'" class="form-control" onchange="renderCashier()"></div></div>'+
  '<div style="display:flex;justify-content:space-between;font-size:20px;font-weight:900;color:var(--pd);border-top:2px solid var(--bd);padding-top:8px"><span>الإجمالي:</span><span>'+fmt(gt)+' ج</span></div>'+
  '<div class="form-group" style="margin-top:10px"><label>طريقة الدفع</label><select id="checkoutPayMethod" class="form-control"><option value="cash">💵 نقدي (الدرج)</option><option value="vodafone">💳 فودافون كاش</option><option value="instapay">💳 انستاباي</option></select></div>'+
  '<button class="btn btn-primary" style="width:100%;padding:13px;font-size:17px" onclick="processCheckout()" '+(cart.length===0?'disabled':'')+'>✅ إنهاء الفاتورة والدفع</button></div></div>'+
  '<div class="cashier-products-panel card"><div class="card-title"><span>🛒 المنتجات</span><button class="btn btn-outline btn-sm" onclick="scanForCashier()">📷 مسح باركود</button></div>'+
  '<div class="form-group"><input type="text" id="cashierSearch" class="form-control" placeholder="🔍 ابحث بالاسم أو الباركود..." value="'+esc(cashierSearchValue)+'" oninput="renderCashierGrid()"></div><div class="prod-grid" id="cashierGrid"></div></div></div>';
  document.getElementById('checkoutPayMethod').value=keepPM;
  renderCashierGrid();
}
function renderCashierGrid(){
  var grid=document.getElementById('cashierGrid'); if(!grid) return;
  var q=(document.getElementById('cashierSearch').value||'').trim().toLowerCase();
  var list=getProducts().filter(function(p){ return (p.name||'').toLowerCase().indexOf(q)>-1 || (p.barcode && String(p.barcode).indexOf(q)>-1); });
  if(!list.length){ grid.innerHTML='<div style="grid-column:1/-1;text-align:center;padding:26px;color:var(--mu)">لا توجد منتجات مطابقة</div>'; return; }
  grid.innerHTML=list.map(function(p){
    var min=p.minStock||5, cls=p.stock<=0?'out':(p.stock<=min?'low':'');
    var badge=p.stock<=0?'<span class="badge badge-red">نفذ</span>':(p.stock<=min?'<span class="badge badge-orange">منخفض</span>':'');
    return '<div class="prod-card '+cls+'" onclick="addToCart(\''+p.id+'\')"><div class="p-name">'+esc(p.name)+'</div><div class="p-price">'+fmt(p.price)+' ج</div><div class="p-stock">المخزون: <b>'+p.stock+'</b> '+badge+'</div></div>';
  }).join('');
}
function addToCart(pid){
  if(!getActiveShift()){ alert('لازم تفتح شيفت الأول عشان تقدر تبيع!'); return; }
  var p=getProducts().filter(function(x){ return x.id===pid; })[0];
  if(!p){ alert('المنتج غير موجود، اضغط تحديث الصفحة.'); return; }
  var ex=cart.filter(function(i){ return i.productId===pid; })[0];
  if(ex) ex.qty+=1; else cart.push({productId:p.id,name:p.name,price:p.price,costPrice:p.costPrice||0,qty:1});
  renderCashier();
}
function updateCartQty(i,v){ var q=parseFloat(v); if(isNaN(q)||q<=0) cart.splice(i,1); else cart[i].qty=q; renderCashier(); }
function removeFromCart(i){ cart.splice(i,1); renderCashier(); }
function clearCart(){ cart=[]; renderCashier(); }

function processCheckout(){
  if(checkoutBusy) return;
  var shift=getActiveShift();
  if(!shift){ alert('لا يوجد شيفت مفتوح!'); return; }
  if(!cart.length){ alert('السلة فاضية!'); return; }
  var pay=document.getElementById('checkoutPayMethod').value;
  var c=computeCart();
  var gross=cart.reduce(function(s,i){ return s+(i.price-i.costPrice)*i.qty; },0);
  var profit=gross-c.discountAmount;
  var items=cart.map(function(i){ return {productId:i.productId,name:i.name,price:i.price,costPrice:i.costPrice,qty:i.qty}; });
  checkoutBusy=true;
  nextCounter('invoice_counter',1001).then(function(n){
    var code='INV-'+n;
    var sale={id:genId('sale'),invoiceNum:code,date:new Date().toISOString(),items:items,subtotal:c.subtotal,discountPercent:c.discountPercent,taxPercent:c.taxPercent,total:c.total,soldBy:CURRENT_USER.displayName,paymentMethod:pay,shiftId:shift.id,profit:profit};
    var products=getProducts();
    items.forEach(function(it){ var p=products.filter(function(x){ return x.id===it.productId; })[0]; if(p) p.stock-=it.qty; /* allowed to go negative intentionally */ });
    saveProducts(products);
    var sales=getSales(); sales.push(sale); saveSales(sales);
    if(pay!=='cash'){
      adjustWalletBalance(pay,c.total,{id:genId('wtx'),wallet:pay,operation:'sale',amount:c.total,commission:0,date:new Date().toISOString(),user:CURRENT_USER.displayName,note:'مبيعات فاتورة '+code}).catch(function(e){ alert('تم حفظ الفاتورة لكن تعذر تحديث رصيد المحفظة: '+e.message); });
    }
    cart=[]; checkoutBusy=false;
    renderCashier();
    showInvoice(sale);
  }).catch(function(e){ checkoutBusy=false; alert('حدث خطأ أثناء حفظ الفاتورة: '+e.message); });
}

/* ---------- shifts ---------- */
function calcShiftStats(shift){
  try{
    var sales=getSales().filter(function(s){ return s.shiftId===shift.id; });
    var cash=sales.filter(function(s){ return s.paymentMethod==='cash'; }).reduce(function(a,s){ return a+s.total; },0);
    var wal=sales.filter(function(s){ return s.paymentMethod!=='cash'; }).reduce(function(a,s){ return a+s.total; },0);
    var exp=getDisbursements().filter(function(d){ return d.status==='approved'&&d.source==='drawer'&&d.shiftId===shift.id; }).reduce(function(a,d){ return a+d.amount; },0);
    var ret=getReturns().filter(function(r){ return r.source==='drawer'&&r.shiftId===shift.id; }).reduce(function(a,r){ return a+(r.refundAmount||0); },0);
    return {cashSalesTotal:cash,walletCashTotal:wal,expensesTotal:exp,returnsTotal:ret,expected:(shift.openingAmount||0)+cash-exp-ret+wal,salesCount:sales.length};
  }catch(e){ return {cashSalesTotal:0,walletCashTotal:0,expensesTotal:0,returnsTotal:0,expected:shift.openingAmount||0,salesCount:0}; }
}
function openStartShiftModal(){
  openModal('🔑 فتح شيفت جديد','<form onsubmit="confirmStartShift(event)"><div class="form-group"><label>مبلغ بداية الشيفت (العهدة بالدرج)</label><input type="number" id="shiftOpeningAmt" step="any" min="0" value="0" class="form-control" required></div><button type="submit" class="btn btn-primary" style="width:100%;padding:10px">🚀 فتح الشيفت</button></form>');

function confirmStartShift(e){
  e.preventDefault();
  try{
    if(getActiveShift()){ closeModal(); renderCashier(); return; }
    var o=parseFloat(document.getElementById('shiftOpeningAmt').value)||0;
    var s=getShifts();
    s.push({id:genId('shift'),cashierName:CURRENT_USER.displayName,openingAmount:o,startTime:new Date().toISOString(),endTime:null,closingAmount:0,closed:false,expectedAmount:o,difference:0});
    saveShifts(s); closeModal(); renderCashier(); alert('تم فتح الشيفت! تقدر تبدأ البيع.');
  }catch(err){ alert('خطأ أثناء فتح الشيفت: '+err.message); closeModal(); }
}
function openEndShiftModal(){
  var sh=getActiveShift(); if(!sh) return;
  var st=calcShiftStats(sh);
  openModal('🔒 إنهاء الشيفت','<div style="background:#e8f5e9;padding:12px;border-radius:8px;margin-bottom:12px;font-size:13px;line-height:1.9"><div>عهدة البداية: <b>'+fmt(sh.openingAmount)+' ج</b></div><div>مبيعات نقدية: <b>'+fmt(st.cashSalesTotal)+' ج</b></div><div>مبيعات المحافظ: <b>'+fmt(st.walletCashTotal)+' ج</b></div><div style="color:var(--red)">مصروفات معتمدة (الدرج): <b>-'+fmt(st.expensesTotal)+' ج</b></div><div style="color:var(--red)">مرتجعات (الدرج): <b>-'+fmt(st.returnsTotal)+' ج</b></div><div style="font-size:16px;font-weight:900;color:var(--pd);border-top:1px solid #ccc;margin-top:6px;padding-top:4px">المتوقع بالدرج: '+fmt(st.expected)+' ج</div></div>'+
  '<form onsubmit="confirmEndShift(event)"><div class="form-group"><label>المبلغ الفعلي بالدرج (بعد العد)</label><input type="number" id="shiftCloseAmt" step="any" min="0" class="form-control" required></div><p class="note" style="margin-bottom:10px">💡 المبلغ الفعلي بيتحول تلقائياً للخزنة بعد الإغلاق.</p><button type="submit" class="btn btn-warning" style="width:100%;padding:11px">🔒 إنهاء الشيفت وترحيل النقدية للخزنة</button></form>');
}
function confirmEndShift(e){
  e.preventDefault();
  try{
    var actual=parseFloat(document.getElementById('shiftCloseAmt').value)||0;
    var shifts=getShifts(), idx=-1;
    for(var i=0;i<shifts.length;i++){ if(shifts[i].cashierName===CURRENT_USER.displayName && !shifts[i].closed){ idx=i; break; } }
    if(idx===-1){ alert('لا يوجد شيفت مفتوح. ربما تم إنهاؤه من جهاز آخر.'); closeModal(); renderCashier(); return; }
    var sh=shifts[idx], st=calcShiftStats(sh);
    sh.closed=true; sh.endTime=new Date().toISOString(); sh.closingAmount=actual; sh.expectedAmount=st.expected; sh.difference=actual-st.expected;
    saveShifts(shifts); closeModal(); renderCashier();
    if(actual>0){
      adjustSafeBalance(actual,{id:genId('safetx'),type:'shift_close',amount:actual,description:'تحويل تلقائي من إغلاق شيفت '+sh.cashierName,date:new Date().toISOString(),user:sh.cashierName})
      .then(function(nb){ alert('تم إنهاء الشيفت، وتم تحويل '+fmt(actual)+' ج للخزنة تلقائياً.\nرصيد الخزنة الحالي: '+fmt(nb)+' ج'); })
      .catch(function(er){ alert('تم إنهاء الشيفت، لكن فشل تحويل المبلغ للخزنة بسبب مشكلة اتصال: '+er.message+'\nبلّغ المدير يضيف '+fmt(actual)+' ج يدوياً من تاب الخزنة.'); });
    } else alert('تم إنهاء الشيفت. (لا يوجد مبلغ لتحويله للخزنة)');
  }catch(err){ alert('خطأ أثناء إنهاء الشيفت: '+err.message); closeModal(); renderCashier(); }
}

function onPurProdSelectChange(id){
  if(!id) return;
  var p=getProducts().filter(function(x){ return x.id===id; })[0]; if(!p) return;
  document.getElementById('purProdName').value=p.name; document.getElementById('purCostPrice').value=p.costPrice||0;
  document.getElementById('purPrice').value=p.price||0; document.getElementById('purBarcode').value=p.barcode||'';
}
function onPurBarcodeChange(code){
  code=(code||'').trim(); if(!code) return;
  var p=getProducts().filter(function(x){ return x.barcode && String(x.barcode)===code; })[0];
  if(p){ document.getElementById('purSelectProd').value=p.id; onPurProdSelectChange(p.id); }
}
function addPurchaseItem(){
  var selId=document.getElementById('purSelectProd').value;
  var name=document.getElementById('purProdName').value.trim();
  var cost=parseFloat(document.getElementById('purCostPrice').value);
  var price=parseFloat(document.getElementById('purPrice').value);
  var qty=parseFloat(document.getElementById('purQty').value);
  var barcode=document.getElementById('purBarcode').value.trim();
  if(!name){ alert('اكتب اسم المنتج أو اختاره من القائمة'); return; }
  if(isNaN(cost)||cost<0){ alert('ادخل سعر تكلفة صحيح'); return; }
  if(isNaN(price)||price<0){ alert('ادخل سعر بيع صحيح'); return; }
  if(isNaN(qty)||qty<=0){ alert('ادخل كمية صحيحة'); return; }
  pendingPurchaseItems.push({productId:selId||null,name:name,costPrice:cost,price:price,qty:qty,barcode:barcode,subtotal:cost*qty});
  renderPendingPurItems();
  // clear everything so the next item can be entered right away
  document.getElementById('purSelectProd').value='';
  document.getElementById('purProdName').value='';
  document.getElementById('purCostPrice').value='';
  document.getElementById('purPrice').value='';
  document.getElementById('purQty').value='1';
  document.getElementById('purBarcode').value='';
  document.getElementById('purSelectProd').focus();
}
function removePurchaseItem(i){ pendingPurchaseItems.splice(i,1); renderPendingPurItems(); }
function renderPendingPurItems(){
  var tb=document.getElementById('pendingPurItemsTable'), tt=document.getElementById('pendingPurTotal'); if(!tb) return;
  if(!pendingPurchaseItems.length){ tb.innerHTML='<tr><td colspan="6" style="text-align:center;color:#888">لم تتم إضافة أصناف بعد</td></tr>'; if(tt) tt.innerText='0.00 ج'; return; }
  tb.innerHTML=pendingPurchaseItems.map(function(it,i){ return '<tr><td style="font-weight:700">'+esc(it.name)+'</td><td>'+fmt(it.costPrice)+'</td><td>'+fmt(it.price)+'</td><td>'+it.qty+'</td><td style="font-weight:800">'+fmt(it.subtotal)+'</td><td><button class="btn btn-danger btn-sm" onclick="removePurchaseItem('+i+')">✖</button></td></tr>'; }).join('');
  if(tt) tt.innerText=fmt(pendingPurchaseItems.reduce(function(a,b){ return a+b.subtotal; },0))+' ج';
}
function buildInstallments(total,count){
  var arr=[]; for(var i=1;i<=count;i++) arr.push({id:'inst_'+i,number:i,amount:total/count,paid:false,disbursementRequested:false}); return arr;
}
function submitPurchaseInvoice(){
  var sid=document.getElementById('purSupplierId').value;
  if(!sid){ alert('اختر المورد أولاً'); return; }
  if(!pendingPurchaseItems.length){ alert('أضف صنف واحد على الأقل'); return; }
  var sup=getSuppliers().filter(function(s){ return s.id===sid; })[0];
  var total=pendingPurchaseItems.reduce(function(a,b){ return a+b.subtotal; },0), admin=isAdmin();
  nextCounter('purchase_counter',1001).then(function(n){
    var pur={id:genId('pur'),purchaseNum:'PUR-'+n,supplierId:sid,supplierName:sup?sup.name:'غير محدد',items:pendingPurchaseItems.slice(),total:total,status:admin?'approved':'pending',requestedBy:CURRENT_USER.displayName,date:new Date().toISOString(),installments:(sup&&sup.type==='credit')?buildInstallments(total,3):null,approvedBy:admin?CURRENT_USER.displayName:null,approvedDate:admin?new Date().toISOString():null,rejectReason:null};
    var list=getPurchases(); list.push(pur); savePurchases(list);
    if(admin) applyPurchaseToStock(pur);
    pendingPurchaseItems=[]; closeModal(); renderPurchases();
    alert(admin?'تم حفظ فاتورة الشراء وتحديث المخزون!':'تم إرسال فاتورة الشراء وهي بانتظار اعتماد المدير.');
  }).catch(function(e){ alert('خطأ أثناء حفظ الفاتورة: '+e.message); });
}
function applyPurchaseToStock(pur){
  var products=getProducts();
  pur.items.forEach(function(it){
    var p=it.productId?products.filter(function(x){ return x.id===it.productId; })[0]:null;
    if(!p) p=products.filter(function(x){ return (x.name||'').toLowerCase()===it.name.toLowerCase(); })[0];
    if(p){ p.stock+=it.qty; p.costPrice=it.costPrice; p.price=it.price; if(it.barcode) p.barcode=it.barcode; }
    else products.push({id:genId('prod'),name:it.name,costPrice:it.costPrice,price:it.price,stock:it.qty,barcode:it.barcode||'',minStock:5,dateAdded:new Date().toISOString()});
  });
  saveProducts(products);
}

function submitReturn(e){
  e.preventDefault();
  var pid=document.getElementById('retProdId').value, qty=parseFloat(document.getElementById('retQty').value), amt=parseFloat(document.getElementById('retAmount').value)||0;
  var resalable=document.getElementById('retResalable').value==='true', source=document.getElementById('retSource').value, reason=document.getElementById('retReason').value.trim();
  var products=getProducts(), p=products.filter(function(x){ return x.id===pid; })[0]; if(!p||isNaN(qty)||qty<=0) return;
  var sh=getActiveShift(), before=p.stock, now=new Date().toISOString(), adj=getStockAdjustments();
  if(resalable){
    p.stock+=qty;
    adj.push({id:genId('adj'),productId:p.id,productName:p.name,qtyBefore:before,qtyAfter:p.stock,difference:qty,type:'increase',reason:'مرتجع سليم: '+reason,date:now,user:CURRENT_USER.displayName});
  }
  var rets=getReturns();
  rets.push({id:genId('ret'),productId:p.id,productName:p.name,qty:qty,price:p.price,costPrice:p.costPrice||0,refundAmount:amt,source:source,resalable:resalable,reason:reason,shiftId:sh?sh.id:null,processedBy:CURRENT_USER.displayName,date:now});
  saveReturns(rets);

    p.stock-=qty;
    var dl=getDamages();
    dl.push({id:genId('dam'),productId:p.id,productName:p.name,qty:qty,lossValue:(p.costPrice||0)*qty,reason:'تالف نتيجة مرتجع: '+reason,processedBy:CURRENT_USER.displayName,date:now});
    saveDamages(dl);

  }
  saveProducts(products); saveStockAdjustments(adj);
  if(source==='safe' && amt>0){
    adjustSafeBalance(-amt,{id:genId('safetx'),type:'return',amount:-amt,description:'رد مبلغ مرتجع: '+p.name,date:now,user:CURRENT_USER.displayName}).catch(function(er){ alert('تم تسجيل المرتجع لكن تعذر الخصم من الخزنة: '+er.message); });
  }

}

function adjustSingleProductStock(pid){

/* =================== PROFIT (admin) =================== */
function getProfitBreakdown(sales){
  var map={};
  sales.forEach(function(s){ s.items.forEach(function(i){
    var k=i.productId||i.name; if(!map[k]) map[k]={name:i.name,qty:0,revenue:0,cost:0,profit:0};
    map[k].qty+=i.qty; map[k].revenue+=i.price*i.qty; map[k].cost+=(i.costPrice||0)*i.qty; map[k].profit+=(i.price-(i.costPrice||0))*i.qty;
  }); });
  return Object.keys(map).map(function(k){ return map[k]; }).sort(function(a,b){ return b.profit-a.profit; });
}
function profitNumbers(){
  var sales=getSales(), todaySales=sales.filter(function(s){ return sameDay(s.date); }), monthSales=sales.filter(function(s){ return sameMonth(s.date); });
  var daily=todaySales.reduce(function(a,s){ return a+(s.profit||0); },0), gross=monthSales.reduce(function(a,s){ return a+(s.profit||0); },0);
  var exp=getDisbursements().filter(function(d){ return d.status==='approved'&&sameMonth(d.date); }).reduce(function(a,d){ return a+d.amount; },0);
  var dam=getDamages().filter(function(d){ return sameMonth(d.date); }).reduce(function(a,d){ return a+(d.lossValue||0); },0);
  var ret=getReturns().filter(function(r){ return sameMonth(r.date); }).reduce(function(a,r){ return a+((r.refundAmount||0)-(r.costPrice||0)*r.qty); },0);
  return {todaySales:todaySales,monthSales:monthSales,daily:daily,gross:gross,exp:exp,dam:dam,ret:ret,net:gross-exp-dam-ret};
}
function breakdownTable(rows){
  return '<div class="table-responsive"><table><thead><tr><th>المنتج</th><th>الكمية</th><th>المبيعات</th><th>التكلفة</th><th>الربح</th></tr></thead><tbody>'+
  (rows.length?rows.map(function(r){ return '<tr><td style="font-weight:700">'+esc(r.name)+'</td><td>'+r.qty+'</td><td>'+fmt(r.revenue)+'</td><td>'+fmt(r.cost)+'</td><td style="font-weight:800;color:var(--pd)">'+fmt(r.profit)+'</td></tr>'; }).join(''):'<tr><td colspan="5" style="text-align:center;padding:14px;color:var(--mu)">لا توجد مبيعات</td></tr>')+'</tbody></table></div>';
}
function renderProfit(){
  if(!isAdmin()) return;
  var n=profitNumbers();
  document.getElementById('viewContainer').innerHTML=
  '<div class="stats-grid"><div class="stat-card blue"><div class="title">ربح اليوم (بيع - تكلفة)</div><div class="value">'+fmt(n.daily)+' ج</div></div><div class="stat-card"><div class="title">إجمالي ربح الشهر</div><div class="value">'+fmt(n.gross)+' ج</div></div><div class="stat-card orange"><div class="title">مصروفات معتمدة (الشهر)</div><div class="value">-'+fmt(n.exp)+' ج</div></div><div class="stat-card orange"><div class="title">خسائر التوالف (الشهر)</div><div class="value">-'+fmt(n.dam)+' ج</div></div><div class="stat-card orange"><div class="title">أثر المرتجعات (الشهر)</div><div class="value">-'+fmt(n.ret)+' ج</div></div><div class="stat-card '+(n.net>=0?'':'red')+'"><div class="title">صافي ربح الشهر</div><div class="value" style="color:'+(n.net>=0?'var(--pd)':'var(--red)')+'">'+fmt(n.net)+' ج</div></div></div>'+
  '<div class="card"><div class="card-title"><span>📅 تفاصيل ربح اليوم</span><button class="btn btn-outline btn-sm" onclick="exportProfitExcel(\'daily\')">⬇️ Excel يومي</button></div>'+breakdownTable(getProfitBreakdown(n.todaySales))+'</div>'+
  '<div class="card"><div class="card-title"><span>🗓️ تفاصيل ربح الشهر</span><button class="btn btn-outline btn-sm" onclick="exportProfitExcel(\'monthly\')">⬇️ Excel شهري</button></div>'+breakdownTable(getProfitBreakdown(n.monthSales))+'<p class="note" style="margin-top:10px;line-height:1.7">صافي الربح الشهري = ربح المبيعات ('+fmt(n.gross)+') - المصروفات ('+fmt(n.exp)+') - التوالف ('+fmt(n.dam)+') - أثر المرتجعات ('+fmt(n.ret)+') = <b>'+fmt(n.net)+' ج</b></p></div>';
}
function exportProfitExcel(period){
  if(!isAdmin()) return;
  var n=profitNumbers(), rows=getProfitBreakdown(period==='daily'?n.todaySales:n.monthSales).map(function(r){ return {'المنتج':r.name,'الكمية':r.qty,'المبيعات':r.revenue,'التكلفة':r.cost,'الربح':r.profit}; });
  if(period==='monthly'){
    rows.push({}); rows.push({'المنتج':'إجمالي ربح المبيعات','الربح':n.gross}); rows.push({'المنتج':'المصروفات المعتمدة','الربح':-n.exp}); rows.push({'المنتج':'خسائر التوالف','الربح':-n.dam}); rows.push({'المنتج':'أثر المرتجعات','الربح':-n.ret}); rows.push({'المنتج':'صافي الربح','الربح':n.net});
  }
  exportToExcel(rows,period==='daily'?'أرباح_اليوم':'أرباح_الشهر');
}

/* =================== BARCODE =================== */
function openBarcodeScanner(onResult){
  document.getElementById('scannerOverlay').style.display='flex';
  try{
    if(html5QrCode){ try{ html5QrCode.stop().catch(function(){}); }catch(e){} }
    html5QrCode=new Html5Qrcode('interactiveScanner');
    html5QrCode.start({facingMode:'environment'},{fps:10,qrbox:{width:250,height:150}},function(text){ closeBarcodeScanner(); onResult(text); },function(){})
    .catch(function(err){ alert('تعذر فتح الكاميرا: '+(err&&err.message?err.message:err)+'\nتأكد من السماح بالكاميرا وإنك فاتح الموقع عبر https.'); closeBarcodeScanner(); });
  }catch(e){ alert('خطأ في الماسح: '+e.message); closeBarcodeScanner(); }
}
function closeBarcodeScanner(){
  try{ if(html5QrCode){ html5QrCode.stop().then(function(){ html5QrCode.clear(); }).catch(function(){}); } }catch(e){}
  var el=document.getElementById('scannerOverlay'); if(el) el.style.display='none';
}
function scanForCashier(){
  openBarcodeScanner(function(code){
    var p=getProducts().filter(function(x){ return x.barcode && String(x.barcode)===String(code); })[0];
    if(p) addToCart(p.id); else alert('لا يوجد منتج بهذا الباركود: '+code);
  });
}
function scanIntoField(id){
  openBarcodeScanner(function(code){
    var el=document.getElementById(id); if(el){ el.value=code; if(id==='purBarcode') onPurBarcodeChange(code); }
  });
}
function scanForInventoryAdjust(){
  openBarcodeScanner(function(code){
    var p=getProducts().filter(function(x){ return x.barcode && String(x.barcode)===String(code); })[0];
    if(p) adjustSingleProductStock(p.id); else alert('لا يوجد منتج بهذا الباركود: '+code);
  });
}

/* =================== EXCEL =================== */
function exportToExcel(data,name){
  if(!data||!data.length){ alert('لا توجد بيانات للتصدير!'); return; }
  if(typeof XLSX==='undefined'){ alert('مكتبة الإكسيل لم تُحمّل. تأكد من الإنترنت وأعد تحميل الصفحة.'); return; }
  try{
    var ws=XLSX.utils.json_to_sheet(data), wb=XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb,ws,'البيانات');
    XLSX.writeFile(wb,name+'_'+new Date().toISOString().slice(0,10)+'.xlsx');
  }catch(e){ alert('خطأ أثناء التصدير: '+e.message); }
}
</script>
</body>
</html>
