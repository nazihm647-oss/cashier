<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>زين ماركت - نظام الكاشير</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'Cairo',sans-serif;}
body{background:#f1f6f2;color:#1c1c1c;}
#loadingScreen{position:fixed;inset:0;background:#145c30;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;}
.spinner{width:50px;height:50px;border:5px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin 1s linear infinite;margin-bottom:15px;}
@keyframes spin{to{transform:rotate(360deg);}}
.hidden{display:none !important;}
#loginScreen{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#1e8e4a,#145c30);}
.login-box{background:#fff;padding:35px;border-radius:16px;width:340px;box-shadow:0 10px 30px rgba(0,0,0,.2);text-align:center;}
.login-box h2{margin-bottom:5px;color:#145c30;}
.login-box p{color:#888;font-size:13px;margin-bottom:20px;}
.login-logo{width:70px;height:70px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font-size:36px;margin:0 auto 10px;box-shadow:0 2px 10px rgba(0,0,0,.15);}
input,select,textarea,button{font-family:'Cairo',sans-serif;font-size:14px;}
.input{width:100%;padding:10px;margin:8px 0;border:1px solid #ccc;border-radius:8px;outline:none;}
.input:focus{border-color:#1e8e4a;}
.btn{padding:10px 16px;border:none;border-radius:8px;cursor:pointer;font-weight:700;transition:.15s;}
.btn:hover{filter:brightness(1.08);}
.btn-primary{background:#1e8e4a;color:#fff;}
.btn-secondary{background:#e3e3e3;color:#333;}
.btn-danger{background:#d9362e;color:#fff;}
.btn-warn{background:#e3a008;color:#fff;}
.btn-block{width:100%;}
.btn-sm{padding:5px 10px;font-size:12px;border-radius:6px;}
#topbar{background:linear-gradient(135deg,#1e8e4a,#145c30);color:#fff;padding:10px 18px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;}
.brand{display:flex;align-items:center;gap:10px;}
.brand-logo{width:46px;height:46px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font-size:24px;}
.brand-text h1{font-size:18px;}
.brand-text span{font-size:11px;opacity:.85;}
.top-right{display:flex;align-items:center;gap:10px;font-size:13px;flex-wrap:wrap;}
#connStatus{padding:3px 10px;border-radius:12px;font-size:11px;background:rgba(255,255,255,.2);}
#tabsNav{display:flex;flex-wrap:wrap;background:#fff;border-bottom:2px solid #e3e3e3;padding:0 10px;}
.tab-btn{padding:12px 16px;border:none;background:none;cursor:pointer;font-weight:700;color:#555;border-bottom:3px solid transparent;}
.tab-btn.active{color:#1e8e4a;border-color:#1e8e4a;}
#tabContent{padding:16px;max-width:1300px;margin:0 auto;}
.card{background:#fff;border-radius:12px;padding:16px;box-shadow:0 1px 4px rgba(0,0,0,.08);margin-bottom:16px;}
.stats-row{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:16px;}
.stat-card{flex:1;min-width:160px;background:#fff;border-radius:12px;padding:14px;box-shadow:0 1px 4px rgba(0,0,0,.08);text-align:center;}
.stat-card h3{font-size:22px;color:#145c30;}
.stat-card p{font-size:12px;color:#777;margin-top:4px;}
table{width:100%;border-collapse:collapse;font-size:13px;}
th,td{padding:8px;text-align:right;border-bottom:1px solid #eee;}
th{background:#f6f9f6;color:#333;}
tr.out{background:#fde2e1;}
tr.low{background:#fff3da;}
.badge{padding:3px 10px;border-radius:12px;font-size:11px;font-weight:700;}
.badge-green{background:#d9f3df;color:#145c30;}
.badge-red{background:#fde2e1;color:#8a1f18;}
.badge-orange{background:#fff0d6;color:#8a5a00;}
.badge-blue{background:#d3e9fb;color:#14507c;}
.badge-gray{background:#eee;color:#555;}
.badge-purple{background:#e9dcf9;color:#4a1f8a;}
.product-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;}
.product-card{background:#fff;border-radius:10px;padding:10px;text-align:center;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.1);border:2px solid transparent;}
.product-card:hover{border-color:#1e8e4a;}
.product-card.out{background:#fde2e1;}
.product-card.low{background:#fff3da;}
.product-card h4{font-size:13px;margin-bottom:4px;}
.product-card p{font-size:12px;color:#555;}
.cashier-split{display:flex;gap:14px;align-items:flex-start;}
.cashier-cart-panel{flex:1;position:sticky;top:10px;max-height:85vh;overflow-y:auto;}
.cashier-products-panel{flex:1;}
@media(max-width:860px){.cashier-split{flex-direction:column;}.cashier-cart-panel{position:static;max-height:none;}}
.cart-line{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid #eee;font-size:13px;}
.qty-ctrl{display:flex;align-items:center;gap:6px;}
.qty-ctrl button{width:24px;height:24px;border:none;background:#eee;border-radius:5px;cursor:pointer;}
#modalOverlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:5000;}
.modal-box{background:#fff;border-radius:12px;padding:20px;width:420px;max-width:92vw;max-height:88vh;overflow-y:auto;position:relative;}
.modal-x-close{position:absolute;top:10px;left:10px;background:#eee;border:none;width:28px;height:28px;border-radius:50%;cursor:pointer;font-weight:700;}
#scannerOverlay{position:fixed;inset:0;background:rgba(0,0,0,.85);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:6000;}
#scannerContainer{width:300px;max-width:90vw;background:#fff;border-radius:10px;overflow:hidden;}
.form-row{margin-bottom:10px;}
.form-row label{display:block;font-size:12px;color:#555;margin-bottom:3px;}
.flex-between{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;}
.search-bar{display:flex;gap:8px;margin-bottom:12px;}
.note{font-size:12px;color:#777;margin:8px 0;}
.danger-zone{border:2px dashed #d9362e;border-radius:10px;padding:14px;margin-top:20px;}
.danger-zone h3{color:#d9362e;margin-bottom:8px;}
</style>
</head>
<body>

<div id="loadingScreen"><div class="spinner"></div><div>جاري تحميل البيانات...</div></div>

<div id="loginScreen" class="hidden">
  <div class="login-box">
    <div class="login-logo">🛒</div>
    <h2>زين ماركت</h2>
    <p>نظام إدارة الكاشير</p>
    <input class="input" id="loginUser" placeholder="اسم المستخدم">
    <input class="input" id="loginPass" type="password" placeholder="كلمة المرور">
    <button class="btn btn-primary btn-block" onclick="doLogin()">دخول</button>
    <div id="loginError" style="color:#d9362e;font-size:12px;margin-top:8px;"></div>
  </div>
</div>

<div id="appRoot" class="hidden">
  <div id="topbar">
    <div class="brand">
      <div class="brand-logo">🛒</div>
      <div class="brand-text">
        <h1>زين ماركت</h1>
        <span>نظام إدارة الكاشير - نسخة <span id="buildNum"></span></span>
      </div>
    </div>
    <div class="top-right">
      <span id="connStatus">الاتصال...</span>
      <span id="userInfo"></span>
      <button class="btn btn-secondary btn-sm" onclick="refreshCurrentView()">🔄</button>
      <button class="btn btn-danger btn-sm" onclick="doLogout()">خروج</button>
    </div>
  </div>
  <div id="tabsNav"></div>
  <div id="tabContent"></div>
</div>

<div id="modalOverlay" class="hidden">
  <div class="modal-box" id="modalBox">
    <button class="modal-x-close" onclick="closeModal()">✖</button>
    <div id="modalContent"></div>
  </div>
</div>

<div id="scannerOverlay" class="hidden">
  <div id="scannerContainer"></div>
  <button class="btn btn-danger" style="margin-top:14px;" onclick="closeBarcodeScanner()">إغلاق الكاميرا</button>
</div>

<script>
var APP_BUILD = 7;
document.getElementById('buildNum') && (document.getElementById('buildNum').textContent = APP_BUILD);

/* ================= FIREBASE CONFIG ================= */
var firebaseConfig = {
  apiKey: "AIzaSyDIp3OlRAP0Wa7Ea1W87NZkYAwOe0xueSQ",
  authDomain: "casheir-840ee.firebaseapp.com",
  projectId: "casheir-840ee",
  storageBucket: "casheir-840ee.firebasestorage.app",
  messagingSenderId: "1078746217763",
  appId: "1:1078746217763:web:7f74831f502ca1b20be096"
};

function loadScript(src){
  return new Promise(function(resolve,reject){
    var s = document.createElement('script');
    s.src = src; s.onload = resolve; s.onerror = function(){reject(new Error('فشل تحميل '+src));};
    document.head.appendChild(s);
  });
}

var db = null;
var SYNC_KEYS = ['cashier_users','cashier_products','cashier_sales','cashier_purchases','cashier_suppliers','cashier_disbursements','cashier_shifts','cashier_stock_adjustments','cashier_wallets','cashier_wallet_transactions','cashier_safe','cashier_safe_transactions','cashier_returns','cashier_damages','invoice_counter','purchase_counter','wallet_counter'];
var _dataCache = {};
var _loadedKeys = {};
var CURRENT_USER = null;
var CART = [];
var CURRENT_TAB = 'cashier';
var _html5QrCode = null;
var _liveInterval = null;

function defaultValueFor(key){
  if(key==='cashier_wallets') return {vodafone:0, instapay:0};
  if(key==='cashier_safe') return {balance:0};
  if(key==='invoice_counter'||key==='purchase_counter'||key==='wallet_counter') return 0;
  return [];
}

function load(key){
  if(_dataCache.hasOwnProperty(key)) return _dataCache[key];
  return defaultValueFor(key);
}
function save(key, val){
  _dataCache[key] = val;
  if(db){
    db.collection('cashier_data').doc(key).set({v: val, updatedAt: Date.now()}).catch(function(e){ console.error('save error', key, e); });
  }
}

function getUsers(){ return (load('cashier_users')||[]).slice(); }
function saveUsers(v){ save('cashier_users', v); }
function getProducts(){ return (load('cashier_products')||[]).slice(); }
function saveProducts(v){ save('cashier_products', v); }
function getSales(){ return (load('cashier_sales')||[]).slice(); }
function saveSales(v){ save('cashier_sales', v); }
function getPurchases(){ return (load('cashier_purchases')||[]).slice(); }
function savePurchases(v){ save('cashier_purchases', v); }
function getSuppliers(){ return (load('cashier_suppliers')||[]).slice(); }
function saveSuppliers(v){ save('cashier_suppliers', v); }
function getDisbursements(){ return (load('cashier_disbursements')||[]).slice(); }
function saveDisbursements(v){ save('cashier_disbursements', v); }
function getShifts(){ return (load('cashier_shifts')||[]).slice(); }
function saveShifts(v){ save('cashier_shifts', v); }
function getStockAdjustments(){ return (load('cashier_stock_adjustments')||[]).slice(); }
function saveStockAdjustments(v){ save('cashier_stock_adjustments', v); }
function getWallets(){ var w = load('cashier_wallets'); if(!w || Array.isArray(w)) return {vodafone:0,instapay:0}; return w; }
function saveWallets(v){ save('cashier_wallets', v); }
function getWalletTx(){ return (load('cashier_wallet_transactions')||[]).slice(); }
function saveWalletTx(v){ save('cashier_wallet_transactions', v); }
function getSafe(){ var s = load('cashier_safe'); if(!s || Array.isArray(s)) return {balance:0}; return s; }
function saveSafe(v){ save('cashier_safe', v); }
function getSafeTransactions(){ return (load('cashier_safe_transactions')||[]).slice(); }
function saveSafeTransactions(v){ save('cashier_safe_transactions', v); }
function getReturns(){ return (load('cashier_returns')||[]).slice(); }
function saveReturns(v){ save('cashier_returns', v); }
function getDamages(){ return (load('cashier_damages')||[]).slice(); }
function saveDamages(v){ save('cashier_damages', v); }

function genId(prefix){ return prefix+'_'+Date.now()+'_'+Math.random().toString(36).slice(2,8); }

function nextCounter(key){
  var ref = db.collection('cashier_data').doc(key);
  return db.runTransaction(function(t){
    return t.get(ref).then(function(doc){
      var cur = (doc.exists && doc.data().v) || 0;
      var next = cur+1;
      t.set(ref, {v: next, updatedAt: Date.now()});
      return next;
    });
  });
}

function formatDate(iso){ if(!iso) return ''; var d = new Date(iso); return d.toLocaleDateString('ar-EG'); }
function formatDateTime(iso){ if(!iso) return ''; var d = new Date(iso); return d.toLocaleDateString('ar-EG')+' '+d.toLocaleTimeString('ar-EG',{hour:'2-digit',minute:'2-digit'}); }
function todayStr(){ return new Date().toISOString().slice(0,10); }
function monthStr(){ return new Date().toISOString().slice(0,7); }
function fmt(n){ return (parseFloat(n)||0).toFixed(2); }

/* ================= BOOT ================= */
function seedData(){
  if((load('cashier_users')||[]).length===0){
    saveUsers([
      {id:'1', username:'MOHAMED NAZIH', password:'admin123', role:'admin', displayName:'MOHAMED NAZIH'},
      {id:'2', username:'ABDALLAH', password:'cashier123', role:'cashier', displayName:'ABDALLAH'}
    ]);
  }
}

function setupSync(){
  var total = SYNC_KEYS.length;
  SYNC_KEYS.forEach(function(key){
    db.collection('cashier_data').doc(key).onSnapshot(function(doc){
      if(doc.exists){
        _dataCache[key] = doc.data().v;
      } else {
        _dataCache[key] = defaultValueFor(key);
      }
      if(!_loadedKeys[key]){
        _loadedKeys[key] = true;
        var loadedCount = Object.keys(_loadedKeys).length;
        if(loadedCount>=total){
          document.getElementById('loadingScreen').classList.add('hidden');
          seedData();
          checkSession();
        }
      } else {
        if(CURRENT_USER) refreshCurrentView();
      }
    }, function(err){
      console.error('sync error', key, err);
    });
  });
  document.getElementById('connStatus').textContent = '🟢 متصل';
}

async function bootApp(){
  try{
    await loadScript('https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js');
    await loadScript('https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js');
    firebase.initializeApp(firebaseConfig);
    db = firebase.firestore();
    try{ await db.enablePersistence({synchronizeTabs:true}); }catch(e){ console.warn('persistence not enabled', e); }
    setupSync();
  }catch(e){
    showFatalError(e.message);
  }
}
function showFatalError(msg){
  document.getElementById('loadingScreen').innerHTML = '<div style="text-align:center;padding:20px;"><h2>حدث خطأ في الاتصال</h2><p>'+msg+'</p><p>تأكد من اتصال الإنترنت وأعد تحميل الصفحة</p></div>';
}
window.onerror = function(msg){
  try{
    document.getElementById('modalOverlay').classList.add('hidden');
    document.getElementById('scannerOverlay').classList.add('hidden');
    if(_html5QrCode){ _html5QrCode.stop().catch(function(){}); }
  }catch(e){}
  console.error(msg);
};

bootApp();

/* ================= AUTH ================= */
function checkSession(){
  var saved = sessionStorage.getItem('current_user');
  if(saved){
    try{
      var u = JSON.parse(saved);
      var users = getUsers();
      var found = users.find(function(x){return x.id===u.id;});
      if(found){ CURRENT_USER = found; showApp(); return; }
    }catch(e){}
  }
  document.getElementById('loginScreen').classList.remove('hidden');
}
function doLogin(){
  var username = document.getElementById('loginUser').value.trim();
  var pass = document.getElementById('loginPass').value;
  var users = getUsers();
  var found = users.find(function(u){ return u.username===username && u.password===pass; });
  if(!found){ document.getElementById('loginError').textContent = 'اسم المستخدم أو كلمة المرور غير صحيحة'; return; }
  CURRENT_USER = found;
  sessionStorage.setItem('current_user', JSON.stringify({id:found.id}));
  document.getElementById('loginScreen').classList.add('hidden');
  showApp();
}
function doLogout(){
  try{
    sessionStorage.removeItem('current_user');
  }catch(e){}
  window.location.replace(window.location.href.split('#')[0]);
}
function showApp(){
  document.getElementById('appRoot').classList.remove('hidden');
  document.getElementById('userInfo').textContent = CURRENT_USER.displayName+' ('+(CURRENT_USER.role==='admin'?'مدير':'كاشير')+')';
  renderTabs();
  switchTab('cashier');
  if(_liveInterval) clearInterval(_liveInterval);
  _liveInterval = setInterval(function(){ if(CURRENT_TAB==='live') renderLive(); }, 3000);
}

/* ================= ROLES / TABS ================= */
var ROLE_PERMISSIONS = {
  admin: ['cashier','purchases','disbursements','returns','wallets','live','inventory','products','reports','profit','safe','users'],
  cashier: ['cashier','purchases','disbursements','returns','wallets','reports']
};
var TAB_DEFS = [
  {id:'cashier', label:'💰 الكاشير'},
  {id:'purchases', label:'📥 فواتير الشراء'},
  {id:'disbursements', label:'💸 طلبات الصرف'},
  {id:'returns', label:'↩️ المرتجعات والتوالف'},
  {id:'wallets', label:'💳 المحافظ الإلكترونية'},
  {id:'live', label:'📡 متابعة مباشرة'},
  {id:'inventory', label:'📦 المخزون'},
  {id:'products', label:'🛒 المنتجات'},
  {id:'reports', label:'📊 التقارير'},
  {id:'profit', label:'📈 الأرباح'},
  {id:'safe', label:'🏦 الخزنة'},
  {id:'users', label:'👥 إدارة المستخدمين'}
];
function renderTabs(){
  var allowed = ROLE_PERMISSIONS[CURRENT_USER.role]||[];
  var html = '';
  TAB_DEFS.forEach(function(t){
    if(allowed.indexOf(t.id)===-1) return;
    html += '<button class="tab-btn" id="tabbtn_'+t.id+'" onclick="switchTab(\''+t.id+'\')">'+t.label+'</button>';
  });
  document.getElementById('tabsNav').innerHTML = html;
}
function switchTab(tabId){
  CURRENT_TAB = tabId;
  closeBarcodeScanner();
  closeModal();
  document.querySelectorAll('.tab-btn').forEach(function(b){ b.classList.remove('active'); });
  var btn = document.getElementById('tabbtn_'+tabId);
  if(btn) btn.classList.add('active');
  refreshCurrentView();
}
function refreshCurrentView(){
  if(!CURRENT_USER) return;
  try{
    if(CURRENT_TAB==='cashier') renderCashier();
    else if(CURRENT_TAB==='purchases') renderPurchases();
    else if(CURRENT_TAB==='disbursements') renderDisbursements();
    else if(CURRENT_TAB==='returns') renderReturns();
    else if(CURRENT_TAB==='wallets') renderWallets();
    else if(CURRENT_TAB==='live') renderLive();
    else if(CURRENT_TAB==='inventory') renderInventory();
    else if(CURRENT_TAB==='products') renderProducts();
    else if(CURRENT_TAB==='reports') renderReports();
    else if(CURRENT_TAB==='profit') renderProfit();
    else if(CURRENT_TAB==='safe') renderSafe();
    else if(CURRENT_TAB==='users') renderUsers();
  }catch(e){ console.error('render error', e); }
}

/* ================= MODAL HELPERS ================= */
function openModal(html){
  document.getElementById('modalContent').innerHTML = html;
  document.getElementById('modalOverlay').classList.remove('hidden');
}
function closeModal(){
  document.getElementById('modalOverlay').classList.add('hidden');
  document.getElementById('modalContent').innerHTML = '';
}
document.getElementById('modalOverlay').addEventListener('click', function(e){
  if(e.target.id==='modalOverlay') closeModal();
});

/* ================= EXCEL EXPORT ================= */
function ensureXLSX(){
  if(window.XLSX) return Promise.resolve();
  return loadScript('https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js');
}
function downloadSheet(rows, sheetName, filename){
  ensureXLSX().then(function(){
    var ws = XLSX.utils.json_to_sheet(rows);
    var wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, sheetName);
    XLSX.writeFile(wb, filename);
  });
}

/* ================= BARCODE SCANNER ================= */
function ensureBarcodeLib(){
  if(window.Html5Qrcode) return Promise.resolve();
  return loadScript('https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js');
}
function openBarcodeScanner(onResult){
  ensureBarcodeLib().then(function(){
    document.getElementById('scannerOverlay').classList.remove('hidden');
    document.getElementById('scannerContainer').innerHTML = '<div id="qrReaderBox" style="width:100%;"></div>';
    _html5QrCode = new Html5Qrcode('qrReaderBox');
    _html5QrCode.start({facingMode:'environment'}, {fps:10, qrbox:220}, function(decodedText){
      onResult(decodedText);
      closeBarcodeScanner();
    }).catch(function(e){ alert('تعذر تشغيل الكاميرا: '+e); closeBarcodeScanner(); });
  }).catch(function(e){ alert('تعذر تحميل مكتبة الباركود: '+e.message); });
}
function closeBarcodeScanner(){
  document.getElementById('scannerOverlay').classList.add('hidden');
  if(_html5QrCode){
    _html5QrCode.stop().then(function(){ _html5QrCode.clear(); }).catch(function(){});
    _html5QrCode = null;
  }
}
function scanIntoField(fieldId){
  openBarcodeScanner(function(text){
    var el = document.getElementById(fieldId);
    if(el) el.value = text;
  });
}
function scanForCashier(){
  openBarcodeScanner(function(text){
    var products = getProducts();
    var p = products.find(function(x){ return x.barcode===text; });
    if(p){ addToCart(p.id); } else { alert('لم يتم العثور على منتج بهذا الباركود'); }
  });
}
function scanForInventoryAdjust(){
  openBarcodeScanner(function(text){
    var products = getProducts();
    var p = products.find(function(x){ return x.barcode===text; });
    if(p){ adjustSingleProductStock(p.id); } else { alert('لم يتم العثور على منتج بهذا الباركود'); }
  });
}

/* ================= PRODUCTS ================= */
function renderProducts(){
  var products = getProducts();
  var isAdmin = CURRENT_USER.role==='admin';
  var html = '<div class="card"><div class="flex-between">';
  html += '<h2>🛒 المنتجات</h2>';

/* ================= CASHIER / SHIFT ================= */
function getActiveShift(){
  var shifts = getShifts();
  return shifts.find(function(s){ return s.cashierName===CURRENT_USER.displayName && !s.closed; });
}
function calcShiftStats(shift){
  try{
    var sales = getSales().filter(function(s){ return s.shiftId===shift.id; });
    var cashSalesTotal = sales.filter(function(s){ return s.paymentMethod==='cash'; }).reduce(function(a,s){return a+s.total;},0);
    var walletCashTotal = sales.filter(function(s){ return s.paymentMethod!=='cash'; }).reduce(function(a,s){return a+s.total;},0);
    var disb = getDisbursements().filter(function(d){ return d.status==='approved' && d.source==='drawer' && d.shiftId===shift.id; });
    var expensesTotal = disb.reduce(function(a,d){return a+d.amount;},0);
    var returns = getReturns().filter(function(r){ return r.source==='drawer' && r.shiftId===shift.id; });
    var returnsTotal = returns.reduce(function(a,r){return a+(r.refundAmount||0);},0);
    var expected = (shift.openingAmount||0) + cashSalesTotal - expensesTotal - returnsTotal + walletCashTotal;
    return {cashSalesTotal:cashSalesTotal, walletCashTotal:walletCashTotal, expensesTotal:expensesTotal, returnsTotal:returnsTotal, expected:expected, salesCount:sales.length};
  }catch(e){
    return {cashSalesTotal:0, walletCashTotal:0, expensesTotal:0, returnsTotal:0, expected:shift.openingAmount||0, salesCount:0};
  }
}
function renderCashier(){
  var shift = getActiveShift();
  var html = '';
  if(!shift){
    html += '<div class="card"><h2>بدء شيفت جديد</h2><div class="form-row"><label>المبلغ الافتتاحي في الدرج</label><input class="input" id="openingAmt" type="number" value="0"></div><button class="btn btn-primary" onclick="confirmStartShift()">بدء الشيفت</button></div>';
    document.getElementById('tabContent').innerHTML = html;
    return;
  }
  var stats = calcShiftStats(shift);
  html += '<div class="card"><div class="flex-between"><div>';
  html += '<b>شيفت '+shift.cashierName+'</b> — بدأ في '+formatDateTime(shift.startTime)+'<br>';
  html += 'الافتتاحي: '+fmt(shift.openingAmount)+' ج | المتوقع في الدرج الآن: <b>'+fmt(stats.expected)+' ج</b> | عدد المبيعات: '+stats.salesCount;
  html += '</div><button class="btn btn-danger" onclick="openEndShiftModal()">إنهاء الشيفت</button></div></div>';

  html += '<div class="cashier-split">';
  html += '<div class="cashier-cart-panel card"><h3>🧾 الفاتورة الحالية</h3><div id="cartPanelInner"></div></div>';
  html += '<div class="cashier-products-panel card"><div class="search-bar"><input class="input" id="cashierSearch" placeholder="بحث عن منتج" oninput="renderCashierProductsGrid()"><button class="btn btn-secondary" onclick="scanForCashier()">📷 مسح</button></div><div id="cashierProductsGrid" class="product-grid"></div></div>';
  html += '</div>';
  document.getElementById('tabContent').innerHTML = html;
  renderCashierProductsGrid();
  renderCartPanelInto();
}
function renderCashierProductsGrid(){
  var q = (document.getElementById('cashierSearch')||{value:''}).value.trim().toLowerCase();
  var products = getProducts().filter(function(p){ return !q || p.name.toLowerCase().indexOf(q)>-1 || (p.barcode||'').indexOf(q)>-1; });
  var html = '';
  products.forEach(function(p){
    var cls = p.stock<=0?'out':(p.stock<=(p.minStock||5)?'low':'');
    html += '<div class="product-card '+cls+'" onclick="addToCart(\''+p.id+'\')"><h4>'+p.name+'</h4><p>'+fmt(p.price)+' ج</p><p>متاح: '+p.stock+'</p></div>';
  });
  var grid = document.getElementById('cashierProductsGrid');
  if(grid) grid.innerHTML = html || '<p>لا توجد منتجات</p>';
}
function addToCart(productId){
  try{
    var shift = getActiveShift();
    if(!shift){ alert('يجب بدء شيفت أولاً قبل البيع'); return; }
    var products = getProducts();
    var product = products.find(function(p){ return p.id===productId; });
    if(!product){ alert('تعذر العثور على هذا المنتج، حاول الضغط على 🔄 لتحديث البيانات ثم المحاولة مرة أخرى'); return; }
    var line = CART.find(function(c){ return c.productId===productId; });
    if(line){ line.qty++; }
    else { CART.push({productId:productId, name:product.name, price:product.price, costPrice:product.costPrice||0, qty:1}); }
    renderCartPanelInto();
  }catch(e){ alert('حدث خطأ أثناء الإضافة للسلة: '+e.message); }
}
function changeQty(productId, delta){
  var line = CART.find(function(c){ return c.productId===productId; });
  if(!line) return;
  line.qty += delta;
  if(line.qty<=0){ CART = CART.filter(function(c){ return c.productId!==productId; }); }
  renderCartPanelInto();
}
function removeFromCart(productId){
  CART = CART.filter(function(c){ return c.productId!==productId; });
  renderCartPanelInto();
}
function renderCartPanelInto(){
  var wrap = document.getElementById('cartPanelInner');
  if(!wrap) return;
  var html = '';
  if(CART.length===0){ html += '<p style="color:#888;">السلة فارغة</p>'; }
  var subtotal = 0;
  CART.forEach(function(c){
    subtotal += c.price*c.qty;
    html += '<div class="cart-line"><div>'+c.name+'<br><small>'+fmt(c.price)+' ج</small></div><div class="qty-ctrl"><button onclick="changeQty(\''+c.productId+'\',-1)">-</button><span>'+c.qty+'</span><button onclick="changeQty(\''+c.productId+'\',1)">+</button><button onclick="removeFromCart(\''+c.productId+'\')">🗑️</button></div></div>';
  });
  html += '<div class="form-row"><label>خصم %</label><input class="input" id="discountPct" type="number" value="0" oninput="renderCartTotals()"></div>';
  html += '<div class="form-row"><label>ضريبة %</label><input class="input" id="taxPct" type="number" value="0" oninput="renderCartTotals()"></div>';
  html += '<div class="form-row"><label>طريقة الدفع</label><select class="input" id="paymentMethod"><option value="cash">نقدي</option><option value="vodafone">فودافون كاش</option><option value="instapay">انستاباي</option></select></div>';
  html += '<div id="cartTotalsWrap"></div>';
  html += '<button class="btn btn-primary btn-block" onclick="processCheckout()">✅ إتمام البيع</button>';
  wrap.innerHTML = html;
  renderCartTotals();
}
function renderCartTotals(){
  var subtotal = CART.reduce(function(a,c){ return a+c.price*c.qty; },0);
  var discountPct = parseFloat((document.getElementById('discountPct')||{value:0}).value)||0;
  var taxPct = parseFloat((document.getElementById('taxPct')||{value:0}).value)||0;
  var discountAmount = subtotal*discountPct/100;
  var afterDiscount = subtotal-discountAmount;
  var taxAmount = afterDiscount*taxPct/100;
  var total = afterDiscount+taxAmount;
  var wrap = document.getElementById('cartTotalsWrap');
  if(wrap) wrap.innerHTML = '<p>الإجمالي الفرعي: '+fmt(subtotal)+' ج</p><p>الخصم: '+fmt(discountAmount)+' ج</p><p>الضريبة: '+fmt(taxAmount)+' ج</p><p><b>الإجمالي: '+fmt(total)+' ج</b></p>';
}
function processCheckout(){
  if(CART.length===0){ alert('السلة فارغة'); return; }
  var shift = getActiveShift();
  if(!shift){ alert('لا يوجد شيفت نشط'); return; }
  var subtotal = CART.reduce(function(a,c){ return a+c.price*c.qty; },0);
  var discountPercent = parseFloat(document.getElementById('discountPct').value)||0;
  var taxPercent = parseFloat(document.getElementById('taxPct').value)||0;
  var discountAmount = subtotal*discountPercent/100;
  var afterDiscount = subtotal-discountAmount;
  var taxAmount = afterDiscount*taxPercent/100;
  var total = afterDiscount+taxAmount;
  var paymentMethod = document.getElementById('paymentMethod').value;
  var grossProfit = CART.reduce(function(a,c){ return a+((c.price-(c.costPrice||0))*c.qty); },0);
  var profit = grossProfit - discountAmount;

  nextCounter('invoice_counter').then(function(invoiceNum){
    var sale = {invoiceNum:invoiceNum, date:new Date().toISOString(), items:CART.slice(), subtotal:subtotal, discountPercent:discountPercent, taxPercent:taxPercent, total:total, soldBy:CURRENT_USER.displayName, paymentMethod:paymentMethod, shiftId:shift.id, profit:profit};
    var sales = getSales(); sales.push(sale); saveSales(sales);

    var products = getProducts();
    CART.forEach(function(c){
      var p = products.find(function(x){ return x.id===c.productId; });
      if(p){ p.stock = (p.stock||0) - c.qty; /* allowed to go negative intentionally */ }
    });
    saveProducts(products);

    if(paymentMethod!=='cash'){
      var wallets = getWallets();
      wallets[paymentMethod] = (wallets[paymentMethod]||0) + total;
      saveWallets(wallets);
      var wtx = getWalletTx();
      wtx.push({id:genId('wtx'), wallet:paymentMethod, operation:'sale', amount:total, commission:0, date:new Date().toISOString(), user:CURRENT_USER.displayName, note:'فاتورة رقم '+invoiceNum});
      saveWalletTx(wtx);
    }
    CART = [];
    renderCashier();
    showInvoice(sale);
  });
}
function showInvoice(sale){
  var html = '<h3>فاتورة رقم '+sale.invoiceNum+'</h3><p>'+formatDateTime(sale.date)+' - '+sale.soldBy+'</p><table><tr><th>الصنف</th><th>سعر</th><th>كمية</th><th>إجمالي</th></tr>';
  sale.items.forEach(function(it){ html += '<tr><td>'+it.name+'</td><td>'+fmt(it.price)+'</td><td>'+it.qty+'</td><td>'+fmt(it.price*it.qty)+'</td></tr>'; });
  html += '</table><p>الإجمالي الفرعي: '+fmt(sale.subtotal)+' ج</p><p>الخصم: '+sale.discountPercent+'%</p><p>الضريبة: '+sale.taxPercent+'%</p><p><b>الإجمالي: '+fmt(sale.total)+' ج</b></p><p>طريقة الدفع: '+(sale.paymentMethod==='cash'?'نقدي':sale.paymentMethod)+'</p>';
  html += '<button class="btn btn-primary" onclick=\'printInvoice('+JSON.stringify(JSON.stringify(sale))+')\'>🖨️ طباعة</button> <button class="btn btn-secondary" onclick="closeModal()">إغلاق</button>';
  openModal(html);
}
function printInvoice(saleStr){
  var sale = JSON.parse(saleStr);
  var w = window.open('', '_blank');
  var html = '<html dir="rtl"><head><title>فاتورة '+sale.invoiceNum+'</title></head><body><h2>زين ماركت</h2><p>فاتورة رقم '+sale.invoiceNum+'</p><p>'+formatDateTime(sale.date)+'</p><table border="1" style="width:100%;border-collapse:collapse;" cellpadding="5"><tr><th>الصنف</th><th>سعر</th><th>كمية</th><th>إجمالي</th></tr>';
  sale.items.forEach(function(it){ html += '<tr><td>'+it.name+'</td><td>'+fmt(it.price)+'</td><td>'+it.qty+'</td><td>'+fmt(it.price*it.qty)+'</td></tr>'; });
  html += '</table><p>الإجمالي: '+fmt(sale.total)+' ج</p></body></html>';
  w.document.write(html);
  w.document.close();
  setTimeout(function(){ w.print(); }, 300);
}
function confirmStartShift(){
  var amt = parseFloat(document.getElementById('openingAmt').value)||0;
  var shifts = getShifts();
  shifts.push({id:genId('shift'), cashierName:CURRENT_USER.displayName, openingAmount:amt, startTime:new Date().toISOString(), endTime:null, closingAmount:null, closed:false, expectedAmount:null, difference:null});
  saveShifts(shifts);
  renderCashier();
}
function openEndShiftModal(){
  var shifts = getShifts();
  var shift = shifts.find(function(s){ return s.cashierName===CURRENT_USER.displayName && !s.closed; });
  if(!shift){ alert('لا يوجد شيفت مفتوح حالياً'); return; }
  var stats = calcShiftStats(shift);
  var html = '<h3>إنهاء الشيفت</h3><p>المتوقع في الدرج: '+fmt(stats.expected)+' ج</p><div class="form-row"><label>المبلغ الفعلي المعدود</label><input class="input" id="shiftCloseAmt" type="number" value="'+fmt(stats.expected)+'"></div><p class="note">ملاحظة: هذا المبلغ سيتم تحويله تلقائياً لرصيد الخزنة عند التأكيد.</p><button class="btn btn-danger btn-block" onclick="confirmEndShift()">تأكيد إنهاء الشيفت</button>';
  openModal(html);
}
function confirmEndShift(){
  try{
    var actual = parseFloat(document.getElementById('shiftCloseAmt').value)||0;
    var shifts = getShifts();
    var idx=-1;
    for(var i=0;i<shifts.length;i++){ if(shifts[i].cashierName===CURRENT_USER.displayName && !shifts[i].closed){ idx=i; break; } }
    if(idx===-1){ alert('لا يوجد شيفت مفتوح حالياً. ربما تم إنهاؤه بالفعل من جهاز آخر. اضغط 🔄 لتحديث الصفحة'); closeModal(); renderCashier(); return; }
    var shift = shifts[idx];
    var stats = calcShiftStats(shift);
    shift.closed = true;
    shift.endTime = new Date().toISOString();
    shift.closingAmount = actual;
    shift.expectedAmount = stats.expected;
    shift.difference = actual - stats.expected;
    saveShifts(shifts);

    if(actual>0){
      var safe = getSafe();
      safe.balance = (safe.balance||0) + actual;
      saveSafe(safe);
      var safeTx = getSafeTransactions();
      safeTx.push({id:genId('safetx'), type:'shift_close', amount:actual, description:'تحويل تلقائي من إغلاق شيفت الكاشير '+shift.cashierName, date:new Date().toISOString(), user:shift.cashierName});
      saveSafeTransactions(safeTx);
    }

    closeModal();
    renderCashier();
    alert('تم إنهاء الشيفت بنجاح، وتم تحويل مبلغ '+fmt(actual)+' ج إلى الخزنة تلقائياً.');
  }catch(e){ alert('حدث خطأ أثناء إنهاء الشيفت: '+e.message); closeModal(); renderCashier(); }
}

function buildInstallments(total, n){
  n = n||3;
  var per = Math.floor((total/n)*100)/100;
  var installments = [];
  var sum = 0;
  for(var i=0;i<n-1;i++){ installments.push({id:genId('inst'), amount:per, paid:false, paidDate:null}); sum += per; }
  installments.push({id:genId('inst'), amount: Math.round((total-sum)*100)/100, paid:false, paidDate:null});
  return installments;
}

  var html = '<h3>فاتورة شراء جديدة</h3>';
  html += '<div class="form-row"><label>المورد</label><select class="input" id="purSupplier">'+suppliers.map(function(s){return '<option value="'+s.id+'">'+s.name+' ('+(s.type==='cash'?'كاش':'آجل')+')</option>';}).join('')+'</select></div>';
  html += '<h4>إضافة صنف</h4>';
  html += '<div class="form-row"><label>منتج موجود</label><select class="input" id="purExistingProduct"><option value="">-- اختر أو أضف جديد --</option>'+products.map(function(p){return '<option value="'+p.id+'">'+p.name+'</option>';}).join('')+'</select></div>';
  html += '<div class="form-row"><label>اسم منتج جديد (لو مش موجود)</label><div style="display:flex;gap:6px;"><input class="input" id="purNewName"><input class="input" id="purNewBarcode" placeholder="باركود"><button class="btn btn-secondary" onclick="scanIntoField(\'purNewBarcode\')">📷</button></div></div>';
  html += '<div class="form-row"><label>سعر التكلفة</label><input class="input" id="purCostPrice" type="number"></div>';
  html += '<div class="form-row"><label>سعر البيع</label><input class="input" id="purSellPrice" type="number"></div>';
  html += '<div class="form-row"><label>الكمية</label><input class="input" id="purQty" type="number" value="1"></div>';
  html += '<button class="btn btn-secondary" onclick="addPurchaseLine()">+ إضافة للفاتورة</button>';
  html += '<div id="purLinesWrap" style="margin-top:10px;"></div>';
  html += '<button class="btn btn-primary btn-block" style="margin-top:10px;" onclick="submitPurchase()">تأكيد الفاتورة</button>';
  openModal(html);
  renderPurchaseLines();
}
function addPurchaseLine(){
  var existingId = document.getElementById('purExistingProduct').value;
  var cost = parseFloat(document.getElementById('purCostPrice').value)||0;
  var sell = parseFloat(document.getElementById('purSellPrice').value)||0;
  var qty = parseFloat(document.getElementById('purQty').value)||0;
  if(qty<=0){ alert('أدخل كمية صحيحة'); return; }
  var line = {productId: existingId||null, newName: existingId?null:document.getElementById('purNewName').value.trim(), newBarcode: existingId?null:document.getElementById('purNewBarcode').value.trim(), costPrice:cost, sellPrice:sell, qty:qty};
  if(!existingId && !line.newName){ alert('أدخل اسم المنتج الجديد أو اختر منتج موجود'); return; }
  _purchaseLines.push(line);
  renderPurchaseLines();
}
function renderPurchaseLines(){
  var products = getProducts();
  var html = '<table><tr><th>الصنف</th><th>تكلفة</th><th>بيع</th><th>كمية</th></tr>';
  var total = 0;
  _purchaseLines.forEach(function(l){
    var name = l.productId ? (products.find(function(p){return p.id===l.productId;})||{}).name : l.newName;
    total += l.costPrice*l.qty;
    html += '<tr><td>'+name+'</td><td>'+fmt(l.costPrice)+'</td><td>'+fmt(l.sellPrice)+'</td><td>'+l.qty+'</td></tr>';
  });
  html += '</table><p><b>إجمالي التكلفة: '+fmt(total)+' ج</b></p>';
  document.getElementById('purLinesWrap').innerHTML = html;
}
function submitPurchase(){
  if(_purchaseLines.length===0){ alert('أضف صنف واحد على الأقل'); return; }
  var supplierId = document.getElementById('purSupplier').value;
  var suppliers = getSuppliers();
  var supplier = suppliers.find(function(s){ return s.id===supplierId; });
  if(!supplier){ alert('اختر مورد'); return; }
  var total = _purchaseLines.reduce(function(a,l){ return a+l.costPrice*l.qty; },0);
  nextCounter('purchase_counter').then(function(purchaseNum){
    var isAdmin = CURRENT_USER.role==='admin';
    var purchase = {
      id: genId('pur'), purchaseNum: purchaseNum, supplierId:supplierId, supplierName:supplier.name,
      items: _purchaseLines.slice(), total: total, status: isAdmin?'approved':'pending',
      requestedBy: CURRENT_USER.displayName, date: new Date().toISOString(),
      installments: supplier.type==='credit' ? buildInstallments(total,3) : null
    };
    var purchases = getPurchases();
    purchases.push(purchase);
    savePurchases(purchases);
    if(isAdmin) applyPurchaseToStock(purchase);
    closeModal();
    renderPurchases();
  });
}
function applyPurchaseToStock(purchase){
  var products = getProducts();
  purchase.items.forEach(function(it){
    if(it.productId){
      var p = products.find(function(x){ return x.id===it.productId; });
      if(p){ p.stock = (p.stock||0)+it.qty; p.costPrice = it.costPrice; p.price = it.sellPrice; }
    } else {
      products.push({id:genId('prod'), name:it.newName, barcode:it.newBarcode||'', price:it.sellPrice, costPrice:it.costPrice, stock:it.qty, minStock:5, dateAdded:new Date().toISOString()});
    }
  });
  saveProducts(products);
}
function approvePurchase(id){
  var purchases = getPurchases();
  var p = purchases.find(function(x){ return x.id===id; });
  if(!p) return;
  p.status = 'approved';
  p.approvedBy = CURRENT_USER.displayName;
  p.approvedDate = new Date().toISOString();
  savePurchases(purchases);
  applyPurchaseToStock(p);
  renderPurchases();
}
function rejectPurchase(id){
  var reason = prompt('سبب الرفض:');
  if(reason===null) return;
  var purchases = getPurchases();
  var p = purchases.find(function(x){ return x.id===id; });
  if(!p) return;
  p.status = 'rejected';
  p.rejectReason = reason;
  savePurchases(purchases);
  renderPurchases();
}
function requestInstallmentDisbursement(purchaseId, installmentId){
  var purchases = getPurchases();
  var p = purchases.find(function(x){ return x.id===purchaseId; });
  if(!p) return;
  var inst = p.installments.find(function(i){ return i.id===installmentId; });
  if(!inst) return;
  var isAdmin = CURRENT_USER.role==='admin';
  var d = {id:genId('disb'), description:'سداد قسط للمورد '+p.supplierName+' (فاتورة '+p.purchaseNum+')', amount:inst.amount, source:'safe', category:'installment', purchaseId:purchaseId, installmentId:installmentId, requestedBy:CURRENT_USER.displayName, status: isAdmin?'approved':'pending', approvedBy:isAdmin?CURRENT_USER.displayName:null, approvedDate:isAdmin?new Date().toISOString():null, rejectReason:null, date:new Date().toISOString()};
  var disbursements = getDisbursements();
  disbursements.push(d);
  saveDisbursements(disbursements);
  if(isAdmin) applyDisbursementApprovalEffects(d);
  alert('تم إرسال طلب صرف القسط'+(isAdmin?' واعتماده تلقائياً':' وينتظر موافقة المدير'));
  renderPurchases();
}

function submitDisbursement(){
  var desc = document.getElementById('disbDesc').value.trim();

function rejectDisbursement(id){

  if(reason===null) return;
  var disbursements = getDisbursements();

function applyDisbursementApprovalEffects(d){
  if(d.source==='safe'){
    var safe = getSafe();
    safe.balance = (safe.balance||0) - d.amount;
    saveSafe(safe);
    var safeTx = getSafeTransactions();
    safeTx.push({id:genId('safetx'), type:'disbursement', amount:-d.amount, description:d.description, date:new Date().toISOString(), user:d.requestedBy});
    saveSafeTransactions(safeTx);
  }
  if(d.category==='installment' && d.purchaseId){
    var purchases = getPurchases();
    var p = purchases.find(function(x){return x.id===d.purchaseId;});
    if(p){ var inst=p.installments.find(function(i){return i.id===d.installmentId;}); if(inst && !inst.paid){ inst.paid=true; inst.paidDate=new Date().toISOString(); savePurchases(purchases); } }
  }
}

    html += '<tr><td>'+r.productName+'</td><td>'+r.qty+'</td><td>'+fmt(r.refundAmount)+'</td><td>'+(r.source==='drawer'?'الدرج':r.source==='safe'?'الخزنة':'بدون استرداد')+'</td><td>'+(r.resalable?'نعم':'لا')+'</td><td>'+r.reason+'</td><td>'+r.processedBy+'</td><td>'+formatDateTime(r.date)+'</td></tr>';

  damages.slice().reverse().forEach(function(d){
    html += '<tr><td>'+d.productName+'</td><td>'+d.qty+'</td><td>'+fmt(d.lossValue)+'</td><td>'+d.reason+'</td><td>'+d.processedBy+'</td><td>'+formatDateTime(d.date)+'</td></tr>';
  });

function openReturnModal(){
  var products = getProducts();
  var html = '<h3>تسجيل مرتجع</h3>';
  html += '<div class="form-row"><label>الصنف</label><select class="input" id="retProduct" onchange="updateReturnDefaults()">'+products.map(function(p){return '<option value="'+p.id+'" data-price="'+p.price+'" data-cost="'+(p.costPrice||0)+'">'+p.name+'</option>';}).join('')+'</select></div>';
  html += '<div class="form-row"><label>الكمية</label><input class="input" id="retQty" type="number" value="1" oninput="updateReturnDefaults()"></div>';
  html += '<div class="form-row"><label>المبلغ المسترد</label><input class="input" id="retRefund" type="number"></div>';
  html += '<div class="form-row"><label>هل الصنف صالح لإعادة بيعه (يرجع للمخزون)؟</label><select class="input" id="retResalable"><option value="yes">نعم</option><option value="no">لا (تالف)</option></select></div>';
  html += '<div class="form-row"><label>مصدر استرداد المبلغ</label><select class="input" id="retSource"><option value="drawer">الدرج</option><option value="safe">الخزنة</option><option value="none">بدون استرداد مالي</option></select></div>';
  html += '<div class="form-row"><label>السبب</label><input class="input" id="retReason"></div>';
  html += '<button class="btn btn-primary btn-block" onclick="submitReturn()">تنفيذ المرتجع</button>';
  openModal(html);
  updateReturnDefaults();
}
function updateReturnDefaults(){
  var sel = document.getElementById('retProduct');
  var opt = sel.options[sel.selectedIndex];
  var price = parseFloat(opt.getAttribute('data-price'))||0;
  var qty = parseFloat(document.getElementById('retQty').value)||0;
  document.getElementById('retRefund').value = (price*qty).toFixed(2);
}
function submitReturn(){
  var productId = document.getElementById('retProduct').value;
  var qty = parseFloat(document.getElementById('retQty').value)||0;
  var refundAmount = parseFloat(document.getElementById('retRefund').value)||0;
  var resalable = document.getElementById('retResalable').value==='yes';
  var source = document.getElementById('retSource').value;
  var reason = document.getElementById('retReason').value.trim();
  if(qty<=0){ alert('أدخل كمية صحيحة'); return; }
  var products = getProducts();
  var product = products.find(function(p){ return p.id===productId; });
  if(!product){ alert('منتج غير موجود'); return; }
  var shift = getActiveShift();

  if(resalable){ product.stock = (product.stock||0)+qty; saveProducts(products); }

  var ret = {id:genId('ret'), productId:productId, productName:product.name, qty:qty, price:product.price, costPrice:product.costPrice||0, refundAmount:refundAmount, source:source, resalable:resalable, reason:reason||'-', shiftId: shift?shift.id:null, processedBy:CURRENT_USER.displayName, date:new Date().toISOString()};
  var returns = getReturns();
  returns.push(ret);
  saveReturns(returns);

  if(source==='safe' && refundAmount>0){
    var safe = getSafe();
    safe.balance = (safe.balance||0) - refundAmount;
    saveSafe(safe);
    var safeTx = getSafeTransactions();
    safeTx.push({id:genId('safetx'), type:'return', amount:-refundAmount, description:'استرداد مرتجع: '+product.name, date:new Date().toISOString(), user:CURRENT_USER.displayName});
    saveSafeTransactions(safeTx);
  }

  if(!resalable){
    var products2 = getProducts();
    var p2 = products2.find(function(p){ return p.id===productId; });
    if(p2){ p2.stock = (p2.stock||0)-qty; saveProducts(products2); }
    var damages = getDamages();
    damages.push({id:genId('dmg'), productId:productId, productName:product.name, qty:qty, lossValue:(product.costPrice||0)*qty, reason:'تالف نتيجة مرتجع: '+(reason||'-'), processedBy:CURRENT_USER.displayName, date:new Date().toISOString()});
    saveDamages(damages);
    var adjustments = getStockAdjustments();
    adjustments.push({id:genId('adj'), productId:productId, productName:product.name, qtyBefore:product.stock, qtyAfter:(product.stock||0)-qty, difference:-qty, type:'decrease', reason:'تالف نتيجة مرتجع', date:new Date().toISOString(), user:CURRENT_USER.displayName});
    saveStockAdjustments(adjustments);
  }

  closeModal(); renderReturns();
}
function openDamageModal(){
  var products = getProducts();
  var html = '<h3>تسجيل تالف/هالك</h3>';
  html += '<div class="form-row"><label>الصنف</label><select class="input" id="dmgProduct">'+products.map(function(p){return '<option value="'+p.id+'">'+p.name+'</option>';}).join('')+'</select></div>';
  html += '<div class="form-row"><label>الكمية</label><input class="input" id="dmgQty" type="number" value="1"></div>';
  html += '<div class="form-row"><label>السبب</label><input class="input" id="dmgReason" placeholder="مثال: انتهاء الصلاحية / كسر"></div>';
  html += '<button class="btn btn-danger btn-block" onclick="submitDamage()">تسجيل التالف</button>';
  openModal(html);
}
function submitDamage(){
  var productId = document.getElementById('dmgProduct').value;
  var qty = parseFloat(document.getElementById('dmgQty').value)||0;
  var reason = document.getElementById('dmgReason').value.trim()||'-';
  if(qty<=0){ alert('أدخل كمية صحيحة'); return; }
  var products = getProducts();
  var product = products.find(function(p){ return p.id===productId; });
  if(!product){ alert('منتج غير موجود'); return; }
  var qtyBefore = product.stock;
  product.stock = (product.stock||0)-qty;
  saveProducts(products);

  var lossValue = (product.costPrice||0)*qty;
  var damages = getDamages();
  damages.push({id:genId('dmg'), productId:productId, productName:product.name, qty:qty, lossValue:lossValue, reason:reason, processedBy:CURRENT_USER.displayName, date:new Date().toISOString()});
  saveDamages(damages);

  var adjustments = getStockAdjustments();
  adjustments.push({id:genId('adj'), productId:productId, productName:product.name, qtyBefore:qtyBefore, qtyAfter:product.stock, difference:-qty, type:'decrease', reason:'تالف: '+reason, date:new Date().toISOString(), user:CURRENT_USER.displayName});
  saveStockAdjustments(adjustments);

  closeModal(); renderReturns();
}
function exportReturnsExcel(){
  var rows = getReturns().map(function(r){ return {'التاريخ':formatDateTime(r.date),'الصنف':r.productName,'الكمية':r.qty,'المبلغ المسترد':r.refundAmount,'المصدر':r.source,'رجع للمخزون':r.resalable?'نعم':'لا','السبب':r.reason,'بواسطة':r.processedBy}; });
  downloadSheet(rows, 'المرتجعات', 'returns_'+Date.now()+'.xlsx');
}
function exportDamagesExcel(){
  var rows = getDamages().map(function(d){ return {'التاريخ':formatDateTime(d.date),'الصنف':d.productName,'الكمية':d.qty,'قيمة الخسارة':d.lossValue,'السبب':d.reason,'بواسطة':d.processedBy}; });
  downloadSheet(rows, 'التوالف', 'damages_'+Date.now()+'.xlsx');
}

function adjustSingleProductStock(productId){
  var products = getProducts();
  var p = products.find(function(x){ return x.id===productId; });
  if(!p) return;
  var newQty = prompt('الكمية الفعلية الجديدة لـ "'+p.name+'" (الحالي: '+p.stock+')');
  if(newQty===null) return;
  newQty = parseFloat(newQty);
  if(isNaN(newQty)) return;
  var reason = prompt('سبب التسوية:')||'-';
  var diff = newQty - p.stock;
  var adjustments = getStockAdjustments();
  adjustments.push({id:genId('adj'), productId:productId, productName:p.name, qtyBefore:p.stock, qtyAfter:newQty, difference:diff, type:diff>=0?'increase':'decrease', reason:reason, date:new Date().toISOString(), user:CURRENT_USER.displayName});
  saveStockAdjustments(adjustments);
  p.stock = newQty;
  saveProducts(products);
  renderInventory();
}

  var products = getProducts();
  var html = '<h3>🔍 جرد دوري جديد</h3><div id="stockCountWrap">';

/* ================= PROFIT ================= */
function getProfitBreakdown(sales){
  var map = {};
  sales.forEach(function(sale){
    (sale.items||[]).forEach(function(it){
      if(!map[it.productId]) map[it.productId] = {name:it.name, qty:0, saleTotal:0, costTotal:0};
      map[it.productId].qty += it.qty;
      map[it.productId].saleTotal += it.price*it.qty;
      map[it.productId].costTotal += (it.costPrice||0)*it.qty;
    });
  });
  return Object.keys(map).map(function(k){ var r=map[k]; r.profit=r.saleTotal-r.costTotal; return r; });
}
function renderProfitTable(breakdown){
  var html = '<table><tr><th>الصنف</th><th>الكمية</th><th>إجمالي البيع</th><th>إجمالي التكلفة</th><th>الربح</th></tr>';
  breakdown.forEach(function(r){ html += '<tr><td>'+r.name+'</td><td>'+r.qty+'</td><td>'+fmt(r.saleTotal)+'</td><td>'+fmt(r.costTotal)+'</td><td>'+fmt(r.profit)+'</td></tr>'; });
  html += '</table>';
  return html;
}
function renderProfit(){
  if(CURRENT_USER.role!=='admin'){ document.getElementById('tabContent').innerHTML = '<div class="card">غير مسموح</div>'; return; }
  var sales = getSales();
  var todaySales = sales.filter(function(s){ return s.date.slice(0,10)===todayStr(); });
  var monthSales = sales.filter(function(s){ return s.date.slice(0,7)===monthStr(); });
  var dailyProfit = todaySales.reduce(function(a,s){return a+(s.profit||0);},0);
  var monthlyGrossProfit = monthSales.reduce(function(a,s){return a+(s.profit||0);},0);
  var monthExpensesTotal = getDisbursements().filter(function(d){ return d.status==='approved' && d.date.slice(0,7)===monthStr(); }).reduce(function(a,d){return a+d.amount;},0);
  var monthDamages = getDamages().filter(function(d){ return d.date.slice(0,7)===monthStr(); });
  var monthDamagesLoss = monthDamages.reduce(function(a,d){return a+(d.lossValue||0);},0);
  var monthReturns = getReturns().filter(function(r){ return r.date.slice(0,7)===monthStr(); });
  var monthReturnsProfitLoss = monthReturns.reduce(function(a,r){ return a+((r.refundAmount||0)-((r.costPrice||0)*r.qty)); },0);
  var monthlyNetProfit = monthlyGrossProfit - monthExpensesTotal - monthDamagesLoss - monthReturnsProfitLoss;

  var html = '<div class="stats-row">';
  html += '<div class="stat-card"><h3>'+fmt(dailyProfit)+' ج</h3><p>ربح اليوم (إجمالي)</p></div>';
  html += '<div class="stat-card"><h3>'+fmt(monthlyGrossProfit)+' ج</h3><p>ربح الشهر (إجمالي)</p></div>';
  html += '<div class="stat-card"><h3>'+fmt(monthExpensesTotal)+' ج</h3><p>مصروفات الشهر</p></div>';
  html += '<div class="stat-card"><h3>'+fmt(monthDamagesLoss)+' ج</h3><p>خسائر التوالف هذا الشهر</p></div>';
  html += '<div class="stat-card"><h3>'+fmt(monthReturnsProfitLoss)+' ج</h3><p>تأثير المرتجعات على الربح</p></div>';
  html += '<div class="stat-card"><h3>'+fmt(monthlyNetProfit)+' ج</h3><p>صافي ربح الشهر</p></div>';
  html += '</div>';
  html += '<div class="card"><div class="flex-between"><h2>تفاصيل ربح اليوم</h2><button class="btn btn-secondary" onclick="exportProfitExcel(\'daily\')">⬇️ تصدير ربح اليوم Excel</button></div>'+renderProfitTable(getProfitBreakdown(todaySales))+'</div>';
  html += '<div class="card"><div class="flex-between"><h2>تفاصيل ربح الشهر</h2><button class="btn btn-secondary" onclick="exportProfitExcel(\'monthly\')">⬇️ تصدير ربح الشهر Excel</button></div>'+renderProfitTable(getProfitBreakdown(monthSales))+'</div>';
  document.getElementById('tabContent').innerHTML = html;
}
function exportProfitExcel(period){
  var sales = getSales();
  var filtered = period==='daily' ? sales.filter(function(s){return s.date.slice(0,10)===todayStr();}) : sales.filter(function(s){return s.date.slice(0,7)===monthStr();});
  var breakdown = getProfitBreakdown(filtered);
  var rows = breakdown.map(function(r){ return {'الصنف':r.name,'الكمية':r.qty,'إجمالي البيع':r.saleTotal,'إجمالي التكلفة':r.costTotal,'الربح':r.profit}; });
  if(period==='monthly'){
    var monthlyGrossProfit = filtered.reduce(function(a,s){return a+(s.profit||0);},0);
    var monthExpensesTotal = getDisbursements().filter(function(d){ return d.status==='approved' && d.date.slice(0,7)===monthStr(); }).reduce(function(a,d){return a+d.amount;},0);
    var monthDamagesLoss = getDamages().filter(function(d){ return d.date.slice(0,7)===monthStr(); }).reduce(function(a,d){return a+(d.lossValue||0);},0);
    var monthReturnsProfitLoss = getReturns().filter(function(r){ return r.date.slice(0,7)===monthStr(); }).reduce(function(a,r){ return a+((r.refundAmount||0)-((r.costPrice||0)*r.qty)); },0);
    rows.push({'الصنف':'--- إجمالي الربح ---','الكمية':'','إجمالي البيع':'','إجمالي التكلفة':'','الربح':monthlyGrossProfit});
    rows.push({'الصنف':'--- المصروفات ---','الكمية':'','إجمالي البيع':'','إجمالي التكلفة':'','الربح':-monthExpensesTotal});
    rows.push({'الصنف':'--- خسائر التوالف ---','الكمية':'','إجمالي البيع':'','إجمالي التكلفة':'','الربح':-monthDamagesLoss});
    rows.push({'الصنف':'--- تأثير المرتجعات ---','الكمية':'','إجمالي البيع':'','إجمالي التكلفة':'','الربح':-monthReturnsProfitLoss});
    rows.push({'الصنف':'--- صافي الربح ---','الكمية':'','إجمالي البيع':'','إجمالي التكلفة':'','الربح':monthlyGrossProfit-monthExpensesTotal-monthDamagesLoss-monthReturnsProfitLoss});
  }
  downloadSheet(rows, 'الأرباح', 'profit_'+period+'_'+Date.now()+'.xlsx');
}

    html += '<tr><td>'+u.displayName+'</td><td>'+u.username+'</td><td>'+(u.role==='admin'?'مدير':'كاشير')+'</td><td>';
    html += '<button class="btn btn-secondary btn-sm" onclick="openChangePasswordModal(\''+u.id+'\')">🔑 تغيير كلمة المرور</button> ';
    if(u.id!==CURRENT_USER.id) html += '<button class="btn btn-danger btn-sm" onclick="deleteUser(\''+u.id+'\')">🗑️ حذف</button>';
    html += '</td></tr>';
  });
  html += '</table></div>';
  html += '<div class="danger-zone"><h3>⚠️ منطقة الخطر</h3><p class="note">سيؤدي الضغط على الزر التالي إلى حذف جميع البيانات نهائياً من جميع الأجهزة (منتجات، مبيعات، مستخدمين، خزنة، شيفتات، محافظ، مرتجعات، توالف... كل حاجة) والرجوع لنقطة الصفر. هذا الإجراء لا يمكن التراجع عنه.</p><button class="btn btn-danger" onclick="resetAllData()">🔄 إعادة ضبط كامل (تصفير كل البيانات)</button></div>';
  document.getElementById('tabContent').innerHTML = html;
}
function openAddUserModal(){
  var html = '<h3>إضافة مستخدم</h3><div class="form-row"><label>الاسم الظاهر</label><input class="input" id="newUserDisplayName"></div><div class="form-row"><label>اسم الدخول</label><input class="input" id="newUserUsername"></div><div class="form-row"><label>كلمة المرور</label><input class="input" id="newUserPassword"></div><div class="form-row"><label>الصلاحية</label><select class="input" id="newUserRole"><option value="cashier">كاشير</option><option value="admin">مدير</option></select></div><button class="btn btn-primary btn-block" onclick="saveNewUser()">حفظ</button>';
  openModal(html);
}
function saveNewUser(){
  var displayName = document.getElementById('newUserDisplayName').value.trim();
  var username = document.getElementById('newUserUsername').value.trim();
  var password = document.getElementById('newUserPassword').value;
  var role = document.getElementById('newUserRole').value;
  if(!displayName||!username||!password){ alert('أدخل كل البيانات'); return; }
  var users = getUsers();
  users.push({id:genId('user'), username:username, password:password, role:role, displayName:displayName});
  saveUsers(users);
  closeModal(); renderUsers();
}
function deleteUser(id){
  if(!confirm('حذف هذا المستخدم؟')) return;
  var users = getUsers().filter(function(u){ return u.id!==id; });
  saveUsers(users);
  renderUsers();
}
function openChangePasswordModal(id){
  var html = '<h3>تغيير كلمة المرور</h3><div class="form-row"><label>كلمة المرور الجديدة</label><input class="input" id="newPassValue"></div><button class="btn btn-primary btn-block" onclick="saveNewPassword(\''+id+'\')">حفظ</button>';
  openModal(html);
}
function saveNewPassword(id){
  var newPass = document.getElementById('newPassValue').value;
  if(!newPass){ alert('أدخل كلمة مرور'); return; }
  var users = getUsers();
  var u = users.find(function(x){ return x.id===id; });
  if(!u) return;
  u.password = newPass;
  saveUsers(users);
  closeModal(); renderUsers();
  alert('تم تغيير كلمة المرور بنجاح');
}

/* ================= FULL RESET ================= */
function resetAllData(){
  if(CURRENT_USER.role!=='admin'){ alert('غير مسموح'); return; }
  if(!confirm('سيتم حذف جميع البيانات نهائياً من جميع الأجهزة (منتجات، مبيعات، مستخدمين، خزنة، شيفتات، محافظ، مرتجعات، توالف) ولا يمكن التراجع. هل أنت متأكد؟')) return;
  if(!confirm('تأكيد نهائي: هل تريد فعلاً مسح كل شيء والبدء من الصفر؟')) return;
  var batch = db.batch();
  SYNC_KEYS.forEach(function(key){
    var ref = db.collection('cashier_data').doc(key);
    batch.delete(ref);
  });
  batch.commit().then(function(){
    alert('تم مسح جميع البيانات بنجاح. سيتم تسجيل الخروج وإعادة تحميل الصفحة.');
    sessionStorage.removeItem('current_user');
    window.location.reload();
  }).catch(function(e){ alert('حدث خطأ أثناء المسح: '+e.message); });
}
</script>
