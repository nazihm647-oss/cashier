<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>زين ماركت - نظام الكاشير</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Cairo',sans-serif;background:#f1f8f4;direction:rtl;color:#222;}
input,select{font-family:'Cairo',sans-serif;padding:8px;border:1px solid #ccc;border-radius:8px;width:100%;margin:4px 0 10px 0;font-size:14px;}
label{font-weight:600;font-size:13px;display:block;margin-top:6px;}
.btn{background:#e2e2e2;border:none;padding:8px 14px;border-radius:8px;cursor:pointer;font-family:'Cairo',sans-serif;font-size:13px;margin:3px;}
.btn-primary{background:#1e8e4a;color:#fff;}
.btn-danger{background:#d9362e;color:#fff;}
.btn-xs{padding:4px 8px;font-size:12px;background:#ddd;border:none;border-radius:6px;cursor:pointer;margin:2px;}
.btn-xs.btn-primary{background:#1e8e4a;color:#fff;}
.btn-xs.btn-danger{background:#d9362e;color:#fff;}
.btn-sm{padding:5px 10px;font-size:12px;background:#fff;border-radius:8px;cursor:pointer;border:none;}
.btn-icon{background:transparent;border:none;cursor:pointer;font-size:16px;color:#fff;}
.row-flex{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:10px 0;}

/* Loading */
#loadingScreen{position:fixed;inset:0;background:#145c30;color:#fff;display:flex;align-items:center;justify-content:center;font-size:20px;z-index:9999;}

/* Login */
.login-screen{position:fixed;inset:0;background:linear-gradient(135deg,#1e8e4a,#145c30);display:flex;align-items:center;justify-content:center;}
.login-box{background:#fff;padding:30px;border-radius:16px;width:320px;text-align:center;box-shadow:0 8px 30px rgba(0,0,0,.3);}
.login-box .logo-circle{width:70px;height:70px;border-radius:50%;background:#1e8e4a;color:#fff;font-size:34px;display:flex;align-items:center;justify-content:center;margin:0 auto 10px;}

/* Topbar */
.topbar-inner{background:linear-gradient(135deg,#1e8e4a,#145c30);color:#fff;display:flex;justify-content:space-between;align-items:center;padding:10px 20px;flex-wrap:wrap;}
.brand{display:flex;align-items:center;gap:10px;}
.logo-circle{width:42px;height:42px;border-radius:50%;background:#fff;color:#1e8e4a;font-size:22px;display:flex;align-items:center;justify-content:center;}
.brand-title{font-weight:900;font-size:18px;}
.brand-sub{font-size:11px;opacity:.85;}
.topbar-right{display:flex;align-items:center;gap:10px;font-size:13px;}
.user-chip{background:rgba(255,255,255,.2);padding:4px 10px;border-radius:20px;}

/* Tabs */
.tabs-bar{display:flex;flex-wrap:wrap;background:#fff;padding:6px 10px;gap:5px;border-bottom:2px solid #d9ecd9;position:sticky;top:0;z-index:50;}
.tab-btn{background:#eef7ee;border:none;padding:8px 14px;border-radius:20px;cursor:pointer;font-family:'Cairo',sans-serif;font-size:13px;font-weight:600;color:#145c30;}
.tab-btn.active{background:#1e8e4a;color:#fff;}

.tab-content{padding:15px;}

/* Cards / badges */
.cards-row{display:flex;gap:12px;flex-wrap:wrap;margin:10px 0;}
.stat-card{background:#fff;border-radius:12px;padding:15px 20px;box-shadow:0 2px 8px rgba(0,0,0,.08);min-width:150px;text-align:center;font-size:13px;}
.stat-card b{font-size:18px;color:#1e8e4a;}
.badge{padding:3px 10px;border-radius:12px;font-size:12px;}
.badge-green{background:#d4f7dc;color:#145c30;}
.badge-red{background:#fbd7d4;color:#a32a22;}
.badge-orange{background:#ffe9c2;color:#8a5a00;}

/* Tables */
.data-table,.mini-table{width:100%;border-collapse:collapse;background:#fff;border-radius:10px;overflow:hidden;margin:10px 0;font-size:13px;}
.data-table th,.data-table td,.mini-table th,.mini-table td{padding:8px;text-align:center;border-bottom:1px solid #eee;}
.data-table th,.mini-table th{background:#eef7ee;color:#145c30;}

/* Banner */
.banner{padding:10px 15px;border-radius:10px;margin-bottom:10px;font-size:13px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;}
.banner.warning{background:#ffe9c2;color:#8a5a00;}
.banner.info{background:#d4f7dc;color:#145c30;}

/* Cashier split */
.cashier-split{display:flex;gap:15px;align-items:flex-start;}
.cashier-cart-panel{flex:1;min-width:0;background:#fff;border-radius:12px;padding:15px;box-shadow:0 2px 8px rgba(0,0,0,.08);position:sticky;top:60px;max-height:calc(100vh - 160px);overflow-y:auto;}
.cashier-products-panel{flex:1;min-width:0;}
.product-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;margin-top:10px;max-height:calc(100vh - 230px);overflow-y:auto;padding-right:5px;}
.product-card{background:#fff;border-radius:10px;padding:10px;text-align:center;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.08);font-size:13px;}
.product-card:hover{box-shadow:0 4px 12px rgba(0,0,0,.15);}
.product-card.out{background:#fbd7d4;}
.product-card.low{background:#ffe9c2;}
.pc-name{font-weight:700;margin-bottom:4px;}
.pc-price{color:#1e8e4a;font-weight:700;}
.pc-stock{font-size:11px;color:#777;}
@media(max-width:860px){
  .cashier-split{flex-direction:column;}
  .cashier-cart-panel{position:static;max-height:none;width:100%;}
  .product-grid{max-height:none;}
}

/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:999;padding:15px;}
.modal-box{background:#fff;border-radius:14px;padding:20px;width:420px;max-width:95%;max-height:90vh;overflow-y:auto;position:relative;}
.modal-x-close{position:absolute;top:10px;left:10px;background:transparent;border:none;font-size:18px;cursor:pointer;}

/* Scanner */
.scanner-overlay{position:fixed;inset:0;background:rgba(0,0,0,.8);display:flex;align-items:center;justify-content:center;z-index:1000;flex-direction:column;gap:10px;}
.scanner-box{background:#fff;padding:15px;border-radius:12px;text-align:center;}

.flash-new{animation:flashRow 1.2s ease;}
@keyframes flashRow{from{background:#ffe9a8;}to{background:transparent;}}
</style>
</head>
<body>

<div id="loadingScreen">⏳ جاري تحميل زين ماركت...</div>

<div id="loginScreen" class="login-screen" style="display:none;">
  <div class="login-box">
    <div class="logo-circle">🛒</div>
    <h2>زين ماركت</h2>
    <p style="margin-bottom:15px;color:#777;">نظام إدارة الكاشير</p>
    <input id="loginUsername" placeholder="اسم المستخدم">
    <input id="loginPassword" type="password" placeholder="كلمة المرور">
    <div id="loginError" style="color:#d9362e;font-size:13px;margin-bottom:8px;"></div>
    <button class="btn btn-primary" style="width:100%;" onclick="doLogin()">دخول</button>
  </div>
</div>

<div id="appScreen" style="display:none;">
  <div id="topbar"></div>
  <div id="tabsBar" class="tabs-bar"></div>
  <div id="tabContent" class="tab-content"></div>
</div>

<div id="modalOverlay" class="modal-overlay" style="display:none;" onclick="if(event.target===this)closeModal()">
  <div class="modal-box" id="modalBox"></div>
</div>

<div id="scannerOverlay" class="scanner-overlay" style="display:none;">
  <div class="scanner-box">
    <div id="scannerContainer" style="width:300px;"></div>
    <button class="btn btn-danger" onclick="closeBarcodeScanner()">إغلاق الكاميرا</button>
  </div>
</div>

<script>
/* ========== CONFIG ========== */
var APP_BUILD = 4;
var firebaseConfig = {
  apiKey: "AIzaSyDIp3OlRAP0Wa7Ea1W87NZkYAwOe0xueSQ",
  authDomain: "casheir-840ee.firebaseapp.com",
  projectId: "casheir-840ee",
  storageBucket: "casheir-840ee.firebasestorage.app",
  messagingSenderId: "1078746217763",
  appId: "1:1078746217763:web:7f74831f502ca1b20be096"
};
var SYNC_KEYS = ['cashier_users','cashier_products','cashier_sales','cashier_purchases','cashier_suppliers','cashier_disbursements','cashier_shifts','cashier_stock_adjustments','cashier_wallets','cashier_wallet_transactions','invoice_counter','purchase_counter','wallet_counter'];
var ROLE_PERMISSIONS = {
  admin: ['cashier','purchases','disbursements','wallets','live','inventory','products','reports','profit','users'],
  cashier: ['cashier','purchases','disbursements','wallets','reports']
};
var TAB_DEFS = [
  {id:'cashier', label:'💰 الكاشير'},
  {id:'purchases', label:'📥 فواتير الشراء'},
  {id:'disbursements', label:'💸 طلبات الصرف'},
  {id:'wallets', label:'💳 المحافظ الإلكترونية'},
  {id:'live', label:'📡 متابعة مباشرة'},
  {id:'inventory', label:'📦 المخزون'},
  {id:'products', label:'🛒 المنتجات'},
  {id:'reports', label:'📊 التقارير'},
  {id:'profit', label:'📈 الأرباح'},
  {id:'users', label:'👥 إدارة المستخدمين'}
];

/* ========== STATE ========== */
var db = null;
var _dataCache = {};
var LOADED_KEYS = {};
var APP_READY = false;
var CURRENT_USER = null;
var currentTab = 'cashier';
var CART = [];
var PURCHASE_CART = [];
var liveFeedInterval = null;
var html5QrCodeInstance = null;
var LAST_SEEN_SALE_COUNT = 0;

/* ========== BOOT ========== */
function loadScript(src){
  return new Promise(function(resolve,reject){
    var s=document.createElement('script');
    s.src=src; s.onload=resolve; s.onerror=function(){reject(new Error('فشل تحميل '+src));};
    document.head.appendChild(s);
  });
}
async function bootApp(){
  try{
    await loadScript('https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js');
    await loadScript('https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js');
    firebase.initializeApp(firebaseConfig);
    db = firebase.firestore();
    try{ await db.enablePersistence({synchronizeTabs:true}); }catch(e){ console.warn('persistence not enabled', e); }
    initRealtimeSync();
  }catch(e){
    showFatalError(e);
  }
}
function showFatalError(e){
  document.getElementById('loadingScreen').innerHTML = '❌ حدث خطأ أثناء الاتصال بالخادم: '+e.message+'<br><button class="btn" onclick="location.reload()">إعادة المحاولة</button>';
}
function defaultValueFor(key){
  if(key==='cashier_wallets') return {vodafone:0, instapay:0};
  if(key==='invoice_counter'||key==='purchase_counter'||key==='wallet_counter') return 0;
  return [];
}
function initRealtimeSync(){
  SYNC_KEYS.forEach(function(key){
    db.collection('cashier_data').doc(key).onSnapshot(function(doc){
      _dataCache[key] = doc.exists ? doc.data().value : defaultValueFor(key);
      LOADED_KEYS[key] = true;
      checkAllLoaded();
      if(APP_READY){ updateConnStatus(true); refreshCurrentView(); }
    }, function(err){
      console.error(err);
      updateConnStatus(false);
    });
  });
}
function checkAllLoaded(){
  var allLoaded = SYNC_KEYS.every(function(k){return LOADED_KEYS[k];});
  if(allLoaded && !APP_READY){
    APP_READY = true;
    seedData();
    document.getElementById('loadingScreen').style.display='none';
    var saved = sessionStorage.getItem('current_user');
    if(saved){ CURRENT_USER = JSON.parse(saved); showApp(); } else { showLogin(); }
  }
}
function seedData(){
  if(getUsers().length===0){
    saveUsers([
      {id:'1', username:'MOHAMED NAZIH', password:'admin123', role:'admin', displayName:'MOHAMED NAZIH'},
      {id:'2', username:'ABDALLAH', password:'cashier123', role:'cashier', displayName:'ABDALLAH'}
    ]);
  }
}
window.addEventListener('load', bootApp);
window.onerror = function(msg,url,line,col,err){
  try{
    var mo=document.getElementById('modalOverlay'); if(mo) mo.style.display='none';
    var so=document.getElementById('scannerOverlay'); if(so) so.style.display='none';
    if(html5QrCodeInstance){ try{ html5QrCodeInstance.stop(); }catch(e){} }
  }catch(e){}
  console.error('Global error:', msg, err);
};

/* ========== DATA LAYER ========== */
function save(key, value){
  _dataCache[key] = value;
  if(db){
    db.collection('cashier_data').doc(key).set({value:value, updatedAt: firebase.firestore.FieldValue.serverTimestamp()}).catch(function(e){console.error(e);});
  }
}
async function nextCounter(key){
  var ref = db.collection('cashier_data').doc(key);
  var newVal;
  await db.runTransaction(async function(tx){
    var doc = await tx.get(ref);
    var cur = (doc.exists && doc.data().value) ? doc.data().value : 0;
    newVal = cur+1;
    tx.set(ref, {value:newVal, updatedAt: firebase.firestore.FieldValue.serverTimestamp()});
  });
  _dataCache[key] = newVal;
  return newVal;
}
function genId(prefix){ return (prefix||'id')+'_'+Date.now()+'_'+Math.floor(Math.random()*100000); }

function getUsers(){ return (_dataCache['cashier_users']||[]).slice(); }
function saveUsers(v){ save('cashier_users', v); }
function getProducts(){ return (_dataCache['cashier_products']||[]).slice(); }
function saveProducts(v){ save('cashier_products', v); }
function getSales(){ return (_dataCache['cashier_sales']||[]).slice(); }
function saveSales(v){ save('cashier_sales', v); }
function getPurchases(){ return (_dataCache['cashier_purchases']||[]).slice(); }
function savePurchases(v){ save('cashier_purchases', v); }
function getSuppliers(){ return (_dataCache['cashier_suppliers']||[]).slice(); }
function saveSuppliers(v){ save('cashier_suppliers', v); }
function getDisbursements(){ return (_dataCache['cashier_disbursements']||[]).slice(); }
function saveDisbursements(v){ save('cashier_disbursements', v); }
function getShifts(){ return (_dataCache['cashier_shifts']||[]).slice(); }
function saveShifts(v){ save('cashier_shifts', v); }
function getStockAdjustments(){ return (_dataCache['cashier_stock_adjustments']||[]).slice(); }
function saveStockAdjustments(v){ save('cashier_stock_adjustments', v); }
function getWallets(){
  var w = _dataCache['cashier_wallets'];
  if(!w || Array.isArray(w)) return {vodafone:0, instapay:0};
  return w;
}
function saveWallets(v){ save('cashier_wallets', v); }
function getWalletTransactions(){ return (_dataCache['cashier_wallet_transactions']||[]).slice(); }
function saveWalletTransactions(v){ save('cashier_wallet_transactions', v); }

/* ========== UTIL ========== */
function formatDate(iso){ if(!iso) return ''; return new Date(iso).toLocaleDateString('ar-EG'); }
function formatDateTime(iso){ if(!iso) return ''; return new Date(iso).toLocaleString('ar-EG'); }
function todayStr(){ return new Date().toISOString().slice(0,10); }
function monthStr(){ return new Date().toISOString().slice(0,7); }
function paymentMethodLabel(m){ return m==='cash'?'نقدي':(m==='vodafone'?'فودافون كاش':'انستاباي'); }
function opLabel(op){ return op==='withdraw'?'سحب/تحويل':(op==='deposit'?'إيداع':'بيع'); }

/* ========== AUTH ========== */
function showLogin(){ document.getElementById('loginScreen').style.display='flex'; document.getElementById('appScreen').style.display='none'; }
function showApp(){
  document.getElementById('loginScreen').style.display='none';
  document.getElementById('appScreen').style.display='block';
  renderTopbar(); renderTabsBar(); renderActiveTab();
}
function doLogin(){
  var username = document.getElementById('loginUsername').value.trim();
  var password = document.getElementById('loginPassword').value;
  var u = getUsers().find(function(x){ return x.username===username && x.password===password; });
  if(!u){ document.getElementById('loginError').textContent='اسم المستخدم أو كلمة المرور غير صحيحة'; return; }
  CURRENT_USER = u;
  sessionStorage.setItem('current_user', JSON.stringify(u));
  showApp();
}
function doLogout(){
  sessionStorage.removeItem('current_user');
  CURRENT_USER = null;
  window.location.replace(window.location.pathname);
}

/* ========== TOPBAR / TABS ========== */
function updateConnStatus(ok){
  var el = document.getElementById('connStatus');
  if(el) el.textContent = (ok?'🟢 متصل':'🔴 غير متصل')+' (نسخة '+APP_BUILD+')';
}
function manualRefresh(){ renderTopbar(); renderActiveTab(); }
function renderTopbar(){
  var el = document.getElementById('topbar');
  if(!el) return;
  el.innerHTML = '<div class="topbar-inner">'+
    '<div class="brand"><div class="logo-circle">🛒</div><div><div class="brand-title">زين ماركت</div><div class="brand-sub">نظام إدارة الكاشير</div></div></div>'+
    '<div class="topbar-right">'+
      '<span id="connStatus">🟢 متصل (نسخة '+APP_BUILD+')</span>'+
      '<button class="btn-icon" onclick="manualRefresh()" title="تحديث">🔄</button>'+
      (CURRENT_USER? '<span class="user-chip">👤 '+CURRENT_USER.displayName+'</span><button class="btn btn-sm" onclick="doLogout()">خروج</button>':'')+
    '</div></div>';
}
function renderTabsBar(){
  if(!CURRENT_USER) return;
  var allowed = ROLE_PERMISSIONS[CURRENT_USER.role]||[];
  document.getElementById('tabsBar').innerHTML = TAB_DEFS.filter(function(t){return allowed.indexOf(t.id)>=0;}).map(function(t){
    return '<button class="tab-btn'+(currentTab===t.id?' active':'')+'" onclick="switchTab(\''+t.id+'\')">'+t.label+'</button>';
  }).join('');
}
function switchTab(id){
  closeBarcodeScanner();
  closeModal();
  currentTab = id;
  renderTabsBar();
  renderActiveTab();
}
function renderActiveTab(){
  var map = {cashier:renderCashier, purchases:renderPurchases, disbursements:renderDisbursements, wallets:renderWallets, live:renderLive, inventory:renderInventory, products:renderProducts, reports:renderReports, profit:renderProfit, users:renderUsers};
  var fn = map[currentTab];
  if(fn) fn();
}
function refreshCurrentView(){
  try{ if(CURRENT_USER){ renderTopbar(); renderActiveTab(); } }catch(e){ console.error(e); }
}

/* ========== MODAL ========== */
function showModal(html){
  document.getElementById('modalBox').innerHTML = '<button class="modal-x-close" onclick="closeModal()">✖</button>'+html;
  document.getElementById('modalOverlay').style.display='flex';
}
function closeModal(){ var o=document.getElementById('modalOverlay'); if(o) o.style.display='none'; }

/* ========== BARCODE SCANNER ========== */
function ensureBarcodeLib(){
  if(window.Html5Qrcode) return Promise.resolve();
  return loadScript('https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js');
}
function openBarcodeScanner(onResult){
  ensureBarcodeLib().then(function(){
    document.getElementById('scannerOverlay').style.display='flex';
    html5QrCodeInstance = new Html5Qrcode('scannerContainer');
    html5QrCodeInstance.start({facingMode:'environment'}, {fps:10, qrbox:250}, function(decodedText){
      onResult(decodedText);
      closeBarcodeScanner();
    }, function(err){}).catch(function(err){
      alert('تعذر تشغيل الكاميرا: '+err);
      closeBarcodeScanner();
    });
  }).catch(function(e){ alert('تعذر تحميل مكتبة المسح: '+e.message); });
}
function closeBarcodeScanner(){
  var overlay = document.getElementById('scannerOverlay');
  if(overlay) overlay.style.display='none';
  if(html5QrCodeInstance){
    try{ html5QrCodeInstance.stop().then(function(){ html5QrCodeInstance.clear(); }); }catch(e){}
    html5QrCodeInstance = null;
  }
}
function scanIntoField(fieldId){
  openBarcodeScanner(function(code){ var f=document.getElementById(fieldId); if(f) f.value=code; });
}

/* ========== EXCEL ========== */
function ensureXLSX(){
  if(window.XLSX) return Promise.resolve();
  return loadScript('https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js');
}
function downloadSheet(rows, sheetName, fileName){
  ensureXLSX().then(function(){
    var ws = XLSX.utils.json_to_sheet(rows);
    var wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, sheetName);
    XLSX.writeFile(wb, fileName);
  });
}
function exportProductsExcel(){
  var rows = getProducts().map(function(p){ return {'الاسم':p.name,'الباركود':p.barcode,'سعر البيع':p.price,'سعر التكلفة':p.costPrice||0,'المخزون':p.stock,'الحد الأدنى':p.minStock,'تاريخ الإضافة':formatDate(p.dateAdded)}; });
  downloadSheet(rows, 'المنتجات', 'products_'+Date.now()+'.xlsx');
}
function exportInventoryExcel(){
  var rows = getProducts().map(function(p){ return {'اسم المنتج':p.name,'الباركود':p.barcode||'','المخزون الحالي':p.stock,'الحد الأدنى':p.minStock,'سعر التكلفة':p.costPrice||0,'سعر البيع':p.price,'تاريخ الإضافة':formatDate(p.dateAdded)}; });
  downloadSheet(rows, 'المخزون', 'inventory_'+Date.now()+'.xlsx');
}
function exportDisbursementsExcel(){
  var rows = getDisbursements().map(function(d){ return {'التاريخ':formatDateTime(d.date),'الوصف':d.description,'المبلغ':d.amount,'المصدر':d.source==='drawer'?'الدرج':'الخزنة','بواسطة':d.requestedBy,'الحالة':d.status}; });
  downloadSheet(rows, 'طلبات الصرف', 'disbursements_'+Date.now()+'.xlsx');
}
function exportSalesExcel(){
  var sales = getSales();
  if(CURRENT_USER.role!=='admin'){ sales = sales.filter(function(s){return s.soldBy===CURRENT_USER.displayName;}); }
  var rows = sales.map(function(s){ return {'رقم الفاتورة':s.invoiceNum,'التاريخ':formatDateTime(s.date),'الكاشير':s.soldBy,'الإجمالي':s.total,'طريقة الدفع':paymentMethodLabel(s.paymentMethod)}; });
  downloadSheet(rows, 'المبيعات', 'sales_'+Date.now()+'.xlsx');
}
function exportWalletsExcel(){
  var txs = getWalletTransactions();
  if(CURRENT_USER.role!=='admin'){ txs = txs.filter(function(t){return t.user===CURRENT_USER.displayName;}); }
  var rows = txs.map(function(t){ return {'التاريخ':formatDateTime(t.date),'المحفظة':t.walletType==='vodafone'?'فودافون كاش':'انستاباي','العملية':opLabel(t.operation),'المبلغ':t.amount,'العمولة':t.commission||0,'المستخدم':t.user}; });
  downloadSheet(rows, 'المحافظ', 'wallets_'+Date.now()+'.xlsx');
}
function getProfitBreakdown(sales){
  var map = {};
  sales.forEach(function(sale){
    (sale.items||[]).forEach(function(it){
      if(!map[it.productId]) map[it.productId] = {name:it.name, qty:0, saleTotal:0, costTotal:0};
      map[it.productId].qty += it.qty;
      map[it.productId].saleTotal += it.price*it.qty;
      map[it.productId].costTotal += (it.costPrice||0)*it.qty;
    });
  });
  return Object.keys(map).map(function(k){ var r=map[k]; r.profit=r.saleTotal-r.costTotal; return r; });
}
function exportProfitExcel(period){
  if(CURRENT_USER.role!=='admin'){ alert('غير مسموح'); return; }
  var sales = getSales();
  var filtered, label;
  if(period==='daily'){ var t=todayStr(); filtered=sales.filter(function(s){return s.date.slice(0,10)===t;}); label='ربح_يومي'; }
  else { var m=monthStr(); filtered=sales.filter(function(s){return s.date.slice(0,7)===m;}); label='ربح_شهري'; }
  var breakdown = getProfitBreakdown(filtered);
  var rows = breakdown.map(function(r){ return {'المنتج':r.name,'الكمية':r.qty,'إجمالي البيع':r.saleTotal,'إجمالي التكلفة':r.costTotal,'الربح':r.profit}; });
  if(period==='monthly'){
    var m2=monthStr();
    var monthDisb = getDisbursements().filter(function(d){return d.status==='approved' && d.date.slice(0,7)===m2;});
    var expensesTotal = monthDisb.reduce(function(a,d){return a+d.amount;},0);
    var grossProfit = filtered.reduce(function(a,s){return a+(s.profit||0);},0);
    rows.push({'المنتج':'--- إجمالي الربح قبل المصاريف ---','الكمية':'','إجمالي البيع':'','إجمالي التكلفة':'','الربح':grossProfit});
    rows.push({'المنتج':'مصاريف الشهر المعتمدة','الكمية':'','إجمالي البيع':'','إجمالي التكلفة':'','الربح':-expensesTotal});
    rows.push({'المنتج':'--- صافي الربح النهائي ---','الكمية':'','إجمالي البيع':'','إجمالي التكلفة':'','الربح':grossProfit-expensesTotal});
  }
  downloadSheet(rows, 'الأرباح', label+'_'+Date.now()+'.xlsx');
}

/* ========== SHIFT SYSTEM ========== */
function getActiveShift(){
  return getShifts().find(function(s){ return s.cashierName===CURRENT_USER.displayName && !s.closed; });
}
function calcShiftStats(shift){
  try{
    var sales = getSales().filter(function(s){ return s.shiftId===shift.id; });
    var cashSales = sales.filter(function(s){return s.paymentMethod==='cash';}).reduce(function(a,s){return a+s.total;},0);
    var walletTx = getWalletTransactions().filter(function(t){
      return t.user===shift.cashierName && new Date(t.date)>=new Date(shift.startTime) && (!shift.endTime || new Date(t.date)<=new Date(shift.endTime));
    });
    var walletCashTotal = walletTx.reduce(function(a,t){return a+(t.cashEffect||0);},0);
    var disb = getDisbursements().filter(function(d){
      return d.status==='approved' && d.source==='drawer' && d.requestedBy===shift.cashierName && new Date(d.date)>=new Date(shift.startTime) && (!shift.endTime || new Date(d.date)<=new Date(shift.endTime));
    });
    var expensesTotal = disb.reduce(function(a,d){return a+d.amount;},0);
    var expected = (shift.openingAmount||0) + cashSales - expensesTotal + walletCashTotal;
    return {cashSales:cashSales, expensesTotal:expensesTotal, walletCashTotal:walletCashTotal, expected:expected};
  }catch(e){
    return {cashSales:0, expensesTotal:0, walletCashTotal:0, expected: shift?(shift.openingAmount||0):0};
  }
}

    var stats = calcShiftStats(shift);

  }catch(e){ alert('حدث خطأ: '+e.message); }

function confirmEndShift(){
  try{
    var actual = parseFloat(document.getElementById('shiftCloseAmt').value)||0;
    var shifts = getShifts();
    var idx=-1;
    for(var i=0;i<shifts.length;i++){ if(shifts[i].cashierName===CURRENT_USER.displayName && !shifts[i].closed){ idx=i; break; } }
    if(idx===-1){ alert('لا يوجد شيفت مفتوح حالياً. ربما تم إنهاؤه بالفعل من جهاز آخر. اضغط 🔄 لتحديث الصفحة'); closeModal(); renderCashier(); return; }
    var shift = shifts[idx];
    var stats = calcShiftStats(shift);
    shift.closed = true;
    shift.endTime = new Date().toISOString();
    shift.closingAmount = actual;
    shift.expectedAmount = stats.expected;
    shift.difference = actual - stats.expected;
    saveShifts(shifts);

    renderCashier();

function updateCartTotalsDisplay(){
  var discountPercent = parseFloat(document.getElementById('cartDiscount').value)||0;

  var discountAmount = subtotal*discountPercent/100;
  var afterDiscount = subtotal-discountAmount;
  var taxAmount = afterDiscount*taxPercent/100;
  var total = afterDiscount+taxAmount;
  var el = document.getElementById('cartTotalsSummary');
  if(el) el.innerHTML = 'الفرعي: '+subtotal.toFixed(2)+' | الخصم: '+discountAmount.toFixed(2)+' | الضريبة: '+taxAmount.toFixed(2)+' | <span style="color:#1e8e4a;">الإجمالي: '+total.toFixed(2)+' ج</span>';

async function processCheckout(paymentMethod){
  try{
    if(CART.length===0){ alert('السلة فارغة'); return; }
    var shift = getActiveShift();
    if(!shift){ alert('يجب بدء شيفت أولاً'); return; }
    var discountPercent = parseFloat(document.getElementById('cartDiscount').value)||0;
    var taxPercent = parseFloat(document.getElementById('cartTax').value)||0;
    var subtotal = CART.reduce(function(a,c){return a+c.price*c.qty;},0);
    var discountAmount = subtotal*discountPercent/100;
    var afterDiscount = subtotal-discountAmount;
    var taxAmount = afterDiscount*taxPercent/100;
    var total = afterDiscount+taxAmount;
    var invoiceNum = await nextCounter('invoice_counter');
    var grossProfit = CART.reduce(function(a,c){ return a+((c.price-(c.costPrice||0))*c.qty); },0);
    var profit = grossProfit - discountAmount;
    var sale = {invoiceNum:invoiceNum, date:new Date().toISOString(), items:CART.slice(), subtotal:subtotal, discountPercent:discountPercent, taxPercent:taxPercent, total:total, soldBy:CURRENT_USER.displayName, paymentMethod:paymentMethod, shiftId:shift.id, profit:profit};
    var products = getProducts();
    CART.forEach(function(c){
      var p = products.find(function(x){return x.id===c.productId;});
      if(p){ p.stock = (p.stock||0) - c.qty; } // allowed to go negative intentionally
    });
    saveProducts(products);
    var sales = getSales(); sales.push(sale); saveSales(sales);
    if(paymentMethod==='vodafone' || paymentMethod==='instapay'){
      var wallets = getWallets();
      wallets[paymentMethod] = (wallets[paymentMethod]||0) + total;
      saveWallets(wallets);
      var txs = getWalletTransactions();
      txs.push({id:genId('wtx'), walletType:paymentMethod, operation:'sale', amount:total, commission:0, phone:'', cashEffect:0, walletEffect:total, date:new Date().toISOString(), user:CURRENT_USER.displayName});
      saveWalletTransactions(txs);
    }
    CART = [];
    showInvoice(sale);
    renderCashier();
  }catch(e){
    alert('حدث خطأ أثناء إتمام البيع: '+e.message);
  }
}
function showInvoice(sale){
  var itemsHtml = sale.items.map(function(it){ return '<tr><td>'+it.name+'</td><td>'+it.qty+'</td><td>'+it.price.toFixed(2)+'</td><td>'+(it.price*it.qty).toFixed(2)+'</td></tr>'; }).join('');
  var html = '<div id="invoiceContent"><h2>🛒 زين ماركت</h2><p>فاتورة رقم: '+sale.invoiceNum+'</p><p>التاريخ: '+formatDateTime(sale.date)+'</p><p>الكاشير: '+sale.soldBy+'</p>'+
  '<table class="mini-table"><thead><tr><th>المنتج</th><th>الكمية</th><th>السعر</th><th>الإجمالي</th></tr></thead><tbody>'+itemsHtml+'</tbody></table>'+
  '<p>الإجمالي الفرعي: '+sale.subtotal.toFixed(2)+'</p><p>الخصم: '+sale.discountPercent+'%</p><p>الضريبة: '+sale.taxPercent+'%</p>'+
  '<p><b>الإجمالي النهائي: '+sale.total.toFixed(2)+' ج</b></p><p>طريقة الدفع: '+paymentMethodLabel(sale.paymentMethod)+'</p></div>'+
  '<div class="row-flex"><button class="btn btn-primary" onclick="printInvoice()">🖨️ طباعة</button><button class="btn" onclick="closeModal()">إغلاق</button></div>';
  showModal(html);
}
function printInvoice(){
  var content = document.getElementById('invoiceContent').innerHTML;

  w.document.write('<html dir="rtl" lang="ar"><head><meta charset="utf-8"><title>فاتورة</title><style>body{font-family:Cairo,sans-serif;padding:20px;}table{width:100%;border-collapse:collapse;}td,th{border:1px solid #ccc;padding:5px;text-align:center;}</style></head><body>'+content+'</body></html>');

}

function toggleNewProductFields(){

  document.getElementById('purNewFields').style.display = sel? 'none':'block';
}
function addPurchaseItem(){
  var existingId = document.getElementById('purExistingProduct').value;
  var qty = parseFloat(document.getElementById('purQty').value)||0;
  var cost = parseFloat(document.getElementById('purCost').value)||0;
  var sell = parseFloat(document.getElementById('purSell').value)||0;
  if(qty<=0){ alert('أدخل كمية صحيحة'); return; }
  if(existingId){
    var p = getProducts().find(function(x){return x.id===existingId;});
    PURCHASE_CART.push({productId:existingId, name:p.name, qty:qty, costPrice:cost, sellPrice:sell, isNew:false});
  } else {
    var name = document.getElementById('purNewName').value.trim();
    if(!name){ alert('اكتب اسم المنتج الجديد'); return; }
    PURCHASE_CART.push({productId:null, name:name, barcode:document.getElementById('purNewBarcode').value.trim(), qty:qty, costPrice:cost, sellPrice:sell, isNew:true});
  }
  renderPurchaseItemsList();
}
function renderPurchaseItemsList(){
  var el = document.getElementById('purItemsList');
  if(!el) return;
  el.innerHTML = '<table class="mini-table"><thead><tr><th>الصنف</th><th>الكمية</th><th>التكلفة</th><th>البيع</th></tr></thead><tbody>'+
  PURCHASE_CART.map(function(it){ return '<tr><td>'+it.name+'</td><td>'+it.qty+'</td><td>'+it.costPrice+'</td><td>'+it.sellPrice+'</td></tr>'; }).join('')+'</tbody></table>';
}
function applyPurchaseToStock(purchase){
  var products = getProducts();
  purchase.items.forEach(function(it){
    if(it.isNew){
      products.push({id:genId('prod'), name:it.name, price:it.sellPrice, costPrice:it.costPrice, stock:it.qty, barcode:it.barcode||'', minStock:5, dateAdded:new Date().toISOString()});
    } else {
      var p = products.find(function(x){return x.id===it.productId;});
      if(p){ p.stock = (p.stock||0)+it.qty; p.costPrice = it.costPrice; p.price = it.sellPrice; }
    }
  });
  saveProducts(products);
}
function buildInstallments(purchase){
  var n=3;
  var base = Math.floor((purchase.total/n)*100)/100;
  var installments=[]; var sum=0;
  for(var i=0;i<n;i++){
    var amt = (i===n-1) ? Math.round((purchase.total-sum)*100)/100 : base;
    sum += amt;
    installments.push({id:genId('inst'), amount:amt, paid:false, disbursementRequestId:null, paidDate:null});
  }
  return installments;
}
async function submitPurchase(){
  try{
    if(PURCHASE_CART.length===0){ alert('أضف صنف واحد على الأقل'); return; }
    var supplierId = document.getElementById('purSupplier').value;
    var supplier = getSuppliers().find(function(s){return s.id===supplierId;});
    if(!supplier){ alert('اختر مورد'); return; }
    var purchaseNum = await nextCounter('purchase_counter');
    var total = PURCHASE_CART.reduce(function(a,it){return a+it.costPrice*it.qty;},0);
    var purchase = {id:genId('pur'), purchaseNum:purchaseNum, date:new Date().toISOString(), supplierId:supplier.id, supplierName:supplier.name, supplierType:supplier.type, items:PURCHASE_CART.slice(), total:total, requestedBy:CURRENT_USER.displayName, status: CURRENT_USER.role==='admin'?'approved':'pending', approvedBy:null, approvedDate:null, rejectReason:null, installments:[]};
    if(purchase.status==='approved'){
      applyPurchaseToStock(purchase);
      if(supplier.type==='credit'){ purchase.installments = buildInstallments(purchase); }
    }
    var purchases = getPurchases(); purchases.push(purchase); savePurchases(purchases);
    PURCHASE_CART=[];
    closeModal();
    renderPurchases();
  }catch(e){ alert('خطأ: '+e.message); }
}
function approvePurchase(id){
  if(CURRENT_USER.role!=='admin'){ alert('غير مسموح'); return; }
  var purchases = getPurchases();
  var p = purchases.find(function(x){return x.id===id;});
  if(!p){ alert('تعذر العثور على الفاتورة'); return; }
  p.status='approved'; p.approvedBy=CURRENT_USER.displayName; p.approvedDate=new Date().toISOString();
  applyPurchaseToStock(p);
  if(p.supplierType==='credit'){ p.installments = buildInstallments(p); }
  savePurchases(purchases);
  renderPurchases();
}
function rejectPurchase(id){
  if(CURRENT_USER.role!=='admin'){ alert('غير مسموح'); return; }
  var reason = prompt('سبب الرفض؟');
  if(reason===null) return;
  var purchases = getPurchases();
  var p = purchases.find(function(x){return x.id===id;});
  if(!p) return;
  p.status='rejected'; p.rejectReason=reason;
  savePurchases(purchases);

}
function requestInstallmentDisbursement(purchaseId, installmentId){
  var purchases = getPurchases();
  var p = purchases.find(function(x){return x.id===purchaseId;});
  if(!p) return;
  var inst = p.installments.find(function(i){return i.id===installmentId;});
  if(!inst || inst.paid) return;
  var disbursements = getDisbursements();
  var req = {id:genId('disb'), description:'سداد قسط فاتورة شراء رقم '+p.purchaseNum+' - '+p.supplierName, amount:inst.amount, source:'drawer', category:'installment', purchaseId:p.id, installmentId:inst.id, requestedBy:CURRENT_USER.displayName, status: CURRENT_USER.role==='admin'?'approved':'pending', approvedBy: CURRENT_USER.role==='admin'?CURRENT_USER.displayName:null, approvedDate: CURRENT_USER.role==='admin'?new Date().toISOString():null, rejectReason:null, date:new Date().toISOString()};
  disbursements.push(req);
  saveDisbursements(disbursements);
  inst.disbursementRequestId = req.id;
  if(req.status==='approved'){ inst.paid=true; inst.paidDate=new Date().toISOString(); }
  savePurchases(purchases);
  renderPurchases();
  alert('تم إرسال طلب صرف القسط'+(req.status==='approved'?' وتمت الموافقة تلقائياً':' وبانتظار موافقة MOHAMED NAZIH'));
}

  var purchases = getPurchases();
  if(CURRENT_USER.role!=='admin'){ purchases = purchases.filter(function(p){return p.requestedBy===CURRENT_USER.displayName;}); }
  purchases.sort(function(a,b){return new Date(b.date)-new Date(a.date);});

    var statusBadge = p.status==='pending'?'<span class="badge badge-orange">بانتظار الموافقة</span>':(p.status==='approved'?'<span class="badge badge-green">موافق عليها</span>':'<span class="badge badge-red">مرفوضة ('+(p.rejectReason||'')+')</span>');

function submitWalletOp(op){
  try{
    var walletType = document.getElementById('walletTypeSel').value;
    var amount = parseFloat(document.getElementById('walletAmount').value)||0;
    var phone = document.getElementById('walletPhone').value.trim();
    if(amount<=0){ alert('أدخل مبلغ صحيح'); return; }
    var commission = op==='withdraw' ? (amount<1000?5:15) : 0;
    var wallets = getWallets();
    var cashEffect=0, walletEffect=0;
    if(op==='withdraw'){ wallets[walletType]=(wallets[walletType]||0)-amount; cashEffect=amount+commission; walletEffect=-amount; }
    else { wallets[walletType]=(wallets[walletType]||0)+amount; cashEffect=-amount; walletEffect=amount; }
    saveWallets(wallets);
    var txs = getWalletTransactions();
    txs.push({id:genId('wtx'), walletType:walletType, operation:op, amount:amount, commission:commission, phone:phone, cashEffect:cashEffect, walletEffect:walletEffect, date:new Date().toISOString(), user:CURRENT_USER.displayName});
    saveWalletTransactions(txs);
    closeModal();
    renderWallets();
  }catch(e){ alert('خطأ: '+e.message); }
}

function adjustSingleProductStock(productId){
  var products = getProducts();
  var p = products.find(function(x){return x.id===productId;});
  if(!p){ alert('تعذر العثور على المنتج'); return; }
  var newVal = prompt('أدخل الكمية الجديدة للمخزون (الحالية: '+p.stock+')', p.stock);
  if(newVal===null) return;
  newVal = parseFloat(newVal);
  if(isNaN(newVal)) return;
  var reason = prompt('سبب التسوية؟')||'';
  var before = p.stock;
  p.stock = newVal;
  saveProducts(products);
  var adjustments = getStockAdjustments();
  adjustments.push({id:genId('adj'), productId:p.id, productName:p.name, qtyBefore:before, qtyAfter:newVal, difference:newVal-before, type:(newVal>=before?'increase':'decrease'), reason:reason, date:new Date().toISOString(), user:CURRENT_USER.displayName});
  saveStockAdjustments(adjustments);
  renderInventory();
}
function scanForInventoryAdjust(){
  openBarcodeScanner(function(code){
    var p = getProducts().find(function(x){return x.barcode===code;});
    if(!p){ alert('لا يوجد منتج بهذا الباركود'); return; }
    adjustSingleProductStock(p.id);
  });
}
function openStockCountModal(){
  var products = getProducts();
  showModal('<h3>🔍 جرد دوري جديد</h3><table class="mini-table"><thead><tr><th>المنتج</th><th>الحالي</th><th>الفعلي</th></tr></thead><tbody>'+
  products.map(function(p){ return '<tr><td>'+p.name+'</td><td>'+p.stock+'</td><td><input type="number" class="stockCountInput" data-id="'+p.id+'" value="'+p.stock+'"></td></tr>'; }).join('')+
  '</tbody></table><button class="btn btn-primary" onclick="submitStockCount()">✅ حفظ الجرد</button>');
}
function submitStockCount(){
  var inputs = document.querySelectorAll('.stockCountInput');
  var products = getProducts();
  var adjustments = getStockAdjustments();
  inputs.forEach(function(inp){
    var id = inp.getAttribute('data-id');
    var newVal = parseFloat(inp.value);
    var p = products.find(function(x){return x.id===id;});
    if(p && !isNaN(newVal) && newVal!==p.stock){
      var before = p.stock;
      p.stock = newVal;
      adjustments.push({id:genId('adj'), productId:p.id, productName:p.name, qtyBefore:before, qtyAfter:newVal, difference:newVal-before, type:(newVal>=before?'increase':'decrease'), reason:'جرد دوري', date:new Date().toISOString(), user:CURRENT_USER.displayName});
    }
  });
  saveProducts(products);
  saveStockAdjustments(adjustments);
  closeModal();
  renderInventory();
}

/* ========== REPORTS TAB ========== */
function renderReports(){
  var sales = getSales();
  if(CURRENT_USER.role!=='admin'){ sales = sales.filter(function(s){return s.soldBy===CURRENT_USER.displayName;}); }
  var today = todayStr();
  var todaySales = sales.filter(function(s){return s.date.slice(0,10)===today;});
  var todayTotal = todaySales.reduce(function(a,s){return a+s.total;},0);
  var allTimeTotal = sales.reduce(function(a,s){return a+s.total;},0);
  var disb = getDisbursements().filter(function(d){return d.status==='approved';});
  if(CURRENT_USER.role!=='admin'){ disb = disb.filter(function(d){return d.requestedBy===CURRENT_USER.displayName;}); }
  var disbTotal = disb.reduce(function(a,d){return a+d.amount;},0);
  var netTotal = allTimeTotal - disbTotal;
  document.getElementById('tabContent').innerHTML = '<h2>📊 التقارير</h2>'+
  '<div class="cards-row"><div class="stat-card">مبيعات اليوم<br><b>'+todayTotal.toFixed(2)+' ج</b></div><div class="stat-card">عدد الفواتير اليوم<br><b>'+todaySales.length+'</b></div><div class="stat-card">إجمالي المبيعات<br><b>'+allTimeTotal.toFixed(2)+' ج</b></div><div class="stat-card">صافي المبيعات (بعد المصروفات)<br><b>'+netTotal.toFixed(2)+' ج</b></div></div>'+
  '<button class="btn" onclick="exportSalesExcel()">⬇️ تصدير المبيعات Excel</button>'+
  '<table class="data-table"><thead><tr><th>رقم</th><th>التاريخ</th><th>الكاشير</th><th>الإجمالي</th><th>طريقة الدفع</th></tr></thead><tbody>'+
  sales.slice().sort(function(a,b){return new Date(b.date)-new Date(a.date);}).map(function(s){ return '<tr><td>'+s.invoiceNum+'</td><td>'+formatDateTime(s.date)+'</td><td>'+s.soldBy+'</td><td>'+s.total.toFixed(2)+'</td><td>'+paymentMethodLabel(s.paymentMethod)+'</td></tr>'; }).join('')+
  '</tbody></table>';
}

/* ========== PROFIT TAB (admin only) ========== */
function renderProfit(){
  if(CURRENT_USER.role!=='admin'){ document.getElementById('tabContent').innerHTML='<p>غير مسموح لك بالدخول لهذه الصفحة</p>'; return; }
  var sales = getSales();
  var today = todayStr();
  var month = monthStr();
  var todaySales = sales.filter(function(s){return s.date.slice(0,10)===today;});
  var monthSales = sales.filter(function(s){return s.date.slice(0,7)===month;});
  var dailyProfit = todaySales.reduce(function(a,s){return a+(s.profit||0);},0);
  var monthlyGrossProfit = monthSales.reduce(function(a,s){return a+(s.profit||0);},0);
  var monthDisb = getDisbursements().filter(function(d){return d.status==='approved' && d.date.slice(0,7)===month;});
  var monthExpensesTotal = monthDisb.reduce(function(a,d){return a+d.amount;},0);
  var monthlyNetProfit = monthlyGrossProfit - monthExpensesTotal;
  var dailyBreakdown = getProfitBreakdown(todaySales);
  var monthlyBreakdown = getProfitBreakdown(monthSales);
  document.getElementById('tabContent').innerHTML = '<h2>📈 الأرباح (خاص بالإدارة فقط)</h2>'+
  '<div class="cards-row">'+
    '<div class="stat-card">ربح اليوم (بيع - تكلفة)<br><b>'+dailyProfit.toFixed(2)+' ج</b></div>'+
    '<div class="stat-card">ربح الشهر الإجمالي<br><b>'+monthlyGrossProfit.toFixed(2)+' ج</b></div>'+
    '<div class="stat-card">مصاريف الشهر المعتمدة<br><b>'+monthExpensesTotal.toFixed(2)+' ج</b></div>'+
    '<div class="stat-card">صافي ربح الشهر<br><b>'+monthlyNetProfit.toFixed(2)+' ج</b></div>'+
  '</div>'+
  '<div class="row-flex"><button class="btn btn-primary" onclick="exportProfitExcel(\'daily\')">⬇️ تصدير ربح اليوم Excel</button><button class="btn btn-primary" onclick="exportProfitExcel(\'monthly\')">⬇️ تصدير ربح الشهر Excel</button></div>'+
  '<h3>تفاصيل ربح اليوم حسب المنتج</h3>'+renderProfitTable(dailyBreakdown)+
  '<h3>تفاصيل ربح الشهر حسب المنتج</h3>'+renderProfitTable(monthlyBreakdown);
}
function renderProfitTable(breakdown){
  if(!breakdown.length) return '<p>لا توجد بيانات</p>';
  return '<table class="data-table"><thead><tr><th>المنتج</th><th>الكمية المباعة</th><th>إجمالي البيع</th><th>إجمالي التكلفة</th><th>الربح</th></tr></thead><tbody>'+
  breakdown.map(function(r){ return '<tr><td>'+r.name+'</td><td>'+r.qty+'</td><td>'+r.saleTotal.toFixed(2)+'</td><td>'+r.costTotal.toFixed(2)+'</td><td>'+r.profit.toFixed(2)+'</td></tr>'; }).join('')+'</tbody></table>';
}

/* ========== USERS TAB (admin only) ========== */
function renderUsers(){
  if(CURRENT_USER.role!=='admin'){ document.getElementById('tabContent').innerHTML='<p>غير مسموح</p>'; return; }
  var users = getUsers();
  var rows = users.map(function(u){
    return '<tr><td>'+u.displayName+'</td><td>'+(u.role==='admin'?'مدير':'كاشير')+'</td><td>'+
    '<button class="btn-xs" onclick="openChangePasswordModal(\''+u.id+'\')">🔑 تغيير كلمة المرور</button> '+
    (u.id!==CURRENT_USER.id? '<button class="btn-xs btn-danger" onclick="deleteUser(\''+u.id+'\')">🗑️ حذف</button>':'')+
    '</td></tr>';
  }).join('');
  document.getElementById('tabContent').innerHTML = '<div class="row-flex"><h2>👥 إدارة المستخدمين</h2><button class="btn btn-primary" onclick="openAddUserModal()">+ إضافة مستخدم</button></div>'+
  '<table class="data-table"><thead><tr><th>الاسم</th><th>الصلاحية</th><th>إجراءات</th></tr></thead><tbody>'+rows+'</tbody></table>';
}
function openAddUserModal(){
  showModal('<h3>إضافة مستخدم</h3><label>الاسم</label><input id="newUserName"><label>كلمة المرور</label><input id="newUserPass"><label>الصلاحية</label><select id="newUserRole"><option value="cashier">كاشير</option><option value="admin">مدير</option></select><button class="btn btn-primary" onclick="submitAddUser()">حفظ</button>');
}
function submitAddUser(){
  var name = document.getElementById('newUserName').value.trim();
  var pass = document.getElementById('newUserPass').value;
  var role = document.getElementById('newUserRole').value;
  if(!name||!pass){ alert('أدخل بيانات صحيحة'); return; }
  var users = getUsers();
  if(users.find(function(u){return u.username===name;})){ alert('يوجد مستخدم بهذا الاسم بالفعل'); return; }
  users.push({id:genId('user'), username:name, password:pass, role:role, displayName:name});
  saveUsers(users);
  closeModal();
  renderUsers();
}
function deleteUser(id){
  if(!confirm('هل أنت متأكد من حذف هذا المستخدم؟')) return;
  var users = getUsers().filter(function(u){return u.id!==id;});
  saveUsers(users);
  renderUsers();
}
function openChangePasswordModal(userId){
  showModal('<h3>تغيير كلمة المرور</h3><label>كلمة المرور الجديدة</label><input id="newPassVal"><button class="btn btn-primary" onclick="submitChangePassword(\''+userId+'\')">حفظ</button>');
}
function submitChangePassword(userId){
  var val = document.getElementById('newPassVal').value;
  if(!val){ alert('أدخل كلمة مرور'); return; }
  var users = getUsers();
  var u = users.find(function(x){return x.id===userId;});
  if(!u){ alert('تعذر العثور على المستخدم'); return; }
  u.password = val;
  saveUsers(users);
  closeModal();
  alert('تم تغيير كلمة المرور بنجاح');
}

/* ========== RESET (admin only) ========== */
function resetAllData(){
  if(CURRENT_USER.role!=='admin'){ alert('غير مسموح'); return; }
  if(!confirm('هل أنت متأكد تماماً؟ سيتم حذف كل البيانات من جميع الأجهزة نهائياً!')) return;
  if(!confirm('تأكيد أخير: لا يمكن التراجع عن هذا الإجراء. متابعة؟')) return;
  var batch = db.batch();
  SYNC_KEYS.forEach(function(key){ batch.delete(db.collection('cashier_data').doc(key)); });
  batch.commit().then(function(){ alert('تم حذف جميع البيانات'); window.location.reload(); });
}
</script>
